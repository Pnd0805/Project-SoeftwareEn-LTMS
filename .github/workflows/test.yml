name: Backend Tests

on:
  push:
    # BE_KN คือสาขาหลักของฝั่ง backend โดยพฤตินัย (origin/main ตามไม่ทัน ~230 commit
    # และไม่มีโฟลเดอร์ database/migrations เลย) — เดิมไม่มีชื่อนี้ในลิสต์ ทำให้ CI
    # ไม่เคยรันบนสาขาที่ทุกคนทำงานอยู่จริง และของที่ build พังค้างอยู่ 2 วันไม่มีใครรู้
    branches: [BE_KN, main, master, backend]
  pull_request:
    branches: [BE_KN, main, master]

jobs:
  build:
    name: Build (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # 3–5 ต.ค. npm run build พังอยู่สองวันโดยไม่มีสัญญาณอะไรเลย เพราะ CI รันแค่เทส
      # และ vitest ไม่ compile ⇒ โค้ดที่ tsc ปฏิเสธก็ยังเทสเขียวได้
      # ★ job นี้คือด่านที่ทำให้เรื่องนั้นเกิดซ้ำไม่ได้ — ไม่ต้องมีฐานข้อมูล ไม่ต้องมี .env
      - name: Compile with tsc
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────
  # 5 ต.ค. เขียนไว้ว่า "ยังไม่เปิด job นี้ เพราะมี error ค้าง 9 ตัวในไฟล์เทสของสามคน
  # ⇒ เปิดเมื่อ npm run typecheck เหลือ 0" — 27 ต.ค. error ทั้ง 9 ตัวหายแล้ว จึงเปิดตามเงื่อนไขเดิม
  #
  # ★ ต่างจาก job build ตรงขอบเขต ไม่ใช่ความเข้มงวด:
  #     build  = tsconfig.build.json → เฉพาะ src/ ที่ขึ้น production
  #     ตัวนี้ = tsconfig.json (src/ + ไฟล์เทสทั้งหมด) แล้วต่อด้วย perf/tsconfig.json
  #   ⇒ ไฟล์เทสและสคริปต์ perf เพิ่งมีด่านใน CI ครั้งแรกวันนี้ (เดิมพังได้โดยไม่มีสัญญาณ
  #   เพราะ vitest ไม่ compile และ perf ไม่มีใครรันบน CI)
  # 🔴 ถ้า job นี้แดงค้าง **ห้ามปิดทิ้ง** ให้แก้ error หรือถอยเป็น tsc --noEmit อย่างเดียวก่อน
  #   CI ที่คนเรียนรู้ที่จะมองข้าม แย่กว่าไม่มี CI
  typecheck:
    name: Typecheck (src + tests + perf)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ไม่ต้องมีฐานข้อมูลและไม่ต้องมี .env เหมือน job build
      - name: Typecheck
        run: npm run typecheck

  test:
    name: Unit tests (fast)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run fast unit tests
        run: npm test

  test-slow:
    name: Unit tests (slow — bcrypt/jwt)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run slow unit tests
        run: npm run test:slow

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run full suite with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage
          retention-days: 14
