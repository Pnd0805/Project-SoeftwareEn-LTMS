services:
  mysql:
    image: mysql:8
    container_name: ltms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ltms
    # เปิดพอร์ตออกโฮสต์ — dev รัน backend บนเครื่อง (npm run dev / npm run migrate) จึงต้องถึง
    # mysql ทาง localhost ชื่อ `mysql` ใช้ได้เฉพาะ container ที่อยู่ในเน็ตเวิร์ก docker เดียวกัน
    # 🔴 6 ต.ค. — ก่อนหน้านี้ไฟล์นี้ไม่มี ports: เลย แต่ container ที่ทุกคนรันอยู่มี 3307
    #   ⇒ container นั้นไม่ได้เกิดจากไฟล์นี้ ใครสั่ง `docker compose down && up` พอร์ตจะหายไป
    #     แล้ว DB_PORT=3307 ใน .env จะต่อไม่ติด เหมือนฐานพัง ทั้งที่ฐานปกติ
    #     และคนที่ clone ใหม่ไม่มีพอร์ตให้ต่อตั้งแต่แรก ⇒ เติมให้ตรงกับของที่รันอยู่จริง
    # 3307 ไม่ใช่ 3306 เพราะหลายเครื่องมี MySQL ของตัวเองจับ 3306 ไว้แล้ว
    # ผูกกับ 127.0.0.1 เหมือน minio/mailpit — ไม่เปิดฐานออก LAN
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio
    container_name: ltms-minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    command: server /data --console-address ":9001"
    # เปิดพอร์ตออกโฮสต์ — dev รัน backend บนเครื่อง (npm run dev) จึงต้องถึง minio ทาง localhost
    # และ presigned URL / public image URL ถูกส่งไปให้เบราว์เซอร์เปิด ซึ่งเข้าชื่อ `minio` ในเน็ตเวิร์ก docker ไม่ได้
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/mc
    container_name: ltms-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID} ${S3_SECRET_ACCESS_KEY}; do echo 'waiting for minio...'; sleep 1; done;
      mc mb --ignore-existing local/${S3_BUCKET:-ltms-uploads};
      mc anonymous set download local/${S3_BUCKET:-ltms-uploads}/avatar;
      mc anonymous set download local/${S3_BUCKET:-ltms-uploads}/team_logo;
      "
    restart: "no"

  mailpit:
    image: axllent/mailpit
    container_name: ltms-mailpit
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # หน้าเว็บดูเมล
    restart: unless-stopped

############ build image ############

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - S3_ENDPOINT=http://minio:9000
    depends_on :
      mysql:
        condition : service_healthy
      minio:
        condition : service_started
    restart: unless-stopped

  nginx:
    build:
      context: ../../ltms-frontend/frontend/
      dockerfile : Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on : 
      - backend
    restart: unless-stopped


volumes:
  mysql_data:
  minio_data:
