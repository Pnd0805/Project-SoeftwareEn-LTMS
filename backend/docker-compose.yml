services:
  mysql:
    image: mysql:8
    container_name: ltms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ltms
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio
    container_name: ltms-minio
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/mc
    container_name: ltms-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID} ${S3_SECRET_ACCESS_KEY}; do echo 'waiting for minio...'; sleep 1; done;
      mc mb --ignore-existing local/${S3_BUCKET:-ltms-uploads};
      "
    restart: "no"

############ build image ############

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - DB_HOST=mysql
      - S3_ENDPOINT=http://minio:9000
    depends_on :
      mysql:
        condition : service_healthy
      minio:
        condition : service_started
    restart: unless-stopped

  nginx:
    build:
      context: ../../ltms-frontend/frontend/
      dockerfile : Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on : 
      - backend
    restart: unless-stopped


volumes:
  mysql_data:
  minio_data:
