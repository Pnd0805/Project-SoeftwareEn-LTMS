services:
  mysql:
    image: mysql:8
    container_name: ltms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: ltms
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psecret"]
      interval: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio
    container_name: ltms-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: secret123
    ports:
      - "9000:9000"   # S3 API endpoint
      - "9001:9001"   # web console (เข้าดูไฟล์ผ่าน browser ได้)
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # สร้าง bucket ให้อัตโนมัติตอน docker compose up (รันครั้งเดียวแล้วจบ) — มีอยู่แล้วก็ข้าม
  # ไม่มี bucket = M16/P05 ที่แตะไฟล์พังทันที · production (AWS S3 จริง) สร้าง bucket เองครั้งเดียวตอน deploy
  minio-init:
    image: quay.io/minio/mc
    container_name: ltms-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin secret123; do echo 'waiting for minio...'; sleep 1; done;
      mc mb --ignore-existing local/${S3_BUCKET:-ltms-uploads};
      "
    restart: "no"

volumes:
  mysql_data:
  minio_data:
