/* The draw, by hand. One select per starting position, pre-filled with the draw
   as it stands, so rearranging is editing what is there rather than building it
   again from nothing. Locked the moment the first match starts. Also the only
   way to seed a bracket without a random draw — arrange() builds the bracket
   from these positions whether or not one already exists. */
function drawPanel(t, approved){
  if (formatOf(t) === "roundrobin") return "";
  const ids = approved.map(r => r.team);
  const need = formatOf(t) === "double" ? 4 : 2;
  if (ids.length < need) return `<div class="panel quiet vstack">
    <div class="tag"><em>//</em> Arrange the draw by hand</div>
    <div class="sub">Needs at least ${need} approved squads${formatOf(t) === "double" ? " — double elimination needs a losers bracket to put them in" : ""}. ${ids.length} approved so far.</div>
  </div>`;
  const started = t.drawn && drawStarted(t);
  const first = t.drawn ? matchesOf(t.id).filter(m => m.round === 0).sort((a,b) => a.slot - b.slot) : [];
  const order = [];
  first.forEach(m => { order[m.slot * 2] = m.a; order[m.slot * 2 + 1] = m.b; });
  const positions = ids.map((_, i) => order[i] || ids[i]);
  /* Paired i / size-1-i, same as buildSingle's own seeding (see seedOrder) — a
     shape the eye reads as a bracket instead of a stack of unlabeled dropdowns,
     and the pairing shown here is exactly the pairing a submit produces. */
  const size = 1 << Math.ceil(Math.log2(Math.max(2, positions.length)));
  const slot = i => positions[i] === undefined
    ? `<span class="brow"><span class="nm sub">— bye —</span></span>`
    : `<span class="brow"><select id="ar-${i}" style="width:100%;background:transparent;border:0;color:inherit;font:inherit;font-size:15px">
        ${ids.map(x => `<option value="${x}"${x === positions[i] ? " selected" : ""}>${esc(team(x) ? team(x).name : x)}</option>`).join("")}
      </select></span>`;
  return `<div class="panel quiet vstack">
    <div class="spread"><span class="tag"><em>//</em> Arrange the draw by hand</span>
      ${started ? badge("neutral","Locked — the tournament has started") : t.drawn ? badge("warn","Open until the first match starts") : badge("neutral","Not drawn yet")}</div>
    ${started ? ``
    : `
      <div class="bracket" style="padding:12px 0"><div class="bcol">
        ${Array.from({ length: size >> 1 }, (_, i) => i).map(i => `<div class="bnode">
          <span class="bhead"><span class="tag"><em>//</em> Match ${i + 1}</span></span>
          ${slot(i)}${slot(size - 1 - i)}
        </div>`).join("")}
      </div></div>
      <button class="btn primary" style="align-self:flex-start" data-act="arrange" data-id="${t.id}">${t.drawn ? "Save this draw" : "Draw this way"}</button>`}
  </div>`;
}

/* When, where, and who is on it — per match, once the bracket exists. Appointment
   to the tournament makes somebody eligible; this is what makes them responsible,
   and PERM.enter only lets the referees named here record the result.

   One fixture drawn as a card: labelled fields while it can still be changed, the
   same four facts read-only once check-in has started. This used to be a row in a
   seven-column table, where the referee pickers were the last two columns — beside
   a rail they squeezed to nothing and the officials effectively vanished. Rendered
   by both the manage tab and #/m/<id>/fixture; the field ids are unchanged, so one
   assign handler reads either. */
function fixtureCard(m, t){
  const refs = (t.referees || []).map(id => user(id)).filter(Boolean);
  const need = refsNeeded(t);
  const local = iso => { const d = new Date(iso); if (isNaN(d.getTime())) return "";
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const open = x => x.status === "scheduled" && !(x.checkedIn || []).length;
  return `<div class="panel quiet vstack">
    <div class="spread">
      <span class="hstack" style="gap:8px"><span class="badge neutral">${esc(matchTag(m))}</span>
        <b>${m.a && m.b ? `${esc(team(m.a).name)} v ${esc(team(m.b).name)}` : esc(matchStage(m))}</b></span>
      ${open(m) ? "" : badge(m.status === "scheduled" ? "ok" : "neutral", m.status === "scheduled" ? "Checked in — locked" : m.status)}
    </div>
    ${open(m) ? `
      <div class="grid2">
        <div class="field"><label for="as-k-${m.id}">Kick-off</label>
          <input id="as-k-${m.id}" type="datetime-local" value="${local(m.kickoff)}"></div>
        <div class="field"><label for="as-v-${m.id}">Venue</label>
          <input id="as-v-${m.id}" value="${esc(m.venue || "")}" placeholder="Court 9"></div>
      </div>
      <div class="field"><label for="as-p-${m.id}">Map pin</label>
        <input id="as-p-${m.id}" value="${esc(pinText(matchPin(m)))}" placeholder="Maps link or 13.7367, 100.5232"></div>
      <div class="field"><label>Referees — at least ${need}, as many as you like</label>
        <div class="tblwrap"><table>
          <tr><th>On</th><th>Referee</th></tr>
          ${refs.map(u => `<tr>
            <td><input type="checkbox" id="as-r-${m.id}-${u.id}"${(m.refs||[]).includes(u.id)?" checked":""} aria-label="Put ${esc(u.name)} on this match"></td>
            <td>${esc(u.name)}</td></tr>`).join("")}
        </table></div>
        ${refs.length < need ? `<div class="sub">Only ${refs.length} referee${refs.length===1?"":"s"} accepted so far — appoint more from the Referees tab.</div>` : ""}
      </div>
      <button class="btn primary" style="align-self:flex-start" data-act="assign" data-id="${m.id}">Save this fixture</button>`
    : `<div class="facts">
        <div><span class="k">Kick-off</span><span class="f">${esc(fmtDate(m.kickoff))}</span></div>
        <div><span class="k">Venue</span><span class="f">${venueLine(m.venue, matchPin(m))}</span></div>
        <div><span class="k">Map pin</span><span class="f">${matchPin(m) ? venueLine("Map", matchPin(m)) : "—"}</span></div>
        <div><span class="k">Referees</span><span class="f">${(m.refs || []).map(r => esc(user(r) ? user(r).name : "—")).join(", ") || "nobody named"}</span></div>
      </div>`}
  </div>`;
}

/* Officiating is not a role and not a granted right — any student can be asked.
   That makes the candidate list the whole roll, so it is searched, never scrolled:
   who is already on the match sits at the top, everyone else appears as you type.

   ponytail: every student is rendered hidden and filtered in the DOM. Fine at a few
   hundred; past a few thousand, filter server-side and render only the matches. */
function refereePanel(t, need){
  const accepted = t.referees || [];
  const pending = S.refInvites.filter(i => i.tour === t.id && i.status === "pending");
  const cands = S.users.filter(x => x.role !== "Admin" && !accepted.includes(x.id));
  const onIt = accepted.map(id => ({ u: user(id), state: "accepted" }))
    .concat(pending.map(i => ({ u: user(i.user), state: "pending" })))
    .filter(x => x.u);
  return `<div class="panel quiet vstack">
    <div class="spread">
      <span class="tag"><em>//</em> Referees — an ${esc(t.channel)} match needs ${need}</span>
      ${badge(accepted.length >= need ? "ok" : "warn", `${accepted.length} of ${need} accepted`)}
    </div>
    ${accepted.length < need ? `<div class="banner warn">${ic("warn",16)}<span class="grow">
      <b>${need - accepted.length} more must accept before this can be published.</b> An invitation counts only once it is answered.</span></div>` : ""}

    ${onIt.length ? `<div class="tblwrap"><table>
      <tr><th>On this tournament</th><th>Faculty</th><th>State</th><th></th></tr>
      ${onIt.map(({ u, state }) => `<tr>
        <td><span class="hstack"><span class="avatar">${esc(u.name[0])}</span>${esc(u.name)}</span></td>
        <td class="sub">${esc(u.faculty)} · Year ${u.year}</td>
        <td>${state === "accepted" ? badge("ok","Accepted") : badge("warn","Invited — waiting")}</td>
        <td><button class="btn ghost" data-act="ref" data-id="${t.id}" data-u="${u.id}">Remove</button></td></tr>`).join("")}
    </table></div>` : ``}

    <button class="btn primary" style="align-self:flex-start" data-act="refappoint" data-id="${t.id}">Appoint a referee</button>
    
  </div>`;
}

/* Searching the whole roll is a job with one answer, so it opens over the page
   rather than sitting under it: the panel says how the tournament stands, the
   modal is where the standing gets changed. Filtering is done in place by the
   input listener — render() would rebuild the box and drop the caret. */
function refereeFinder(t){
  const need = refsNeeded(t), accepted = (t.referees || []).length;
  const cands = S.users.filter(x => x.role !== "Admin" && !(t.referees || []).includes(x.id));
  return `<div class="vstack">
    <div class="tag"><em>//</em> Appoint a referee — an ${esc(t.channel)} match needs ${need}</div>
    <h3 style="margin:0;font-size:20px">${esc(t.name)}</h3>
    
    <div class="field">
      <label for="ref-find">Search the roll by name</label>
      <input id="ref-find" data-act="reffind" autocomplete="off" placeholder="Start typing a name…">
    </div>
    <div id="ref-cands" style="display:none"><div class="tblwrap"><table>
      ${cands.map(x => `<tr data-name="${esc(x.name.toLowerCase())}" style="display:none">
        <td><span class="hstack"><span class="avatar">${esc(x.name[0])}</span>${esc(x.name)}</span></td>
        <td class="sub">${esc(x.faculty)} · Year ${x.year}</td>
        <td style="text-align:right"><button class="btn primary" data-act="ref" data-id="${t.id}" data-u="${x.id}" data-from="modal">Invite to officiate</button></td></tr>`).join("")}
    </table></div></div>
    
    <div class="hstack"><button class="btn ghost" data-act="closemodal">Done</button></div>
  </div>`;
}

/* The scoresheet a sport actually asks for. Player figures on the left, and only
   the team figures no sum of players can produce below them — the derived ones
   appear on the confirmed match, worked out rather than typed. */
function statEntry(m, t){
  const L = statLabels(t.sport), extra = statExtra(t.sport), tm = statTeam(t.sport);
  if (!L.g && !tm.length)
    return ``;
  const num = (id, w = 74) => `<input id="${id}" type="number" min="0" max="999" value="0" style="width:${w}px">`;
  return `${L.g ? `
    <div class="tag"><em>//</em> ${esc(t.sport)} — per player. These feed the top scorers and every profile.</div>
    <div class="tblwrap"><table>
      <tr><th>Player</th><th>Squad</th><th>${esc(L.g)}</th>${L.a ? `<th>${esc(L.a)}</th>` : ""}
        ${extra.map(([, lab]) => `<th>${esc(lab)}</th>`).join("")}</tr>
      ${[m.a, m.b].flatMap(tid => lineupOf(m, tid).map(pid => `<tr>
        <td>${esc(user(pid).name)}</td><td>${chip(tid)}</td>
        <td>${num("st-g-" + pid)}</td>
        ${L.a ? `<td>${num("st-a-" + pid)}</td>` : ""}
        ${extra.map(([k]) => `<td>${num(`st-x-${k}-${pid}`)}</td>`).join("")}</tr>`)).join("")}
    </table></div>` : ""}
    ${tm.length ? `
    <div class="tag"><em>//</em> Per team — only what no player total can produce</div>
    <div class="tblwrap"><table>
      <tr><th>Squad</th>${tm.map(([, lab]) => `<th>${esc(lab)}</th>`).join("")}</tr>
      ${[m.a, m.b].map(tid => `<tr><td>${chip(tid)}</td>
        ${tm.map(([k, , kind]) => `<td>${kind === "text"
          ? `<input id="tm-${k}-${tid}" placeholder="25-20, 25-18" style="width:150px">`
          : num(`tm-${k}-${tid}`)}</td>`).join("")}</tr>`).join("")}
    </table></div>
    ` : ""}`;
}

/* — match detail — */
function tabCommunity(t, org){
  const f = feedbackOf(t.id), u = me();
  const mine = u ? f.rows.find(x => x.by === u.id) : null;
  const talked = matchesOf(t.id).map(m => ({ m, n: commentsOf(m.id).length })).filter(x => x.n).sort((a, b) => b.n - a.n);
  const stars = n => `${n} out of 5`;
  return `<div class="grid2">
    <div class="panel quiet vstack">
      <div class="spread"><span class="tag"><em>//</em> How it was run</span>
        ${f.count ? badge(f.avg >= 4 ? "ok" : f.avg >= 3 ? "warn" : "crit", stars(f.avg)) : badge("neutral","No ratings yet")}</div>
      <div class="statline">
        <div><span class="tag">Average</span><span class="v">${f.count ? f.avg : "—"}</span></div>
        <div><span class="tag">Ratings</span><span class="v">${f.count}</span></div>
      </div>
      
    </div>
    <div class="panel quiet vstack">
      <div class="tag"><em>//</em> ${org ? "Your tournament" : mine ? "Your feedback" : "Tell the organizer"}</div>
      ${org ? ``
        : !u ? ``
        : `<div class="field"><label for="fb-rating">Rating — 1 to 5</label>
            <select id="fb-rating">${[5,4,3,2,1].map(n => `<option value="${n}" ${mine && mine.rating === n ? "selected" : ""}>${stars(n)}</option>`).join("")}</select></div>
          <div class="field"><label for="fb-text">What would you change?</label>
            <textarea id="fb-text" rows="3" maxlength="600" placeholder="Only the organizer reads this.">${mine ? esc(mine.text) : ""}</textarea></div>
          <button class="btn primary" style="align-self:flex-start" data-act="feedback" data-id="${t.id}">${mine ? "Update my feedback" : "Send to the organizer"}</button>
          ${mine ? `` : ""}`}
    </div>
  </div>
  <div class="panel quiet vstack">
    <div class="tag"><em>//</em> Match threads · ${talked.length}</div>
    ${talked.length ? `<div class="tblwrap"><table>
      <tr><th>Match</th><th>Round</th><th>Comments</th><th></th></tr>
      ${talked.map(({ m, n }) => `<tr>
        <td><span class="hstack" style="gap:7px">${chipLink(m.a)}<span class="tag">vs</span>${chipLink(m.b)}</span></td>
        <td class="tag">${esc(matchTag(m))}</td>
        <td class="num">${n}</td>
        <td><button class="btn ghost" data-act="nav" data-h="#/m/${m.id}">Open the thread</button></td></tr>`).join("")}
    </table></div>` : ``}
  </div>`;
}

function viewMatch(id, tabParam){
  const m = S.matches.find(x => x.id === id);
  if (!m) return `<div class="empty">${ic("warn",26)}<b>No such match</b></div>`;
  const t = tour(m.tour), u = me();
  const A = team(m.a), B = team(m.b);
  const isReferee = u && (m.refs||[]).includes(u.id);
  const winner = m.status === "pending" ? winnerId(m) : winnerOf(m);
  const leaderOfWinner = winner && u && team(winner).leader === u.id;
  const anyLeader = u && [m.a,m.b].filter(Boolean).some(x => team(x).leader === u.id);
  const bothIn = A && B;

  let action = ``;

  if (!bothIn){
    action = `<div class="banner warn">${ic("clock",17)}<span class="grow">This match is waiting on earlier rounds. Both places fill in automatically when the feeding matches are confirmed.</span></div>`;
  } else if (m.status === "scheduled" && ((t.channel === "onsite" && isReferee) || (t.channel === "online" && anyLeader))){
    const who = t.channel === "onsite" ? "Referee" : "Winning team leader";
    action = `<div class="panel vstack">
      <div class="tag"><em>//</em> ${esc(who)} — enter the result</div>
      ${t.channel === "onsite" ? ``
        : ``}
      <div class="tag"><em>//</em> ${esc(scoreUnit(t.sport))}</div>
      <div class="grid2" style="max-width:420px">
        <div class="field"><label for="sc-a">${esc(A.name)}</label><input id="sc-a" type="number" min="0" max="999" value="0"></div>
        <div class="field"><label for="sc-b">${esc(B.name)}</label><input id="sc-b" type="number" min="0" max="999" value="0"></div>
      </div>
      <div class="tag"><em>//</em> ${esc(deciderName(t.sport))} — only if the ${esc(scoreUnit(t.sport).toLowerCase())} finish level</div>
      <div class="grid2" style="max-width:420px">
        <div class="field"><label for="dc-a">${esc(A.name)}</label><input id="dc-a" type="number" min="0" max="99" placeholder="—"></div>
        <div class="field"><label for="dc-b">${esc(B.name)}</label><input id="dc-b" type="number" min="0" max="99" placeholder="—"></div>
      </div>
      
      ${statEntry(m, t)}
      <button class="btn primary" style="align-self:flex-start" data-act="enter" data-id="${m.id}">Submit result</button>
    </div>`;
  } else if (m.status === "pending"){
    const confirmerIsMe = t.channel === "onsite" ? leaderOfWinner : isReferee;
    const label = t.channel === "onsite" ? "winning team leader" : "referee";
    action = confirmerIsMe ? `<div class="panel vstack">
        <div class="tag"><em>//</em> Your confirmation</div>
        <div class="banner warn">${ic("warn",16)}<span class="grow">${t.channel==="onsite"
          ? "<b>You won, so you confirm.</b> The losing side does not sign off — they raise a dispute instead."
          : "<b>You are the referee.</b> Check the submitted score against the record before confirming."}</span></div>
        <div class="hstack">${t.channel === "onsite" ? `<button class="btn danger" data-act="dispute" data-id="${m.id}">Dispute result</button>` : ""}
          <button class="btn primary" data-act="confirm" data-id="${m.id}">Confirm result</button></div>
      </div>`
      : `<div class="panel quiet vstack">
        <div class="tag"><em>//</em> Waiting</div>
        <div class="sub">Entered by ${esc(user(m.enteredBy) ? user(m.enteredBy).name : "—")}. Waiting on the ${esc(label)} to confirm.</div>
        ${anyLeader && t.channel === "onsite" ? `<button class="btn danger" style="align-self:flex-start" data-act="dispute" data-id="${m.id}">Dispute this result</button>` : ""}
        ${isOrg(t) ? `<div class="banner warn">${ic("warn",16)}<span class="grow"><b>Nobody has signed this off.</b>
            You can confirm it yourself — it is recorded as your decision, with your name on it, and both leaders are told.</span>
            <button class="btn primary" data-act="orgconfirm" data-id="${m.id}">Confirm it myself</button></div>` : ""}
      </div>`;
  } else if (m.status === "disputed"){
    action = isOrg(t) ? `<div class="panel vstack">
        <div class="tag"><em>//</em> Resolve the dispute — your decision is final</div>
        <div class="banner crit">${ic("warn",16)}<span class="grow"><b>${esc(disputeName(m))}</b> disputed the result. Recording a new score closes the dispute and advances the bracket.</span></div>
        <div class="grid2" style="max-width:420px">
          <div class="field"><label>${esc(A.name)}</label><input id="sc-a" type="number" min="0" value="${m.sa}"></div>
          <div class="field"><label>${esc(B.name)}</label><input id="sc-b" type="number" min="0" value="${m.sb}"></div>
        </div>
        <button class="btn primary" style="align-self:flex-start" data-act="resolve" data-id="${m.id}">Record the final score</button>
      </div>`
      : `<div class="banner crit">${ic("warn",17)}<span class="grow"><b>Under dispute.</b> ${esc(disputeName(m))} contested this result. The organizer decides.</span></div>`;
  } else if (m.status === "confirmed"){
    action = `<div class="banner ok">${ic("check",17)}<span class="grow"><b>Confirmed.</b> ${winner?esc(team(winner).name)+" advanced.":""} ${t.champion===winner&&m.round===t.rounds-1?"They won the tournament.":""}</span></div>`;
  }

  const canCheckIn = u && bothIn && [m.a,m.b].some(x => team(x).members.includes(u.id)) && m.status !== "confirmed";

  const overviewTab = `
    ${action}
  ${m.status === "confirmed" && isOrg(t) && !dependentsPlayed(m) ? `<div class="panel quiet vstack">
    <div class="tag"><em>//</em> Organizer override</div>
    <div class="sub">Nothing has been played on top of this result yet, so it can still be reopened for review.</div>
    <button class="btn danger" style="align-self:flex-start" data-act="reopen" data-id="${m.id}">Reopen this result</button></div>` : ""}
  ${m.replay ? `<div class="panel quiet vstack"><div class="tag"><em>//</em> Replay</div>
    <a class="btn primary" style="align-self:flex-start" href="${esc(m.replay)}" target="_blank" rel="noopener">${ic("match",13)} Watch the replay</a>
    </div>` : ""}
  ${m.status === "confirmed" && isOrg(t) ? `<div class="panel quiet vstack">
    <div class="tag"><em>//</em> Replay link — organizer only</div>
    <div class="field"><label for="rp-${m.id}">Link to video of this match</label>
      <input id="rp-${m.id}" value="${esc(m.replay || "")}" placeholder="https://…"></div>

    <button class="btn primary" style="align-self:flex-start" data-act="replay" data-id="${m.id}">Save replay link</button></div>` : ""}
  ${canCheckIn ? `<div class="panel quiet vstack"><div class="tag"><em>//</em> Check-in</div>
    <div class="hstack"><button class="btn" data-act="nav" data-h="#/checkin/${m.id}">Go to check-in</button>
      <span class="sub">${m.checkedIn.length} player${m.checkedIn.length===1?"":"s"} checked in.</span></div></div>` : ""}
  ${isReferee && bothIn ? `<div class="hstack"><button class="btn" data-act="nav" data-h="#/checkin/${m.id}">Check-in console</button></div>` : ""}`;

  const statsTab = statSheet(m, t) || `<div class="empty">${ic("match",22)}<b>No statistics yet</b>
    <span class="sub">Recorded once the result is entered.</span></div>`;

  const tabs = ["overview","lineup","stats","progress","community"];
  const tab = tabs.includes(tabParam) ? tabParam : "overview";
  const tabBody = tab === "lineup" ? lineupPanel(m, t)
    : tab === "stats" ? statsTab
    : tab === "progress" ? resultTrail(m, t)
    : tab === "community" ? socialBar(m)
    : overviewTab;

  return `
  <div class="crumb"><button data-act="nav" data-h="#/t/${t.id}">${ic("chevL",11)} ${esc(t.name)}</button>
    <span class="sub" aria-hidden="true">/</span><span style="color:var(--bone)">${esc(matchTag(m))}</span></div>
  <div class="spread"><h1 class="disp" style="font-size:28px">${esc(matchStage(m))}</h1>${statusBadge(m)}</div>
  <div class="split">
    <div>
      ${scorebug(m)}
      <div class="tabs">${tabs.map(x => `<button class="tab ${x===tab?"on":""}" data-act="nav" data-h="#/m/${m.id}/${x}">${x==="community"?"Community":x}</button>`).join("")}</div>
      ${tabBody}
    </div>
    <div class="rail">
      <div class="panel vstack">
        <span class="tag"><em>//</em> The details</span>
        <div class="facts">
          <div><span class="k">Kick-off</span><span class="f">${esc(fmtDate(m.kickoff))}</span></div>
          <div><span class="k">Venue</span><span class="f">${venueLine(m.venue, matchPin(m))}</span></div>
          <div><span class="k">Played</span><span class="f">${esc(m.channel)}</span></div>
          <div><span class="k">Referees</span><span class="f">${(m.refs||[]).map(r=>esc(user(r) ? user(r).name : "—")).join(", ")||"none assigned"}</span></div>
          <div><span class="k">Stage</span><span class="f">${esc(matchStage(m))}</span></div>
        </div>
        ${isOrg(t) && m.status === "scheduled" && !(m.checkedIn || []).length
          ? `<button class="btn" data-act="fixtureopen" data-id="${m.id}">${ic("clock",13)} Edit the fixture</button>
             ` : ""}
      </div>
    </div>
  </div>`;
}

/* The team sheet, for the leader of a squad in this match. Three states per
   player and nothing else — starting, on the bench, or not in this one. */
function lineupPanel(m, t){
  const u = me(); if (!u || m.status !== "scheduled") return lineupRead(m, t);
  const tid = [m.a, m.b].filter(Boolean).find(x => team(x) && team(x).leader === u.id);
  if (!tid) return lineupRead(m, t);
  const tm = team(tid), named = m.lineup && m.lineup[tid];
  const starters = startersOf(m, tid), subs = named ? (named.subs || []) : [];
  const state = id => starters.includes(id) ? "start" : subs.includes(id) ? "sub" : named ? "out" : "start";
  return `<div class="panel vstack">
    <div class="spread"><span class="tag"><em>//</em> Your lineup for ${esc(tm.name)}</span>
      ${named ? badge("ok","Named") : badge("warn","Not named — last match's starters play")}</div>
    
    <div class="tblwrap"><table>
      <tr><th>Player</th><th>Faculty</th><th>In this match</th></tr>
      ${tm.members.map(id => { const p = user(id); return `<tr>
        <td>${esc(p.name)}${tm.leader === id ? ` <span class="tag">· leader</span>` : ""}</td>
        <td class="sub">${esc(p.faculty)} · Year ${p.year}</td>
        <td><select id="ln-${id}" aria-label="Role for ${esc(p.name)}">
          ${[["start","Starting"],["sub","Substitute"],["out","Not in this match"]]
            .map(([v, lab]) => `<option value="${v}"${state(id) === v ? " selected" : ""}>${lab}</option>`).join("")}
        </select></td></tr>`; }).join("")}
    </table></div>
    <button class="btn primary" style="align-self:flex-start" data-act="lineup" data-id="${m.id}" data-t="${tid}">Save the lineup</button>
  </div>`;
}
/* and the same thing as a fact, for everybody else */
function lineupRead(m, t){
  const named = m.lineup || {};
  const sides = [m.a, m.b].filter(x => x && named[x] && named[x].starters && named[x].starters.length);
  if (!sides.length) return "";
  return `<div class="panel quiet vstack">
    <div class="tag"><em>//</em> Lineups</div>
    <div class="grid2">${sides.map(tid => `<div class="vstack" style="gap:6px">
      ${chip(tid)}
      <span class="sub">Starting: ${esc(named[tid].starters.map(id => user(id) ? user(id).name : "—").join(", "))}</span>
      ${(named[tid].subs || []).length ? `<span class="sub">Bench: ${esc(named[tid].subs.map(id => user(id) ? user(id).name : "—").join(", "))}</span>` : ""}
    </div>`).join("")}</div></div>`;
}

/* What was recorded, once it is recorded: the players, then the team row — the
   figures that are sums are added up here rather than stored, so they cannot drift
   from the player rows they came from. */
function statSheet(m, t){
  const L = statLabels(t.sport), extra = statExtra(t.sport), tm = statTeam(t.sport);
  const rows = Object.entries(m.stats || {});
  const teamRows = [m.a, m.b].filter(Boolean);
  const entered = m.teamStats || {};
  if (!rows.length && !Object.keys(entered).length) return "";
  return `<div class="panel quiet vstack">
    <div class="tag"><em>//</em> Recorded ${esc(t.sport)} statistics</div>
    ${rows.length ? `<div class="tblwrap"><table>
      <tr><th>Player</th><th>Squad</th><th>${esc(L.g || "Scored")}</th><th>${esc(L.a || "Assists")}</th>
        ${extra.map(([, lab]) => `<th>${esc(lab)}</th>`).join("")}</tr>
      ${rows.map(([pid, st]) => `<tr><td>${playerLink(pid)}</td><td>${chipLink(st.team)}</td>
        <td class="num">${st.goals}</td><td class="num">${st.assists}</td>
        ${extra.map(([k]) => `<td class="num">${(st.x || {})[k] || 0}</td>`).join("")}</tr>`).join("")}
    </table></div>` : ""}
    ${teamRows.length ? `<div class="tag"><em>//</em> Per team — the first columns are added up from the players above</div>
    <div class="tblwrap"><table>
      <tr><th>Squad</th>${L.g ? `<th>${esc(L.g)}</th>` : ""}${L.a ? `<th>${esc(L.a)}</th>` : ""}
        ${extra.map(([, lab]) => `<th>${esc(lab)}</th>`).join("")}
        ${tm.map(([, lab]) => `<th>${esc(lab)}</th>`).join("")}</tr>
      ${teamRows.map(tid => { const tot = teamTotals(m, tid), got = entered[tid] || {};
        return `<tr><td>${chipLink(tid)}</td>
          ${L.g ? `<td class="num">${tot.goals}</td>` : ""}${L.a ? `<td class="num">${tot.assists}</td>` : ""}
          ${extra.map(([k]) => `<td class="num">${tot.x[k] || 0}</td>`).join("")}
          ${tm.map(([k]) => `<td class="num">${got[k] === undefined ? "—" : esc(String(got[k]))}</td>`).join("")}</tr>`; }).join("")}
    </table></div>` : ""}
  </div>`;
}

/* How a result got where it is: check-in, who recorded it, who signed it off, and
   whether the bracket moved. Drawn as a rail rather than a table because it is a
   sequence with one live step — a reader's first question is "who is it waiting on",
   and a three-row grid of badges never answered that. */
function resultTrail(m, t){
  const done = "done", now = "now", idle = "idle", bad = "bad";
  const recorder = t.channel === "onsite" ? "the referees" : "the winning team's leader";
  const signer   = t.channel === "onsite" ? "the winning team's leader" : "the referee";
  const nm = id => (user(id) ? esc(user(id).name) : "—");
  const total = [m.a, m.b].filter(Boolean).reduce((n, x) => n + lineupOf(m, x).length, 0);
  const inCount = m.checkedIn.length;
  const played = m.enteredBy || m.status !== "scheduled";
  const win = winnerOf(m);
  const next = S.matches.find(x => x.tour === m.tour && x.round === m.round + 1 && x.slot === (m.slot >> 1));

  /* A bye is settled without anybody doing anything, so it gets its own short trail
     rather than four steps of "not applicable". */
  if (m.note === "bye"){
    const through = m.a || m.b;
    return `<div class="panel quiet vstack">
      <div class="spread"><span class="tag"><em>//</em> Result trail</span>${badge("neutral","Bye")}</div>
      <div class="trail">
        <div class="st done"><span class="mk">${ic("check",11)}</span><span class="bd">
          <span class="ttl">Bye</span>
          <span class="sub">${through ? esc(team(through).name) : "One squad"} drew an empty slot, so there was no match to play. Byes are spread across the draw rather than paired with each other.</span></span></div>
        <div class="st done"><span class="mk">${ic("check",11)}</span><span class="bd">
          <span class="ttl">Bracket</span>
          <span class="sub">${through ? esc(team(through).name) : "They"} moved straight into ${esc(nextOf(m) ? matchStage(nextOf(m)) : "the next round")}.</span></span></div>
      </div></div>`;
  }

  /* A fixture with an empty side is not waiting on a person — it is waiting on the
     round below it. Presenting check-in or the score as the next step invites a
     referee to act on a match that has no teams in it yet. */
  const bothIn = !!(m.a && m.b);
  const everyoneIn = allCheckedIn(m);
  const feeders = feedersOf(m).filter(x => x.status !== "confirmed" && x.status !== "void");

  const steps = [
    { state: bothIn ? done : now,
      title: "Teams decided",
      note: bothIn ? `${esc(team(m.a).name)} against ${esc(team(m.b).name)}.`
        : feeders.length ? `Waiting on ${feeders.length} match${feeders.length === 1 ? "" : "es"} below it — ${esc(feeders.map(matchStage).filter((x, i, all) => all.indexOf(x) === i).join(", "))}. Both places fill in on their own once those are confirmed.`
        : "Waiting on the earlier round. Both places fill in on their own once it is confirmed." },
    { state: !bothIn ? idle : (played || everyoneIn) ? done : inCount ? now : idle,
      title: "Check-in",
      note: played ? `${inCount} of ${total} players verified before kick-off.`
        : everyoneIn ? `All ${total} players verified. Nothing is left at the table.`
        : inCount ? `${inCount} of ${total} verified. A match opens once each side has somebody through.`
        : "Nobody through yet. Identity and presence are both checked at the table." },
    { state: m.enteredBy ? done : bothIn && (played || everyoneIn) ? now : idle,
      title: "Result recorded",
      note: m.enteredBy
        ? `${nm(m.enteredBy)} recorded ${esc(team(m.a).code)} ${m.sa}–${m.sb} ${esc(team(m.b).code)}${m.decider ? `, settled ${m.decider.a}–${m.decider.b} on ${esc(m.decider.kind.toLowerCase())}` : ""}.`
        : !bothIn ? `Nothing can be recorded against an empty fixture.`
        : `Waiting on ${recorder}. On ${esc(t.channel === "onsite" ? "an on-site" : "an online")} match they enter the score${statLabels(t.sport).g ? " and the per-player statistics" : ""}.` },
  ];
  if (m.disputedBy || m.status === "disputed")
    steps.push({ state: m.status === "disputed" ? bad : done, title: "Disputed",
      note: m.status === "disputed"
        ? `${esc(disputeName(m))} contested the score. The organizer settles it, and their decision is final.`
        : `${esc(disputeName(m))} contested it. The organizer settled the score above.` });
  steps.push({ state: m.status === "confirmed" ? done : m.status === "disputed" ? idle : (bothIn && m.enteredBy) ? now : idle,
    title: "Confirmation",
    note: m.status === "confirmed" ? `${nm(m.confirmedBy)} signed it off${m.confirmedByOrg ? " — the organizer, because nobody else did" : ""}.`
      : m.status === "disputed" ? "Held until the dispute is settled."
      : m.enteredBy ? `Waiting on ${signer}. The other side does not sign off — they raise a dispute instead.`
      : "Nothing to confirm yet." });
  steps.push({ state: m.status === "confirmed" ? done : idle,
    title: "Bracket",
    note: m.status !== "confirmed" ? "Blocked. The next round cannot fill until this result is settled."
      : isLevel(m) ? "Level. Both squads take a point — round robin is the one format where that stands."
      : !win ? "Recorded."
      : next ? `${esc(team(win).name)} moved into ${esc(matchStage(next))}.`
      : formatOf(t) === "roundrobin" ? `Recorded on the table.`
      : `${esc(team(win).name)} won ${esc(t.name)}.` });

  return `<div class="panel quiet vstack">
    <div class="spread"><span class="tag"><em>//</em> Result trail</span>
      ${m.status === "confirmed" ? badge("ok","Settled")
        : m.status === "disputed" ? badge("crit","With the organizer")
        : !bothIn ? badge("neutral","Waiting on the earlier round")
        : badge("warn", "Waiting on " + (m.enteredBy ? signer : recorder))}</div>
    <div class="trail">
      ${steps.map((s, i) => `<div class="st ${s.state}">
        <span class="mk">${s.state === "done" ? ic("check",11) : s.state === "bad" ? "!" : i + 1}</span>
        <span class="bd">
          <span class="ttl">${esc(s.title)}${s.state === "now" ? badge("warn","Now") : ""}</span>
          <span class="sub">${s.note}</span>
        </span></div>`).join("")}
    </div>
  </div>`;
}

/* Pick'em and the conversation are places to spend time, not steps in the match.
   Left on the page they push the result trail — the thing the match is actually for —
   below the fold. So the page carries where each stands and a way in; the doing
   happens over the top, and closing it puts the score back in front of you. */
function socialBar(m){
  const rows = commentsOf(m.id).length;
  const tally = S.picks.filter(p => p.match === m.id).length;
  const mine = me() ? S.picks.find(p => p.match === m.id && p.by === sid()) : null;
  /* not offered rather than refused on click: an official betting on their own
     competition is the conflict, and a button that bounces states it worse */
  const canPick = !!(me() && m.a && m.b && !officiates(m.tour));
  const says = !me() ? "Sign in to call this one."
    : !m.a || !m.b ? "Both squads have to be known first."
    : officiates(m.tour) ? "Closed to you — you officiate this tournament, and whoever decides a result cannot have a stake in it."
    : mine ? `You called ${esc(team(mine.team).name)}.`
    : m.status === "scheduled" ? "You have not called this one."
    : "Predictions closed before you got to it.";
  const outcome = mine && m.status === "confirmed"
    ? (mine.team === winnerOf(m) ? badge("ok", "+1 — you called it") : badge("crit", "0 — wrong call"))
    : mine && m.status === "disputed" ? badge("neutral", "Held until the dispute settles") : "";
  return `<div class="panel quiet vstack">
    <div class="spread"><span class="tag"><em>//</em> Pick'em — ${tally} prediction${tally === 1 ? "" : "s"}</span>${outcome}</div>
    <div class="spread"><span class="sub">${says}</span>
      ${canPick ? `<button class="btn" data-act="pickopen" data-id="${m.id}">${mine ? "Change your call" : m.status === "scheduled" ? "Call it" : "See the split"}</button>` : ""}</div>
  </div>
  <div class="panel quiet vstack">
    <div class="spread"><span class="tag"><em>//</em> Community — ${rows} comment${rows === 1 ? "" : "s"}</span>
      ${isOrg(tour(m.tour)) ? badge("neutral","You moderate this") : ""}</div>
    <div class="spread"><span class="sub">${rows ? "Results speak first, but not last." : "Nothing said yet."}</span>
      <button class="btn" data-act="commentopen" data-id="${m.id}">${rows ? "Read the conversation" : "Start it"}</button></div>
  </div>`;
}

/* The conversation under a match. Public to read, signed-in to write, and the
   organizer of that tournament can take a post down — a thread nobody can moderate
   is a thread that eventually has to be switched off. Rendered into the modal
   socialBar opens, which is the only place it appears. */
function commentBlock(m){
  const rows = commentsOf(m.id), u = me(), org = isOrg(tour(m.tour));
  return `<div class="vstack">
    <div class="spread"><span class="tag"><em>//</em> Community · ${rows.length} comment${rows.length === 1 ? "" : "s"}</span>
      ${org ? badge("neutral","You moderate this") : ""}</div>
    <h3 style="margin:0;font-size:20px">${esc(matchStage(m))}</h3>
    ${rows.length ? `<div class="vstack" style="gap:0">
      ${rows.map(c => { const au = user(c.by); return `<div class="notif" style="align-items:flex-start">
        <span class="avatar">${esc(au ? au.name[0] : "?")}</span>
        <span class="txt"><b>${esc(au ? au.name : "Unknown")}</b>
          <span class="tag" style="margin-left:8px">${esc(fmtDate(c.at))}</span><br>${esc(c.text)}</span>
        ${u && (c.by === u.id || org) ? `<button class="btn ghost" data-act="delcomment" data-id="${c.id}" data-match="${m.id}" data-from="modal">Remove</button>` : ""}
      </div>`; }).join("")}
    </div>` : ``}
    ${u ? `<div class="field">
        <label for="cm-${m.id}">Add a comment</label>
        <textarea id="cm-${m.id}" rows="2" maxlength="500" placeholder="Keep it about the match."></textarea>
      </div>
      <div class="hstack"><button class="btn ghost" data-act="closemodal">Done</button>
        <button class="btn primary" data-act="comment" data-id="${m.id}" data-from="modal">Post</button></div>`
    : `
      <div class="hstack"><button class="btn ghost" data-act="closemodal">Done</button></div>`}
  </div>`;
}

/* — Pick'em: a prediction before kick-off, one point if it lands — */
function pickBlock(m){
  if (!me() || !m.a || !m.b) return "";
  /* an official betting on their own competition is a conflict, so the control is
     not merely refused on click — it is not offered, and the reason is stated */
  if (officiates(m.tour)) return `<div class="vstack">
    <div class="spread"><span class="tag"><em>//</em> Pick'em</span>${badge("neutral","Closed to you")}</div>
    
  </div>`;
  const mine = S.picks.find(p => p.match === m.id && p.by === sid());
  const open = m.status === "scheduled";
  const tally = S.picks.filter(p => p.match === m.id);
  const pct = tid => tally.length ? Math.round(tally.filter(p => p.team === tid).length / tally.length * 100) : 0;
  const outcome = m.status === "confirmed" && mine
    ? (mine.team === winnerOf(m) ? badge("ok", "+1 — you called it") : badge("crit", "0 — wrong call"))
    : m.status === "disputed" && mine ? badge("neutral", "Held until the dispute settles") : "";
  return `<div class="vstack">
    <div class="spread"><span class="tag"><em>//</em> Pick'em — ${open ? "predict the winner" : "predictions closed"}</span>${outcome}</div>
    <h3 style="margin:0;font-size:20px">${esc(matchStage(m))}</h3>
    <div class="grid2">
      ${[m.a, m.b].map(tid => {
        const on = mine && mine.team === tid;
        return `<button class="btn ${on ? "primary" : ""}" data-act="pick" data-id="${m.id}" data-side="${tid}" data-from="modal" ${open ? "" : "disabled"}
          style="justify-content:space-between;padding:13px 16px">
          <span>${esc(team(tid).name)}</span><span class="num">${pct(tid)}%</span></button>`;
      }).join("")}
    </div>
    
    <div class="hstack"><button class="btn ghost" data-act="closemodal">Done</button></div>
  </div>`;
}

/* — Tournament MVP: opens only when the final is confirmed (OF-03) — */
function viewMvp(id){
  const t = tour(id); if (!t) return `<div class="empty">${ic("warn",26)}<b>No such tournament</b></div>`;
  if (!t.champion) return `<div class="empty">${ic("star",28)}<b>MVP voting hasn't opened</b>
    <span class="sub">It opens the moment the final is confirmed — this is a tournament award, not a per-match one.</span>
    <button class="btn" data-act="nav" data-h="#/t/${t.id}">Back to the tournament</button></div>`;
  /* candidates ranked on the statistics referees actually recorded */
  const tally = {};
  matchesOf(t.id).filter(m => m.status === "confirmed").forEach(m =>
    Object.entries(m.stats || {}).forEach(([pid, st]) => {
      tally[pid] = tally[pid] || { goals: 0, assists: 0, team: st.team };
      tally[pid].goals += st.goals; tally[pid].assists += st.assists;
    }));
  let cands = Object.entries(tally).sort((a, b) => (b[1].goals * 2 + b[1].assists) - (a[1].goals * 2 + a[1].assists)).slice(0, 8);
  if (!cands.length) cands = (team(t.champion) ? team(t.champion).members : []).map(p => [p, { goals: 0, assists: 0, team: t.champion }]);
  const votes = S.votes.filter(v => v.tour === t.id);
  const mine = votes.find(v => v.by === sid());
  const pct = pid => votes.length ? Math.round(votes.filter(v => v.player === pid).length / votes.length * 100) : 0;
  return `<div class="crumb"><button data-act="nav" data-h="#/t/${t.id}">${ic("chevL",11)} ${esc(t.name)}</button>
      <span class="sub" aria-hidden="true">/</span><span style="color:var(--bone)">MVP</span></div>
    <div class="spread"><h1 class="disp" style="font-size:30px">Tournament MVP</h1>${badge("ok","Champion · " + esc(team(t.champion).name))}</div>
    <div class="banner ${mine ? "ok" : "warn"}">${ic("star",17)}<span class="grow">${mine
      ? `You voted for <b>${esc(user(mine.player).name)}</b>. One vote per person, and it can't be changed.`
      : "You have <b>one vote for the whole tournament</b>. Candidates are ranked on the statistics referees recorded."}</span></div>
    <div class="panel quiet vstack">
      ${cands.map(([pid, st]) => `<div class="hstack" style="gap:14px">
        <span class="avatar">${esc(user(pid).name[0])}</span>
        <span style="width:190px"><b style="font-size:15px">${esc(user(pid).name)}</b><br>
          <span class="tag">${esc(team(st.team) ? team(st.team).name : "")} · ${st.goals} goals, ${st.assists} assists</span></span>
        <span style="flex:1;height:9px;background:var(--panel-2);position:relative;min-width:80px">
          <i style="position:absolute;inset:0 auto 0 0;width:${pct(pid)}%;background:var(--red)"></i></span>
        <span class="num" style="width:44px;text-align:right">${pct(pid)}%</span>
        ${mine ? "" : `<button class="btn primary" data-act="vote" data-id="${t.id}" data-u="${pid}">Vote</button>`}
      </div>`).join("")}
    </div>
    <span class="tag"><em>//</em> ${votes.length} vote${votes.length === 1 ? "" : "s"} cast</span>`;
}

/* — check-in — */
function viewCheckin(id){
  const m = S.matches.find(x => x.id === id); if (!m) return `<div class="empty">${ic("warn",26)}<b>No such match</b></div>`;
  const t = tour(m.tour), u = me();
  const isReferee = u && (m.refs||[]).includes(u.id);
  const squads = [m.a, m.b].filter(Boolean).map(team);
  const named = tid => lineupOf(m, tid);                 /* check-in applies to the lineup */
  const mine = squads.find(s => u && s.members.includes(u.id));
  return `
  <div class="crumb"><button data-act="nav" data-h="#/m/${m.id}">${ic("chevL",11)} Match</button>
    <span class="sub" aria-hidden="true">/</span><span style="color:var(--bone)">Check-in</span></div>
  <div class="spread"><h1 class="disp" style="font-size:28px">Check in</h1>${badge("warn", t.channel === "onsite" ? "On-site" : "Online")}</div>
  ${isReferee ? (t.channel === "onsite" ? `<div class="panel vstack">
      <div class="spread"><span class="tag"><em>//</em> Show this at the referee's table</span></div>
      <div class="hstack" style="align-items:flex-start;gap:22px">
        <span class="qr">${qr(19, hashCode(qrToken(m.id)))}</span>
        <span class="vstack" style="gap:10px;flex:1;min-width:220px">
          <div class="statline">
            <div><span class="tag">Code</span><span class="v" style="font-family:var(--f-mono);font-size:24px;letter-spacing:.09em">${esc(qrToken(m.id))}</span></div>
            <div><span class="tag">Verified</span><span class="v" style="font-family:var(--f-mono);font-size:24px">${m.checkedIn.length} / ${squads.reduce((n,s)=>n+named(s.id).length,0)}</span></div>
          </div>
          <span class="tag"><em>//</em> Rotates every 60s — a screenshot is worthless a minute later</span>
        </span></div></div>` : `<div class="panel vstack">
      <div class="spread"><span class="tag"><em>//</em> Verified</span><span class="v" style="font-family:var(--f-mono);font-size:24px">${m.checkedIn.length} / ${squads.reduce((n,s)=>n+named(s.id).length,0)}</span></div>
      <div class="field"><label for="rc-${m.id}">Room code — from the game client, once the lobby exists. Optional; shown to both squads once saved.</label>
        <div class="hstack"><input id="rc-${m.id}" value="${esc(m.roomCode || "")}" placeholder="e.g. a ROV custom-room number" style="flex:1">
        <button class="btn" data-act="roomcode" data-id="${m.id}">Save</button></div></div>
    </div>`) : (t.channel !== "onsite" && m.roomCode ? `<div class="banner ok">${ic("check",17)}<span class="grow"><b>Room code</b> <span style="font-family:var(--f-mono);font-size:16px;letter-spacing:.05em">${esc(m.roomCode)}</span></span></div>` : "")}
  ${squads.map(s => `<div class="panel quiet vstack">
    <div class="spread"><span class="tchip"><i style="background:${s.color}"></i><b>${esc(s.name)}</b></span>
      <span class="tag">${named(s.id).filter(x=>m.checkedIn.includes(x)).length} of ${named(s.id).length} in</span></div>
    <div class="tblwrap"><table>
      <tr><th>Player</th><th>Faculty</th><th>State</th><th></th></tr>
      ${named(s.id).map(pid => { const p = user(pid), inn = m.checkedIn.includes(pid), isMe = u && u.id === pid;
        const role = startersOf(m, s.id).includes(pid) ? "Starter" : "Substitute";
        return `<tr><td><span class="hstack">${p.name===""?"":""}<span class="avatar">${esc(p.name[0])}</span>${esc(p.name)}${isMe?` <span class="tag">· you</span>`:""}</span></td>
        <td class="sub">${esc(p.faculty)} · Year ${p.year} · ${esc(role)}</td>
        <td>${inn?badge("ok","Checked in"):badge("warn","Not yet")}</td>
        <td>${!inn && (isMe || isReferee) ? `<button class="btn ${isMe?"primary":"ghost"}" data-act="checkin" data-id="${m.id}" data-u="${pid}">${isMe?(t.channel==="onsite"?"Scan the QR":"Send my ID"):"Verify"}</button>`
          : inn && isReferee ? `<button class="btn danger" data-act="uncheck" data-id="${m.id}" data-u="${pid}">Mark ineligible</button>` : ""}</td></tr>`; }).join("")}
    </table></div></div>`).join("")}
  ${allCheckedIn(m) && m.status === "scheduled" ? `<div class="panel vstack">
      <div class="banner ok">${ic("check",17)}<span class="grow"><b>Everyone is through.</b> Check-in is finished for this match.</span></div>
      ${isReferee ? `<button class="btn primary" style="align-self:flex-start" data-act="nav" data-h="#/m/${m.id}">Record the result</button>` : ""}
    </div>` : ""}
  ${mine ? `` : ""}`;
}

/* — Public squad profile. Open to guests: a spectator who just watched a match
     wants the club behind it, and should not have to sign in for that. — */
function viewTeam(id){
  const t = team(id);
  if (!t) return `<div class="empty">${ic("team",26)}<b>No such squad</b>
    <button class="btn" data-act="nav" data-h="#/">Back to tournaments</button></div>`;
  const played = S.matches.filter(m => (m.a === id || m.b === id) && m.status === "confirmed" && m.note !== "bye")
    .sort((x, y) => new Date(y.kickoff) - new Date(x.kickoff));
  const rec = played.reduce((acc, m) => {
    const won = (m.a === id ? m.sa : m.sb) > (m.a === id ? m.sb : m.sa);
    return { p: acc.p + 1, w: acc.w + (won ? 1 : 0),
             gf: acc.gf + (m.a === id ? m.sa : m.sb), ga: acc.ga + (m.a === id ? m.sb : m.sa),
             form: acc.form.concat(won ? "W" : "L") };
  }, { p: 0, w: 0, gf: 0, ga: 0, form: [] });
  const entered = S.registrations.filter(r => r.team === id);
  const titles = S.tournaments.filter(x => x.champion === id);
  /* best finish across everything the squad entered */
  const finishes = entered.map(r => { const tr = tour(r.tour); if (!tr || !tr.drawn) return null;
    const row = leaderboard(tr).find(x => x.team === id); return row ? { tr, row } : null; }).filter(Boolean);
  const best = finishes.length ? Math.min(...finishes.map(f => f.row.rank)) : null;
  const sports = teamBySport(id);
  return `
  <div class="crumb"><button data-act="nav" data-h="#/">${ic("chevL",11)} Tournaments</button>
    <span class="sub" aria-hidden="true">/</span><span style="color:var(--bone)">${esc(t.name)}</span></div>
  <div class="spread">
    <span class="hstack" style="gap:16px">
      ${t.logo ? `<img src="${t.logo}" alt="${esc(t.name)} badge" style="width:64px;height:64px;flex:none;object-fit:cover;
        clip-path:polygon(0 0,100% 0,100% 74%,74% 100%,0 100%)">` : `<span style="width:64px;height:64px;flex:none;display:grid;place-items:center;background:${t.color};color:var(--void);
        font-family:var(--f-display);font-weight:700;font-stretch:87.5%;font-size:24px;letter-spacing:.01em;
        clip-path:polygon(0 0,100% 0,100% 74%,74% 100%,0 100%)">${esc(t.code)}</span>`}
      <span class="vstack" style="gap:5px">
        <span class="disp" style="font-size:32px">${esc(t.name)}</span>
        <span class="hstack">
          ${t.permanent ? badge("ok","Permanent club") : t.disabled ? badge("crit","Disabled") :
            teamReady(t) ? badge("ok","Ready") : badge("warn",`Forming · ${t.members.length} of ${minSquad(t)}`)}
          <span class="tag">Captain <em>${esc(user(t.leader) ? user(t.leader).name : "—")}</em></span>
          ${rec.form.length ? formGuide(rec.form) : ""}
        </span></span>
    </span>
    ${me() ? `<button class="btn ${isFollowing("team:"+id)?"ghost":"primary"}" data-act="follow" data-kind="team" data-id="${id}">
      ${isFollowing("team:"+id) ? "Following" : "Follow this squad"}</button>` : ""}
  </div>
  <div class="statline">
    <div><span class="tag">Played · all sports</span><span class="v">${rec.p}</span></div>
    <div><span class="tag">Won</span><span class="v">${rec.w}</span></div>
    <div><span class="tag">Sports</span><span class="v">${sports.length}</span></div>
    <div><span class="tag">Best finish</span><span class="v">${best ? (best === 1 ? "1st" : best === 2 ? "2nd" : best === 3 ? "3rd" : best + "th") : "—"}</span></div>
  </div>
  ${sports.length ? `<div class="panel quiet vstack">
    <div class="tag"><em>//</em> Record by sport — a club can field sides in several</div>
    ${sports.map(r => { const L = statLabels(r.sport);
      return `<div class="sportcard">
        <div class="spread">
          <span class="hstack" style="gap:10px">${ic("match",16)}<b class="disp" style="font-size:19px">${esc(r.sport)}</b>
            <span class="tag">${r.tours.size} tournament${r.tours.size === 1 ? "" : "s"}</span></span>
          ${formGuide(r.form)}
        </div>
        <div class="statline">
          <div><span class="tag">Played</span><span class="v">${r.p}</span></div>
          <div><span class="tag">Won</span><span class="v">${r.w}</span></div>
          <div><span class="tag">Win rate</span><span class="v">${Math.round(r.w / r.p * 100)}%</span></div>
          ${L.g ? `<div><span class="tag">${esc(L.g)} for</span><span class="v">${r.gf}</span></div>` : ""}
          ${L.g ? `<div><span class="tag">${esc(L.g)} against</span><span class="v">${r.ga}</span></div>` : ""}
        </div>
      </div>`; }).join("")}
  </div>` : ""}
  ${titles.length ? `<div class="panel vstack">
    <div class="tag"><em>//</em> Honours</div>
    <div class="hstack">${titles.map(x => `<span class="hstack" style="gap:9px;padding:11px 14px;background:var(--panel-2)">
      ${ic("trophy",18)}<span><b style="font-size:15px">${esc(x.name)}</b><br><span class="tag">Champions</span></span></span>`).join("")}</div>
  </div>` : ""}
  <div class="panel quiet vstack">
    <div class="spread"><span class="tag"><em>//</em> Squad · ${t.members.length}</span></div>
    <div class="tblwrap"><table>
      <tr><th>Player</th><th>Faculty</th><th>Year</th><th>Age</th><th></th></tr>
      ${t.members.map(pid => { const p = user(pid); if (!p) return "";
        return `<tr><td><span class="hstack"><span class="avatar">${esc(p.name[0])}</span>${esc(p.name)}${t.leader===pid?` <span class="tag">· captain</span>`:""}</span></td>
          <td class="sub">${esc(p.faculty)}</td><td class="num">${p.year}</td><td class="num">${ageOf(p.dob)}</td>
          <td><button class="btn ghost" data-act="nav" data-h="#/player/${pid}">Profile ${ic("chev",11)}</button></td></tr>`; }).join("")}
    </table></div>
  </div>
  <div class="panel quiet vstack">
    <div class="tag"><em>//</em> Results · ${played.length}</div>
    ${played.length ? `<div class="tblwrap"><table>
      <tr><th>Date</th><th>Sport</th><th>Tournament</th><th>Home</th><th></th><th>Away</th><th>Score</th><th></th><th></th></tr>
      ${played.slice(0, 12).map(m => { const won = (m.a===id?m.sa:m.sb) > (m.a===id?m.sb:m.sa);
        return `<tr><td class="num">${esc(fmtDate(m.kickoff))}</td>
          <td><span class="badge neutral">${esc(tour(m.tour) ? tour(m.tour).sport : "—")}</span></td>
          <td class="sub">${esc(tour(m.tour) ? tour(m.tour).name : "—")}</td>
          <td>${chipLink(m.a)}</td><td class="tag">vs</td><td>${chipLink(m.b)}</td>
          <td class="num">${m.sa} – ${m.sb}</td><td>${badge(won?"ok":"crit", won?"W":"L")}</td>
          <td><button class="btn ghost" data-act="nav" data-h="#/m/${m.id}">Open</button></td></tr>`; }).join("")}
    </table></div>` : ``}
  </div>
  ${entered.length ? `<div class="panel quiet vstack">
    <div class="tag"><em>//</em> Tournaments entered</div>
    <div class="tblwrap"><table>
      <tr><th>Tournament</th><th>Sport</th><th>Status</th><th>Finish</th><th></th></tr>
      ${entered.map(r => { const tr = tour(r.tour); if (!tr) return "";
        const f = finishes.find(x => x.tr.id === tr.id);
        return `<tr><td>${esc(tr.name)}</td><td><span class="badge neutral">${esc(tr.sport)}</span></td>
          <td>${r.status === "approved" ? badge("ok","Entered") : r.status === "pending" ? badge("warn","Awaiting review") : badge("crit", r.status)}</td>
          <td class="sub">${f ? esc(f.row.outLabel) : "—"}</td>
          <td>${tr.status === "public" ? `<button class="btn ghost" data-act="nav" data-h="#/t/${tr.id}">Open</button>` : ""}</td></tr>`; }).join("")}
    </table></div>
  </div>` : ""}`;
}

  return `

  <div class="spread">
    <span class="hstack" style="gap:16px">
      <span style="width:60px;height:60px;flex:none;display:grid;place-items:center;background:var(--red-ghost);color:var(--red-text);
        font-family:var(--f-display);font-weight:700;font-stretch:87.5%;font-size:26px;
        clip-path:polygon(0 0,100% 0,100% 72%,72% 100%,0 100%)">${esc(p.name[0])}</span>

        <span class="disp" style="font-size:30px">${esc(p.name)}</span>
        <span class="hstack"><span class="tag">${esc(p.faculty)} · ${esc(p.major)}</span>

        ${followBar(id)}

  ${careerPanel(id)}
  <div class="panel quiet vstack">

      <tr><th>Squad</th><th>Role</th><th>Standing</th><th>State</th><th>Matches</th><th></th></tr>
      ${squads.map(t => { const rec = teamBySport(t.id).reduce((n, r) => n + r.p, 0); return `<tr><td>${chipLink(t.id)}</td>
        <td class="sub">${t.leader === id ? "Captain" : "Player"}</td>
        <td>${t.permanent ? badge("ok","Permanent club") : badge("neutral","Temporary")}</td>

/* — Watch: the guest-facing live view. No video to stream locally, so what is
     "live" here is the state itself — the scoreline, the trail and the commentary
     the system can actually derive from what referees recorded. — */
function viewWatch(id){
  const t = tour(id); if (!t) return `<div class="empty">${ic("warn",26)}<b>No such tournament</b></div>`;
  const ms = matchesOf(t.id).filter(m => m.a && m.b);
  const live = ms.filter(m => m.status === "scheduled" || m.status === "pending");
  const done = ms.filter(m => m.status === "confirmed" && m.note !== "bye");
  const feature = live[0] || done[done.length - 1];
  if (!feature) return `<div class="empty">${ic("match",28)}<b>Nothing to watch yet</b>
    <span class="sub">Matches appear here once the bracket is drawn.</span></div>`;
  const isLive = feature.status !== "confirmed";
  return `<div class="crumb"><button data-act="nav" data-h="#/t/${t.id}">${ic("chevL",11)} ${esc(t.name)}</button>
      <span class="sub" aria-hidden="true">/</span><span style="color:var(--bone)">Watch</span></div>
    <div class="spread"><h1 class="disp" style="font-size:28px">${esc(matchStage(feature))}</h1>
      ${isLive ? `<span class="live"><i></i>Live</span>` : badge("ok","Full time")}</div>
    ${scorebug(feature)}
    <div class="panel quiet vstack" style="align-items:center;padding:34px 20px;text-align:center">
      ${ic("match",34)}
      <div class="disp" style="font-size:21px">${isLive ? "Stream from " + esc(feature.venue) : "Replay — " + esc(feature.venue)}</div>
      
    </div>
    <div class="grid2">
      <div class="panel quiet vstack">
        <div class="tag"><em>//</em> What the system knows</div>
        ${feature.enteredBy ? `<div class="hstack">${badge("ok","Recorded")}<span class="sub">${esc(user(feature.enteredBy).name)} entered ${feature.sa}–${feature.sb}</span></div>` : ""}
        ${Object.entries(feature.stats || {}).map(([pid, st]) =>
          `<div class="hstack"><span class="tag num" style="width:34px">${st.goals ? st.goals + "G" : ""}${st.assists ? " " + st.assists + "A" : ""}</span>
           ${playerLink(pid)}${chipLink(st.team)}</div>`).join("") || ``}
        <div class="hstack">${badge(feature.status === "confirmed" ? "ok" : "warn", feature.status)}
          <span class="sub">${feature.checkedIn.length} player${feature.checkedIn.length === 1 ? "" : "s"} checked in</span></div>
      </div>
      <div class="panel quiet vstack">
        <div class="tag"><em>//</em> Elsewhere in this tournament</div>
        ${ms.filter(m => m !== feature).slice(0, 6).map(m => `<div class="hstack" style="justify-content:space-between">
          <span class="hstack">${chipLink(m.a)}<span class="tag">vs</span>${chipLink(m.b)}</span>
          <span class="hstack"><span class="num">${m.sa ?? "—"} – ${m.sb ?? "—"}</span>${statusBadge(m)}</span></div>`).join("")
          || ``}
      </div>
    </div>
    ${done.length ? `<div class="tag"><em>//</em> Replays · ${done.length}</div>
      <div class="tblwrap"><table>
        <tr><th>Round</th><th>Home</th><th></th><th>Away</th><th>Score</th><th>Replay</th><th></th></tr>
        ${done.map(m => `<tr><td class="tag">${esc(matchTag(m))}</td>
          <td>${chipLink(m.a)}</td><td class="tag">vs</td><td>${chipLink(m.b)}</td>
          <td class="num">${m.sa} – ${m.sb}</td>
          <td>${m.replay ? `<a href="${esc(m.replay)}" target="_blank" rel="noopener">Replay</a>` : `<span class="sub">—</span>`}</td>
          <td><button class="btn ghost" data-act="nav" data-h="#/m/${m.id}">Open</button></td></tr>`).join("")}
      </table></div>` : ""}`;
}

/* — teams — */
function viewTeams(){
  const u = me(); if (!u) return viewLogin();
  const invites = S.invites.filter(i => i.user === u.id && i.status === "pending");
  const mine = myTeams(), led = ledTeams();
  return `
  <div class="spread"><h1 class="disp" style="font-size:32px">Teams</h1>
    <button class="btn primary" data-act="newteam">${ic("plus",13)} Create a team</button></div>

  ${invites.length ? `<div class="panel vstack">
    <div class="tag"><em>//</em> Invitations waiting on you</div>
    ${invites.map(i => { const tm = team(i.team); return `<div class="vstack" style="gap:9px">
      <div class="hstack"><span class="tchip">${teamMark(tm)}<b>${esc(tm.name)}</b></span>
        <span class="sub">${esc(user(i.by).name)} invited you</span></div>
      <div class="banner warn">${ic("warn",16)}<span class="grow">Accepting shares your faculty, year and date of birth with the organizer of any tournament this squad enters — that is how the eligibility check works.</span></div>
      <div class="hstack"><button class="btn" data-act="decline" data-id="${i.id}">Decline</button>

  </div>` : ""}

  ${mine.length ? mine.map(t => {
    const ready = teamReady(t), pend = S.invites.filter(i => i.team === t.id && i.status === "pending");
    const lead = t.leader === u.id;
    return `<div class="panel vstack">
      <div class="spread">
        <span class="hstack" style="gap:12px">${t.logo ? `<img src="${esc(t.logo)}" alt="" style="width:32px;height:32px;flex:none;object-fit:cover;
            clip-path:polygon(0 0,100% 0,100% 74%,74% 100%,0 100%)">` : `<span style="width:32px;height:32px;flex:none;display:grid;place-items:center;background:${t.color};color:var(--void);
            font-family:var(--f-display);font-weight:700;font-stretch:87.5%;font-size:13px;letter-spacing:.01em;
            clip-path:polygon(0 0,100% 0,100% 74%,74% 100%,0 100%)">${esc(t.code)}</span>`}<span class="disp" style="font-size:21px">${esc(t.name)}</span>
          <span class="tag">${esc(t.code)}</span></span>
        <span class="hstack">${t.sport?badge("neutral",t.sport):""}${ready?badge("ok","Ready"):badge("warn",`Forming · ${t.members.length} of ${minSquad(t)}`)}
          <button class="btn ghost" data-act="follow" data-kind="team" data-id="${t.id}">${isFollowing("team:"+t.id)?"Following":"Follow"}</button>
          ${lead?badge("neutral","You lead this squad"):badge("neutral","You play here")}</span>
      </div>
      ${!ready ? `<div class="banner warn">${ic("team",16)}<span class="grow"><b>${minSquad(t) - t.members.length} more accepted member${minSquad(t)-t.members.length===1?"":"s"} and this squad is Ready.</b> ${t.sport ? `${esc(t.sport)} needs ${minSquad(t)}. ` : ""}A Forming squad can't be registered for anything.</span></div>` : ""}
      <div class="tblwrap"><table>
        <tr><th>Player</th><th>Faculty</th><th>Year</th><th>Membership</th>${lead?"<th></th>":""}</tr>
        ${t.members.map(id => { const p = user(id); return `<tr>
          <td><span class="hstack"><span class="avatar">${esc(p.name[0])}</span>${playerLink(id)}${t.leader===id?` <span class="tag">· leader</span>`:""}</span></td>
          <td class="sub">${esc(p.faculty)}</td><td class="num">${p.year}</td><td>${badge("ok","Accepted")}</td>
          ${lead?`<td>${t.leader===id?"":`<button class="btn ghost" data-act="kick" data-id="${t.id}" data-u="${id}">Remove</button>`}</td>`:""}</tr>`; }).join("")}
        ${pend.map(i => { const p = user(i.user); return `<tr>
          <td><span class="hstack"><span class="avatar">${esc(p.name[0])}</span>${playerLink(i.user)}</span></td>
          <td class="sub">${esc(p.faculty)}</td><td class="num">${p.year}</td><td>${badge("warn","Invited")}</td>
          ${lead?`<td><button class="btn ghost" data-act="uninvite" data-id="${i.id}">Cancel</button></td>`:""}</tr>`; }).join("")}
      </table></div>
      ${t.disabled ? `<div class="banner crit">${ic("warn",16)}<span class="grow"><b>This squad is disabled.</b> ${esc(t.disabledWhy||"")} An admin can make it permanent to bring it back.</span></div>` : ""}
      ${t.permanent ? `<div class="hstack">${badge("ok","Permanent — exempt from automatic disabling")}</div>` : ""}
      ${!t.permanent && t.permanentRequest ? `<div class="hstack">${badge("warn","Permanent status — with an admin")}
        <span class="sub">${esc(t.permanentRequest.reason)}</span></div>` : ""}
      ${lead ? `<div class="hstack">
        <button class="btn" data-act="invite" data-id="${t.id}">${ic("plus",12)} Invite a player</button>
        <button class="btn primary" data-act="register" data-id="${t.id}" ${ready&&!t.disabled?"":"disabled"}>Register for a tournament</button>
        ${t.disabled?`<span class="sub">Disabled squads can't enter anything.</span>`
          :ready?"":`<span class="sub">Registration unlocks at ${minSquad(t)} members.</span>`}
        <button class="btn ghost" data-act="transfer" data-id="${t.id}">Hand over</button>
        <button class="btn danger" data-act="disband" data-id="${t.id}">Disband</button>
      </div>
      <div class="hstack">
        <span class="field" style="max-width:260px"><label for="lg-${t.id}">Squad badge</label>
          <input id="lg-${t.id}" type="file" accept="image/*"></span>
        <button class="btn" data-act="logo" data-id="${t.id}">Upload badge</button>
        ${t.logo ? `<button class="btn ghost" data-act="logo" data-id="${t.id}" data-clear="1">Remove badge</button>` : ""}
        ${!t.permanent && !t.permanentRequest ? `<button class="btn ghost" data-act="reqpermanent" data-id="${t.id}">Ask to be permanent</button>` : ""}
      </div>` : ""}
      ${regsOf2(t.id)}
    </div>`;
  }).join("") : `<div class="empty">${ic("team",30)}<b>You're not in a squad yet</b>
    <span class="sub">Create one, or wait for an invitation.</span></div>`}`;
}
function regsOf2(teamId){
  const rs = S.registrations.filter(r => r.team === teamId);
  if (!rs.length) return "";
  return `<div class="tag"><em>//</em> Registrations</div><div class="tblwrap"><table>
    <tr><th>Tournament</th><th>Status</th><th>Note</th><th></th></tr>
    ${rs.map(r => { const t = tour(r.tour); return `<tr><td>${esc(t.name)}</td>
      <td>${r.status==="approved"?badge("ok","Approved"):r.status==="pending"?badge("warn","Awaiting review"):badge("crit","Rejected")}</td>
      <td class="sub">${esc(r.reason||"—")}</td>
      <td>${r.status==="pending"?`<button class="btn ghost" data-act="withdraw" data-id="${r.id}">Withdraw</button>`:""}</td></tr>`; }).join("")}
  </table></div>`;
}

/* — matches for me — */
function viewMatches(){
  const u = me(); if (!u) return viewLogin();
  /* One person wears several hats at once — officiating one tournament, playing in
     another, running a third. Merging them into one fixture list loses the only
     thing that matters here: what is being asked of you, and by which role. */
  const asRef = S.matches.filter(m => (m.refs||[]).includes(u.id));
  const asPlayer = S.matches.filter(m => [m.a,m.b].filter(Boolean).some(x => team(x).members.includes(u.id)));
  const asOrg = S.matches.filter(m => m.a && m.b && isOrg(tour(m.tour)));
  const orgDisputes = asOrg.filter(m => m.status === "disputed");
  const refOpen = asRef.filter(m => m.a && m.b && m.status !== "confirmed");
  const row = m => `<tr>
    <td class="num">${esc(fmtDate(m.kickoff))}</td>
    <td class="sub">${esc(tour(m.tour).name)}</td>
    <td>${chipLink(m.a)}</td><td class="tag">vs</td><td>${chipLink(m.b)}</td>
    <td class="num">${m.sa??"—"} – ${m.sb??"—"}</td><td>${statusBadge(m)}</td>
    <td><button class="btn primary" data-act="nav" data-h="#/m/${m.id}">Open</button></td></tr>`;
  const table = list => `<div class="tblwrap"><table>
    <tr><th>Kick-off</th><th>Tournament</th><th>Home</th><th></th><th>Away</th><th>Score</th><th>State</th><th></th></tr>
    ${list.map(row).join("")}</table></div>`;
  const refInv = S.refInvites.filter(i => i.user === u.id && i.status === "pending");
  return `<h1 class="disp" style="font-size:32px">Matches</h1>
    ${refInv.length ? `<div class="panel vstack">
      <div class="tag"><em>//</em> Appointments waiting on your answer</div>
      ${refInv.map(i => { const tr = tour(i.tour); if (!tr) return "";
        const need = refsNeeded(tr);
        return `<div class="vstack" style="gap:9px">
          <div class="hstack"><b>${esc(tr.name)}</b>${badge("neutral", tr.channel)}
            <span class="sub">${esc(user(i.by).name)} invited you · ${esc(tr.venue)} · ${esc(tr.date)}</span></div>
          
          <div class="hstack"><button class="btn" data-act="refreply" data-id="${i.id}" data-reply="declined">Decline</button>
            <button class="btn primary" data-act="refreply" data-id="${i.id}" data-reply="accepted">Accept appointment</button></div>
        </div>`; }).join("")}
    </div>` : ""}
    ${orgDisputes.length ? `<div class="banner crit">${ic("warn",17)}<span class="grow"><b>${orgDisputes.length} dispute${orgDisputes.length===1?"":"s"} need your decision.</b></span></div>${table(orgDisputes)}` : ""}
    ${refOpen.length ? `<div class="tag"><em>//</em> You are officiating — waiting on you · ${refOpen.length}</div>
      <div class="grid2">${refOpen.map(m => { const tr = tour(m.tour);

        ${squads.length ? `<div class="tblwrap"><table>

          ${squads.map(t => `<tr><td>${chipLink(t.id)}</td>

/* Following, read from a profile. Two counts that are also the way in — a number
   nobody can click is a number nobody can check. Followers is who follows this
   player; Following is everything they follow, squads and players both, because
   one list is what the person actually did. */
const followingOf = uid => S.follows.filter(f => f.by === uid);
function followBar(pid){
  const fr = follows("player:" + pid).length, fg = followingOf(pid).length;
  return `<span class="hstack">
    <button class="btn ghost" data-act="followlist" data-id="${pid}" data-mode="followers">
      <b class="num">${fr}</b> follower${fr === 1 ? "" : "s"}</button>
    <button class="btn ghost" data-act="followlist" data-id="${pid}" data-mode="following">
      <b class="num">${fg}</b> following</button></span>`;
}
/* One row shape for both lists: who it is, and — when you are signed in and it is
   not you — the same toggle the profile itself carries, so the answer to "am I
   following them" is given in the place the question gets asked. */
function followList(pid, mode){
  const who = user(pid);
  const rows = mode === "followers"
    ? follows("player:" + pid).map(id => ({ kind: "player", id }))
    : followingOf(pid).map(f => { const [kind, id] = f.key.split(":"); return { kind, id }; });
  const line = r => {
    const it = r.kind === "team" ? team(r.id) : user(r.id);
    if (!it) return "";
    const key = r.kind + ":" + r.id, on = isFollowing(key);
    const sub = r.kind === "team" ? `${esc(it.sport || "any sport")} · ${it.members.length} members`
      : `${esc(it.faculty || "—")} · Year ${it.year}`;
    return `<div class="notif" style="align-items:center">
      <span class="avatar">${esc(it.name[0])}</span>
      <span class="txt"><b>${esc(it.name)}</b><br><span class="sub">${sub}</span></span>
      ${me() && !(r.kind === "player" && r.id === sid())
        ? `<button class="btn ${on ? "ghost" : "primary"}" data-act="follow" data-kind="${r.kind}" data-id="${r.id}"
            data-from="modal" data-list="${pid}:${mode}">${on ? "Following" : "Follow"}</button>` : ""}
    </div>`;
  };
  return `<div class="vstack">
    <div class="tag"><em>//</em> ${mode === "followers" ? "Followers" : "Following"} · ${rows.length}</div>
    <h3 style="margin:0;font-size:20px">${esc(who ? who.name : "Player")}</h3>
    ${rows.length ? `<div class="vstack" style="gap:0">${rows.map(line).join("")}</div>`
      : ``}
    <div class="hstack"><button class="btn ghost" data-act="closemodal">Done</button></div>
  </div>`;
}

/* — a player's record, assembled from confirmed matches only — */
function careerPanel(pid){
  const bySport = careerBySport(pid);
  const byTour = careerByTournament(pid);
  const totalP = bySport.reduce((n, r) => n + r.p, 0);
  const totalW = bySport.reduce((n, r) => n + r.w, 0);
  const titles = byTour.filter(r => r.finish === "Champion").length;
  const mvpVotes = S.votes.filter(v => v.player === pid).length;
  const played = S.matches.filter(m => m.status === "confirmed" && m.note !== "bye"
    && [m.a, m.b].filter(Boolean).some(t => team(t) && team(t).members.includes(pid)));
  return `<div class="panel quiet vstack">
    <div class="spread"><span class="tag"><em>//</em> Record by sport — confirmed matches only</span>
      ${pid !== sid() && me() ? `<button class="btn ${isFollowing("player:"+pid)?"ghost":"primary"}" data-act="follow" data-kind="player" data-id="${pid}">
        ${isFollowing("player:"+pid) ? "Following" : "Follow"}</button>` : ""}</div>
    ${!totalP ? `` : `
      <div class="statline">
        <div><span class="tag">Matches</span><span class="v">${totalP}</span></div>
        <div><span class="tag">Won</span><span class="v">${totalW}</span></div>
        <div><span class="tag">Win rate</span><span class="v">${Math.round(totalW / totalP * 100)}%</span></div>
        <div><span class="tag">Tournaments</span><span class="v">${byTour.length}</span></div>
        <div><span class="tag">Titles</span><span class="v" style="${titles ? "color:var(--teal)" : ""}">${titles}</span></div>
        <div><span class="tag">MVP votes</span><span class="v" style="${mvpVotes ? "color:var(--amber)" : ""}">${mvpVotes}</span></div>
      </div>
      
      ${bySport.map(r => { const L = statLabels(r.sport); return `
        <div class="sportcard">
          <div class="spread">
            <span class="hstack" style="gap:10px">${ic("match",16)}<b class="disp" style="font-size:19px">${esc(r.sport)}</b>
              <span class="tag">${r.tours.size} tournament${r.tours.size === 1 ? "" : "s"} · ${r.teams.size} squad${r.teams.size === 1 ? "" : "s"}</span></span>
            ${formGuide(r.form)}
          </div>
          <div class="statline">
            <div><span class="tag">Played</span><span class="v">${r.p}</span></div>
            <div><span class="tag">Won</span><span class="v">${r.w}</span></div>
            <div><span class="tag">Win rate</span><span class="v">${Math.round(r.w / r.p * 100)}%</span></div>
            ${L.g ? `<div><span class="tag">${esc(L.g)}</span><span class="v">${r.g}</span></div>` : ""}
            ${L.a ? `<div><span class="tag">${esc(L.a)}</span><span class="v">${r.a}</span></div>` : ""}
          </div>
        </div>`; }).join("")}
      <div class="tag" style="margin-top:4px"><em>//</em> By tournament · ${byTour.length}</div>
      <div class="tblwrap"><table>
        <tr><th>Tournament</th><th>Sport</th><th>Squad</th><th>Played</th><th>Won</th><th>Recorded</th><th>Finish</th><th>Form</th></tr>
        ${byTour.map(r => { const L = statLabels(r.tour.sport), tm = team(r.team); return `<tr>
          <td><button class="btn ghost" data-act="nav" data-h="#/t/${r.tour.id}">${esc(r.tour.name)}</button></td>
          <td><span class="badge neutral">${esc(r.tour.sport)}</span></td>
          <td><span class="hstack" style="gap:7px">${chipLink(r.team)}
            ${tm && tm.permanent ? badge("ok","Permanent") : badge("neutral","Temporary")}</span></td>
          <td class="num">${r.p}</td><td class="num">${r.w}</td>
          <td class="sub">${L.g ? `${r.g} ${esc(L.g.toLowerCase())}${L.a ? `, ${r.a} ${esc(L.a.toLowerCase())}` : ""}` : "Not recorded for this sport"}</td>
          <td>${r.finish === "Champion" ? badge("ok","Champion")
              : r.finish === "Still in" ? badge("warn","Still in")
              : `<span class="hstack" style="gap:7px">${badge("neutral","Out · " + esc(r.finish))}${r.rank ? `<span class="tag">Rank <em>${r.rank}</em></span>` : ""}</span>`}</td>
          <td>${formGuide(r.form)}</td></tr>`; }).join("")}
      </table></div>
      <div class="tag" style="margin-top:4px"><em>//</em> Match history · ${played.length} confirmed</div>
      <div class="tblwrap"><table>
        <tr><th>Sport</th><th>Tournament</th><th>Squad</th><th>Round</th><th>Result</th><th>Recorded</th></tr>
        ${played.slice().reverse().map(m => { const tr = tour(m.tour); if (!tr) return "";
          const st = (m.stats||{})[pid], L = statLabels(tr.sport);
          const side = team(m.a) && team(m.a).members.includes(pid) ? "a" : "b";
          const won = wonBy(m, side === "a" ? m.a : m.b);
          return `<tr><td><span class="badge neutral">${esc(tr.sport)}</span></td>
            <td class="sub">${esc(tr.name)}</td>
            <td>${chipLink(side === "a" ? m.a : m.b)}</td>
            <td class="tag">${esc(matchTag(m))}</td>
            <td><span class="hstack">${badge(won ? "ok" : "crit", won ? "Won" : "Lost")}<span class="num">${m.sa}–${m.sb}</span></span></td>
            <td class="sub">${st && L.g ? `${st.goals} ${esc(L.g.toLowerCase())}${L.a ? `, ${st.assists} ${esc(L.a.toLowerCase())}` : ""}` : "—"}</td></tr>`; }).join("")}
      </table></div>`}
  </div>`;
}

/* — request a tournament — */
