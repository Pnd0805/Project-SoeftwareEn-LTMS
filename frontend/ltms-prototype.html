/* — search — */
function viewSearch(q){
  q = (q || "").toLowerCase();
  const T = S.tournaments.filter(visibleTo)
    .filter(t => t.name.toLowerCase().includes(q) || t.sport.toLowerCase().includes(q));
  const M = S.teams.filter(t => t.name.toLowerCase().includes(q) || t.code.toLowerCase().includes(q));
  const P = S.users.filter(u => u.name.toLowerCase().includes(q) || u.faculty.toLowerCase().includes(q));
  const none = !q || (!T.length && !M.length && !P.length);
  return `<h1 class="disp" style="font-size:32px">Search</h1>
    <div class="tag"><em>//</em> ${q ? `${T.length+M.length+P.length} results for "${esc(q)}"` : "Type in the box above"}</div>
    ${none ? `<div class="empty">${ic("search",28)}<b>${q?"Nothing matched":"Search tournaments, squads and players"}</b></div>` : `
      ${T.length?`<div class="tag"><em>//</em> Tournaments</div><div class="tblwrap"><table>
        ${T.map(t=>`<tr><td>${esc(t.name)}</td><td class="sub">${esc(t.sport)}</td>
          <td><button class="btn ghost" data-act="nav" data-h="#/t/${t.id}">Open</button></td></tr>`).join("")}</table></div>`:""}
      ${M.length?`<div class="tag"><em>//</em> Squads</div><div class="tblwrap"><table>
        ${M.map(t=>`<tr><td>${chipLink(t.id)}</td><td class="num">${t.members.length} players</td>
          <td class="sub">${esc(user(t.leader).name)}</td>
          <td><button class="btn ghost" data-act="nav" data-h="#/team/${t.id}">Open</button></td></tr>`).join("")}</table></div>`:""}
      ${P.length?`<div class="tag"><em>//</em> Players</div><div class="tblwrap"><table>
        ${P.map(u=>`<tr><td><span class="hstack"><span class="avatar">${esc(u.name[0])}</span>${esc(u.name)}</span></td>
          <td class="sub">${esc(u.faculty)} · Year ${u.year}</td><td class="num">age ${ageOf(u.dob)}</td>
          <td><button class="btn ghost" data-act="nav" data-h="#/player/${u.id}">Profile</button></td></tr>`).join("")}</table></div>`:""}`}`;
}



/* The fixture, on its own page, reached from the match it belongs to. The manage
   tab still lists every fixture at once — this is the way in for an organizer who
   is already looking at one match and should not have to go find it in a list of
   sixteen. Same card, same field ids, same assign handler; PERM.assign is what
   actually refuses anybody else, this only stops the form from being drawn. */
function viewMatchFixture(id){
  const m = matchById(id);
  if (!m) return `<div class="empty">${ic("warn",26)}<b>No such match</b>
    <button class="btn" data-act="nav" data-h="#/">Go back</button></div>`;
  const t = tour(m.tour);
  const back = `<div class="crumb"><button data-act="nav" data-h="#/m/${m.id}">${ic("chevL",11)} ${esc(matchStage(m))}</button>
    <span class="sub" aria-hidden="true">/</span><span style="color:var(--bone)">Fixture</span></div>`;
  if (!isOrg(t)) return `${back}
    <div class="empty">${ic("warn",28)}<b>403 — not yours to schedule</b>
      <span class="sub">${esc(t.name)} is run by <b style="color:var(--bone)">${esc(user(t.organizer) ? user(t.organizer).name : "another organizer")}</b>.
        Kick-off, venue and the officials on a match are set by whoever runs the tournament.</span>
      <button class="btn" data-act="nav" data-h="#/m/${m.id}">Back to the match</button></div>`;

  const refs = (t.referees || []).map(x => user(x)).filter(Boolean);
  const need = refsNeeded(t);
  return `${back}
  <div class="spread">
    <div><div class="tag"><em>//</em> ${esc(t.name)} · ${esc(matchTag(m))}</div>
      <h1 class="disp" style="font-size:28px;margin-top:6px">Fixture</h1></div>
    ${statusBadge(m)}
  </div>
  <div class="split">
    <div>${fixtureCard(m, t)}</div>
    <div class="rail">
      <div class="panel quiet vstack">
        <span class="tag"><em>//</em> Who may be named</span>
        <div class="facts">
          <div><span class="k">Played</span><span class="f">${esc(t.channel)}</span></div>
          <div><span class="k">Needs</span><span class="f"><b class="num">${need}</b> <span class="sub">referee${need > 1 ? "s" : ""} on the match</span></span></div>
          <div><span class="k">Accepted</span><span class="f"><b class="num">${refs.length}</b> <span class="sub">on the tournament</span></span></div>
        </div>
        
        <button class="btn" data-act="nav" data-h="#/t/${t.id}/manage">${ic("team",13)} Appoint referees</button>
      </div>
      <div class="panel quiet vstack">
        <span class="tag"><em>//</em> Every fixture</span>
        
        <button class="btn ghost" data-act="nav" data-h="#/t/${t.id}/schedule">Schedule for ${esc(t.name)}</button>
      </div>
    </div>
  </div>`;
}

/* ───────── render ───────── */
function render(){
  const r = route(), u = me();
  let body, bare = false;
  const PUBLIC = ["home","t","m","search","login","team","player","watch","mvp","ui"];
  if (!u && S.session !== "guest" && !PUBLIC.includes(r.name)){ body = viewLogin(); bare = true; }
  else if (r.name === "login"){ body = viewLogin(); bare = !u && S.session !== "guest"; }
  else if (r.name === "t") body = viewTournament(r.a, r.b, r.c);
  else if (r.name === "m") body = r.b === "fixture" ? viewMatchFixture(r.a) : viewMatch(r.a, r.b);
  else if (r.name === "checkin") body = viewCheckin(r.a);
  else if (r.name === "mvp") body = viewMvp(r.a);
  else if (r.name === "team") body = viewTeam(r.a);
  else if (r.name === "player") body = viewPlayer(r.a);
  else if (r.name === "watch") body = viewWatch(r.a);
  else if (r.name === "teams") body = viewTeams();
  else if (r.name === "matches") body = viewMatches();
  else if (r.name === "inbox") body = viewInbox();
  else if (r.name === "me") body = viewMe();
  else if (r.name === "admin") body = viewAdmin();
  else if (r.name === "request") body = viewRequest();
  else if (r.name === "search") body = viewSearch(decodeURIComponent(r.a || ""));
  else if (r.name === "ui") body = viewUi();
  else if (r.name === "home") body = viewHome(undefined, r.a);
  else body = viewHome();

  const paint = () => {
    document.getElementById("app").innerHTML = bare ? body : shell(body, navFor());
    if (r.name === "search"){ const el = document.querySelector('[data-act="search"]'); if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
    drawBracketLines();
  };
  /* most renders carry no view-transition-name and animate invisibly (root's
     own snapshot is suppressed, see CSS) — the one exception is a team whose
     scorebug and bracket-frontier row share a name, which is what turns
     "confirmed, then navigated to the bracket" into the winner sliding into
     its slot instead of just appearing there. */
  /* a transition still in flight throws InvalidStateError on a fast second
     render (double-click, rapid nav) — paint must still happen or the DOM
     stops matching the URL until the next click. */
  if (document.startViewTransition){
    try { document.startViewTransition(paint); }
    catch { paint(); }
  } else paint();
}
/* winner-path connectors only (2nd_feedback #2) — one elbow per match that has a
   next match in the SAME .bracket box; loser-bracket and grand-final edges cross
   boxes and are left unconnected, ponytail: add a second pass if that's wanted */
function drawBracketLines(){
  document.querySelectorAll(".bracket").forEach(box => {
    const old = box.querySelector("svg.bconn"); if (old) old.remove();
    const rect = box.getBoundingClientRect();
    const paths = [];
    box.querySelectorAll(".bnode[data-mid]").forEach(node => {
      const m = S.matches.find(x => x.id === node.dataset.mid);
      const nx = m && nextOf(m);
      const target = nx && box.querySelector(`.bnode[data-mid="${nx.id}"]`);
      if (!target) return;
      const a = node.getBoundingClientRect(), b = target.getBoundingClientRect();
      const x1 = a.right - rect.left, y1 = a.top + a.height / 2 - rect.top;
      const x2 = b.left - rect.left, y2 = b.top + b.height / 2 - rect.top;
      const mx = (x1 + x2) / 2;
      paths.push(`<path d="M${x1},${y1} H${mx} V${y2} H${x2}"/>`);
    });
    if (!paths.length) return;
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "bconn");
    svg.innerHTML = paths.join("");
    box.prepend(svg);
  });
}

function modal(html){
  document.getElementById("modal").innerHTML = `<div class="modal-bg" data-act="closemodal"><div class="modal" data-stop role="dialog" aria-modal="true">${html}</div></div>`;
  /* the keyboard has to end up inside the thing that just covered the page. Escape
     already closes it; a caller that wants a field focused instead does so after. */
  const first = document.querySelector("#modal .modal button");
  if (first) first.focus();
}

/* A question the app asks in its own voice. The browser's confirm() is another
   application's dialog wearing none of this one's clothes, and it cannot say which
   of the two answers is the destructive one — so both look equally safe to click.

   The answer arrives as a second run of the same action: ask() parks the action and
   its dataset, the Confirm button replays it with ok set, and the second pass falls
   straight through. Every PERM rule is therefore checked twice, not bypassed once. */
let pendingAsk = null;
function confirmCard(o){
  const bad = o.kind === "danger";
  return `<div class="vstack">
    <div class="tag"><em>//</em> ${bad ? "Destructive — read it before you answer" : "Confirm"}</div>
    <h3 style="margin:0;font-size:20px">${esc(o.title)}</h3>
    ${o.body ? `<div class="sub">${esc(o.body)}</div>` : ""}
    <div class="hstack"><button class="btn" data-act="closemodal">Cancel</button>
      <button class="btn ${bad ? "danger" : "primary"}" data-act="okask">${esc(o.ok || "Confirm")}</button></div>
  </div>`;
}
/* true once the question has been answered — so a call site reads as one line. */
function ask(el, o){
  if (el.dataset.ok) return true;
  pendingAsk = { act: running, dataset: { ...el.dataset, ok: "1" } };
  modal(confirmCard(o));
  return false;
}
function closeModal(){ document.getElementById("modal").innerHTML = ""; }

   still enter this tournament — the same question read from either end. */

  && !S.registrations.some(r => r.tour === tr.id && r.team === x.id && r.status !== "withdrawn"));

        style="justify-content:space-between">${esc(x.name)}<span class="sub">${esc(x.sport || "any sport")} · ${x.members.length} members</span></button>`).join("")}
      <div class="hstack"><button class="btn ghost" data-act="closemodal">Cancel</button></div></div>`);
  },
  recheck(el){
    const t = team(el.dataset.id), tr = tour(document.getElementById("rg-tour").value);
    const squad = squadPicked(t);
    const fails = hardFilter(t, tr, squad);
    document.getElementById("rg-check").innerHTML = filterReport(t, tr, fails, squad);
    const notes = document.getElementById("rg-notes"); if (notes) notes.innerHTML = entryNotesBlock(tr);
    const btn = document.querySelector('[data-act="dosubmit"]');
    if (btn) btn.disabled = fails.length > 0 || !!(tr && regWindowClosed(tr));
  },
  dosubmit(el){
    const t = team(el.dataset.id), tr = tour(document.getElementById("rg-tour").value);
    if (!tr) return toast("Pick a tournament", "crit");
    const squad = squadPicked(t);
    if (!squad.length) return toast("Pick at least one player to enter", "crit");
    if (tr.status !== "public") return toast("That tournament isn't open for registration", "crit");
    if (tr.drawn) return toast("The bracket is already drawn — entries are closed", "crit");
    const shut = regWindowClosed(tr); if (shut) return toast(shut, "crit");
    if (S.registrations.some(r => r.tour === tr.id && r.team === t.id && r.status !== "withdrawn"))
      return toast(`${t.name} is already registered for ${tr.name}`, "crit");
    if (regsOf(tr.id).filter(r => r.status === "approved").length >= tr.cap)
      return toast(`${tr.name} is full at ${tr.cap} squads`, "crit");
    const fails = hardFilter(t, tr, squad);
    if (fails.length){
      const reason = fails.map(f => `${f.user.name}: ${f.rule} ${f.got} (needs ${f.need})`).join("; ");
      S.registrations.push({ id: uid("rg"), tour: tr.id, team: t.id, status: "rejected", at: NOW(), reason, squad });
      save(); closeModal(); render();
      return toast("Rejected automatically by the hard filter", "crit");
    }
    S.registrations.push({ id: uid("rg"), tour: tr.id, team: t.id, status: "pending", at: NOW(), squad });
    notify(tr.organizer, `${t.name} registered for ${tr.name} and is waiting on your review.`, `#/t/${tr.id}/manage`);
    save(); closeModal(); render(); toast(`${t.name} registered — waiting on the organizer`);
  },
  withdraw(el){ const r = S.registrations.find(x => x.id === el.dataset.id);
    if (tour(r.tour).drawn && r.status === "approved") return A.wdrequest(el);
    if (!ask(el, { title: "Withdraw this registration?", kind: "danger", ok: "Withdraw",
      body: "The squad comes off the entry list. Registering again is a fresh registration and clears the hard filter again." })) return;
    S.registrations = S.registrations.filter(x => x.id !== r.id);
    save(); render(); toast("Registration withdrawn", "warn"); },
  revreg(el){
    const r = S.registrations.find(x => x.id === el.dataset.id), t = team(r.team), tr = tour(r.tour);
    modal(`<div class="vstack">
      <div class="disp" style="font-size:23px">${esc(t.name)}</div>
      <div class="tag"><em>//</em> Soft filter — the hard filter has already passed</div>
      ${entryNotesBlock(tr)}
      ${filterReport(t, tr, hardFilter(t, tr, r.squad), r.squad)}
      <div class="tblwrap"><table><tr><th>Player</th><th>Faculty</th><th>Year</th><th>Age</th></tr>
        ${(r.squad && r.squad.length ? r.squad : t.members).map(id => { const p = user(id); if (!p) return ""; return `<tr><td>${esc(p.name)}</td>
          <td class="sub">${esc(p.faculty)}</td><td class="num">${p.year}</td><td class="num">${ageOf(p.dob)}</td></tr>`; }).join("")}
      </table></div>
      <div class="hstack"><button class="btn" data-act="closemodal">Close</button>
        <button class="btn danger" data-act="reject" data-id="${r.id}">Reject squad</button>
        <button class="btn primary" data-act="approve" data-id="${r.id}">Approve squad</button></div></div>`);
  },
  approveall(el){
    const t = tour(el.dataset.id);
    const queue = regsOf(t.id).filter(r => r.status === "pending");
    const room = t.cap - regsOf(t.id).filter(r => r.status === "approved").length;
    if (!queue.length) return toast("Nothing waiting", "warn");
    if (!ask(el, { title: `Approve all ${queue.length} squad${queue.length===1?"":"s"} waiting on ${t.name}?`,
      ok: `Approve all ${queue.length}`,
      body: "Every one of them has already cleared the hard filter. This is the soft filter — approve individually if any needs a closer look." })) return;
    queue.slice(0, Math.max(0, room)).forEach(r => {
      r.status = "approved";
      notify(team(r.team).leader, `${team(r.team).name} was approved for ${t.name}.`, `#/t/${t.id}`);
    });
    const left = regsOf(t.id).filter(r => r.status === "pending").length;
    save(); render();
    toast(left ? `Approved up to the cap of ${t.cap} — ${left} still waiting` : `All ${queue.length} approved`);
  },
  approve(el){ const r = S.registrations.find(x => x.id === el.dataset.id); r.status = "approved";
    notify(team(r.team).leader, `${team(r.team).name} was approved for ${tour(r.tour).name}.`, `#/t/${r.tour}`);
    save(); closeModal(); render(); toast(`${team(r.team).name} approved — they are in the draw`); },
  reject(el){ const r = S.registrations.find(x => x.id === el.dataset.id);
    const why = prompt("Reason (shown to the team leader):", "Documents were not provided.");
    if (why === null) return;
    r.status = "rejected"; r.reason = why;
    notify(team(r.team).leader, `${team(r.team).name} was rejected for ${tour(r.tour).name}: ${why}`, "#/teams");
    save(); closeModal(); render(); toast("Squad rejected", "warn"); },

  /* bracket & results */
  draw(el){
    const t = tour(el.dataset.id);
    const n = regsOf(t.id).filter(r=>r.status==="approved").length;
    if (!ask(el, { title: `Draw ${t.name}?`, ok: "Draw the bracket",
      body: `${n} approved squads, ${formatName(t).toLowerCase()}. Seeded at random — you can rearrange the draw by hand until the first match starts.` })) return;
    generateBracket(t); save(); go(`#/t/${t.id}/bracket`); render(); toast(`Drawn — ${n} squads, ${formatName(t).toLowerCase()}`);
  },
  /* Arranging by hand is the same draw with the order supplied instead of shuffled,
     which is why it is allowed only while nothing has been played: the whole thing
     is rebuilt from the order, and a played result cannot be re-parented. */
  arrange(el){
    const t = tour(el.dataset.id);
    const approved = regsOf(t.id).filter(r => r.status === "approved").map(r => r.team);
    const order = approved.map((_, i) => { const e = document.getElementById("ar-" + i); return e ? e.value : ""; });
    const named = order.filter(Boolean);
    if (named.length !== approved.length) return toast("Every position needs a squad", "crit");
    if (new Set(named).size !== named.length) return toast("A squad can only be in one position", "crit");
    if (named.some(id => !approved.includes(id))) return toast("That squad is not in this tournament", "crit");
    const wasDrawn = t.drawn;
    generateBracket(t, named);
    save(); go(`#/t/${t.id}/bracket`); render();
    toast(wasDrawn ? "Draw rearranged — it locks when the first match starts" : "Drawn by hand — it locks when the first match starts");
  },
  /* When, where and who officiates — set per match, after the bracket exists.
     Opened as a popup from the schedule or the match itself, same as entry notes
     and announcements — a full page jump was the bug report, not the feature. */
  fixtureopen(el){
    const m = matchById(el.dataset.id); if (!m) return;
    modal(fixtureCard(m, tour(m.tour)));
  },
  assign(el){
    const m = matchById(el.dataset.id), t = tour(m.tour);
    const g = id => { const e = document.getElementById(id); return e ? String(e.value || "") : ""; };
    const need = refsNeeded(t);
    const picked = (t.referees || []).filter(id => { const e = document.getElementById(`as-r-${m.id}-${id}`); return e && e.checked; });
    if (picked.length && picked.length < need)
      return toast(`An ${t.channel} match needs at least ${need} referee${need > 1 ? "s" : ""} on it`, "crit");
    const when = g("as-k-" + m.id);
    if (when){ const at = new Date(when); if (isNaN(at.getTime())) return toast("That kick-off time is not a date", "crit");
      m.kickoff = at.toISOString(); }
    const where = g("as-v-" + m.id).trim();
    if (where) m.venue = where;
    const rawPin = g("as-p-" + m.id).trim();
    if (rawPin){ const pin = parsePin(rawPin);
      if (!pin) return toast("Paste a Google Maps link, or coordinates as “13.7367, 100.5232”", "crit");
      m.pin = pin; }
    if (picked.length) m.refs = picked;
    /* a player is told when they are due to play — not only their leader */
    const squads = [m.a, m.b].filter(Boolean);
    notifyAll(squads.flatMap(tid => lineupOf(m, tid).concat(team(tid).leader)),
      `${team(m.a) && team(m.b) ? `${team(m.a).name} vs ${team(m.b).name}` : t.name} — ${matchStage(m)} is set for ${fmtDate(m.kickoff)} at ${m.venue}.`, `#/m/${m.id}`);
    notifyAll(m.refs || [], `You are on ${matchStage(m)} in ${t.name} — ${fmtDate(m.kickoff)} at ${m.venue}.`, `#/m/${m.id}`);
    save(); closeModal(); render(); toast(`${matchStage(m)} scheduled — ${(m.refs || []).length} referee${(m.refs || []).length === 1 ? "" : "s"} on it`);
  },
  enter(el){
    const m = S.matches.find(x => x.id === el.dataset.id);
    const ra = document.getElementById("sc-a").value, rb = document.getElementById("sc-b").value;
    if (ra === "" || rb === "") return toast("Both scores are required", "crit");
    const a = Number(ra), b = Number(rb);
    if (!Number.isInteger(a) || !Number.isInteger(b)) return toast("Scores must be whole numbers", "crit");
    if (a < 0 || b < 0) return toast("A score can't be negative", "crit");
    if (a > 999 || b > 999) return toast("That score isn't plausible — 999 is the ceiling", "crit");
    /* level is allowed — but only with the decider that actually settled it, unless
       the format is round robin, where a level result is the record */
    const tr0 = tour(m.tour), dName = deciderName(tr0.sport);
    let decider = null;
    if (a === b && formatOf(tr0) === "roundrobin"){
      decider = null;                                  /* both squads take a point */
    } else if (a === b){
      const rda = (document.getElementById("dc-a") || {}).value;
      const rdb = (document.getElementById("dc-b") || {}).value;
      if (rda === "" || rdb === "" || rda === undefined || rdb === undefined)
        return toast(`${a}–${b} is level. A knockout match has to produce a winner — record the ${dName.toLowerCase()} as well.`, "crit");
      const da = Number(rda), db = Number(rdb);
      if (!Number.isInteger(da) || !Number.isInteger(db) || da < 0 || db < 0)
        return toast(`The ${dName.toLowerCase()} must be whole numbers`, "crit");
      if (da === db) return toast(`The ${dName.toLowerCase()} has to produce a winner`, "crit");
      decider = { a: da, b: db, kind: dName };
    }
    /* per-player statistics, recorded with the score (OF-03) */
    const num = id => { const e = document.getElementById(id); return e ? Number(e.value || 0) : 0; };
    const stats = {};
    [m.a, m.b].forEach(tid => lineupOf(m, tid).forEach(pid => {
      const goals = num("st-g-" + pid), assists = num("st-a-" + pid), x = {};
      statExtra(tr0.sport).forEach(([k]) => { const v = num(`st-x-${k}-${pid}`); if (v) x[k] = v; });
      if (goals || assists || Object.keys(x).length){
        stats[pid] = { goals, assists, team: tid };
        if (Object.keys(x).length) stats[pid].x = x;
      }
    }));
    /* and the team figures no player total can produce */
    const teamStats = {};
    [m.a, m.b].forEach(tid => {
      const row = {};
      statTeam(tr0.sport).forEach(([k, , kind]) => {
        const e = document.getElementById(`tm-${k}-${tid}`); if (!e) return;
        const v = kind === "text" ? String(e.value || "").trim() : Number(e.value || 0);
        if (v) row[k] = v;
      });
      if (Object.keys(row).length) teamStats[tid] = row;
    });
    const goalsA = Object.values(stats).filter(x => x.team === m.a).reduce((n, x) => n + x.goals, 0);
    const goalsB = Object.values(stats).filter(x => x.team === m.b).reduce((n, x) => n + x.goals, 0);
    if (Object.keys(stats).length && (goalsA > a || goalsB > b))
      return toast(`Player goals (${goalsA}–${goalsB}) exceed the score you entered (${a}–${b})`, "crit");
    m.sa = a; m.sb = b; m.decider = decider; m.stats = stats; m.teamStats = teamStats;
    m.status = "pending"; m.enteredBy = me().id;
    const tr = tour(m.tour), win = winnerId(m);
    /* a level result has no winning leader to wait on, so both are asked */
    const confirmers = tr.channel !== "onsite" ? [(m.refs || [])[0]]
      : win ? [team(win).leader] : [m.a, m.b].map(x => team(x).leader);
    notifyAll(confirmers.filter(Boolean), `A result is waiting on your confirmation: ${team(m.a).name} ${a}–${b} ${team(m.b).name}.`, `#/m/${m.id}`);
    save(); render(); toast(`Result recorded — waiting on the ${tr.channel === "onsite" ? (win ? "winning leader" : "team leaders") : "referee"} to confirm`);
  },
  confirm(el){
    const m = S.matches.find(x => x.id === el.dataset.id);
    const wasChamp = tour(m.tour).champion;
    m.status = "confirmed"; m.confirmedBy = me().id; advance(m);
    const tr = tour(m.tour), win = winnerOf(m);
    notifyAll([m.a,m.b].map(x=>team(x).leader), `Result confirmed: ${team(m.a).name} ${m.sa}–${m.sb} ${team(m.b).name}.`, `#/m/${m.id}`);
    notifyFollowers(m, `${team(m.a).name} ${m.sa}–${m.sb} ${team(m.b).name} — confirmed.`);
    save(); render();
    if (!wasChamp && tr.champion) championStamp(tr.champion, tr.name);
    toast(!win ? "Confirmed — the match finished level, a point each"
      : tr.champion === win ? `${team(win).name} win ${tr.name}!`
      : `Confirmed — ${team(win).name} advance`);
  },
  /* A result nobody confirms stalls the whole tournament, so the organizer can
     settle it — with their name on it, recorded as their decision, never silently
     and never as if the missing party had acted. */
  orgconfirm(el){
    const m = matchById(el.dataset.id), t = tour(m.tour);
    if (!ask(el, { title: "Confirm this result yourself?", ok: "Confirm as organizer",
      body: `${team(m.a).name} ${m.sa}–${m.sb} ${team(m.b).name}. It is recorded as your decision, not theirs, and both leaders are told.` })) return;
    const wasChamp = t.champion;
    m.status = "confirmed"; m.confirmedBy = me().id; m.confirmedByOrg = true; advance(m);
    notifyAll([m.a, m.b].filter(Boolean).map(x => team(x).leader),
      `The organizer confirmed ${team(m.a).name} ${m.sa}–${m.sb} ${team(m.b).name} — nobody signed it off in time.`, `#/m/${m.id}`);
    notifyFollowers(m, `${team(m.a).name} ${m.sa}–${m.sb} ${team(m.b).name} — confirmed by the organizer.`);
    save(); render();
    if (!wasChamp && t.champion) championStamp(t.champion, t.name);
    toast("Confirmed by you — the record says so", "warn");
  },
  dispute(el){
    const m = S.matches.find(x => x.id === el.dataset.id);
    m.status = "disputed"; m.disputedBy = me().id;
    /* the person clicked, but the objecting party is the squad — every screen that
       shows a dispute names the squad, so it is recorded here rather than derived */
    m.disputedTeam = [m.a, m.b].find(x => team(x) && team(x).leader === me().id) || null;
    notify(tour(m.tour).organizer, `${m.disputedTeam ? team(m.disputedTeam).name : me().name} disputed the result of ${team(m.a).name} vs ${team(m.b).name}.`, `#/m/${m.id}`);
    save(); render(); toast("Dispute raised — the organizer decides", "warn");
  },
  resolve(el){
    const m = S.matches.find(x => x.id === el.dataset.id);
    const a = +document.getElementById("sc-a").value, b = +document.getElementById("sc-b").value;
    if (a === b && !m.decider && formatOf(tour(m.tour)) !== "roundrobin")
      return toast("A knockout match needs a winner — reopen it if the tie went to a decider.", "crit");
    const tr = tour(m.tour), wasChamp = tr.champion;
    m.sa = a; m.sb = b; m.status = "confirmed"; m.confirmedBy = me().id; advance(m);
    notifyAll([m.a,m.b].map(x=>team(x).leader), `The organizer settled the dispute: ${team(m.a).name} ${a}–${b} ${team(m.b).name}.`, `#/m/${m.id}`);
    save(); render();
    if (!wasChamp && tr.champion) championStamp(tr.champion, tr.name);
    toast(`Dispute settled — ${team(winnerOf(m)).name} advance`);
  },

  /* Who plays, and who starts. Named before kick-off by the squad's leader; a
     squad that names nobody fields whoever started last time, because paperwork
     must never be the reason a match cannot be played. */
  lineup(el){
    const m = matchById(el.dataset.id), tid = el.dataset.t, tm = team(tid);
    const pick = id => { const e = document.getElementById("ln-" + id); return e ? String(e.value || "") : ""; };
    const roster = lineupOf(m, tid).concat(tm.members.filter(x => !lineupOf(m, tid).includes(x)));
    const starters = [], subs = [];
    roster.forEach(id => { const v = pick(id); if (v === "start") starters.push(id); else if (v === "sub") subs.push(id); });
    if (!starters.length) return toast("Name at least one starter", "crit");
    m.lineup = m.lineup || {};
    m.lineup[tid] = { starters, subs };
    /* somebody dropped from the lineup cannot stay checked in for it */
    const named = [...starters, ...subs];
    m.checkedIn = (m.checkedIn || []).filter(id => !tm.members.includes(id) || named.includes(id));
    save(); render(); toast(`${starters.length} starting, ${subs.length} on the bench`);
  },

  /* check-in */
  checkin(el){ const m = S.matches.find(x => x.id === el.dataset.id);
    if (!m.checkedIn.includes(el.dataset.u)) m.checkedIn.push(el.dataset.u);
    save(); render(); toast(`${user(el.dataset.u).name} checked in`); },
  roomcode(el){ const m = S.matches.find(x => x.id === el.dataset.id);
    const v = document.getElementById("rc-" + m.id);
    m.roomCode = v ? v.value.trim() : "";
    save(); render(); toast(m.roomCode ? "Room code saved" : "Room code cleared"); },
  uncheck(el){ const m = S.matches.find(x => x.id === el.dataset.id);
    if (!ask(el, { title: `Mark ${user(el.dataset.u).name} ineligible for this match?`, kind: "danger",
      ok: "Mark ineligible", body: "They cannot play this match, and the organizer is told it was you." })) return;
    m.checkedIn = m.checkedIn.filter(x => x !== el.dataset.u);
    notify(tour(m.tour).organizer, `${user(el.dataset.u).name} was marked ineligible at check-in by ${me().name}.`, `#/m/${m.id}`);
    save(); render(); toast("Marked ineligible and reported to the organizer", "warn"); },

  /* squad transfer & disband */
  transfer(el){
    const t = team(el.dataset.id);
    const others = t.members.filter(x => x !== t.leader);
    if (!others.length) return toast("Nobody else in the squad to hand over to", "warn");
    modal(`<div class="vstack">
      <div class="disp" style="font-size:23px">Hand over ${esc(t.name)}</div>
      <div class="field"><label>New leader</label><select id="tr-to">
        ${others.map(id => `<option value="${id}">${esc(user(id).name)}</option>`).join("")}</select></div>
      
      <div class="hstack"><button class="btn" data-act="closemodal">Cancel</button>
        <button class="btn primary" data-act="dotransfer" data-id="${t.id}">Hand over</button></div></div>`);
  },
  dotransfer(el){
    const t = team(el.dataset.id), to = document.getElementById("tr-to").value;
    if (!t.members.includes(to)) return toast("That person isn't in the squad", "crit");
    const from = t.leader; t.leader = to;
    notify(to, `${user(from).name} handed you the captaincy of ${t.name}.`, "#/teams");
    save(); closeModal(); render(); toast(`${user(to).name} now leads ${t.name}`);
  },
  disband(el){
    const t = team(el.dataset.id);
    if (!ask(el, { title: `Disband ${t.name}?`, kind: "danger", ok: "Disband the squad",
      body: "Pending invitations are cancelled. Past results stay published — finished leaderboards depend on them." })) return;
    S.invites = S.invites.filter(i => i.team !== t.id || i.status !== "pending");
    S.registrations = S.registrations.filter(r => r.team !== t.id || r.status === "approved");
    t.disabled = true; t.disabledWhy = "Disbanded by its leader.";
    notifyAll(t.members, `${t.name} was disbanded.`, "#/teams");
    save(); render(); toast(`${t.name} disbanded`, "warn");
  },

  /* withdrawal from a live bracket needs the organizer */
  wdrequest(el){
    const r = regById(el.dataset.id);
    r.withdrawRequested = true;
    notify(tour(r.tour).organizer, `${team(r.team).name} asked to withdraw from ${tour(r.tour).name} — the bracket is live.`, `#/t/${r.tour}/manage`);
    save(); render(); toast("Withdrawal request sent to the organizer", "warn");
  },
  wdapprove(el){
    const r = regById(el.dataset.id), t = team(r.team), tr = tour(r.tour);
    /* the opponent gets a walkover wherever this squad still appears */
    S.matches.filter(m => m.tour === tr.id && m.status !== "confirmed" && (m.a === t.id || m.b === t.id)).forEach(m => {
      const other = m.a === t.id ? m.b : m.a;
      if (other){ m.sa = m.a === other ? 1 : 0; m.sb = m.b === other ? 1 : 0; m.status = "confirmed"; m.note = "walkover"; advance(m); }
      else { m.status = "void"; m.note = "void"; }
    });
    r.status = "withdrawn"; r.withdrawRequested = false;
    notify(t.leader, `${t.name} was withdrawn from ${tr.name}. Remaining opponents receive a walkover.`, "#/teams");
    save(); render(); toast(`${t.name} withdrawn — opponents given a walkover`, "warn");
  },

  /* organizer can reopen a confirmed result, but only if nothing was played on top */
  reopen(el){
    const m = matchById(el.dataset.id), tr = tour(m.tour);
    const winner = winnerOf(m), loser = winner ? [m.a, m.b].find(x => x && x !== winner) : null;
    /* pull both back out — in double elimination a result seeds two matches, not one */
    const pull = (e, tid) => { const nx = edgeTarget(e); if (nx && tid && nx[e.side] === tid) nx[e.side] = null; };
    if (m.winTo || m.loseTo){ pull(m.winTo, winner); pull(m.loseTo, loser); if (!m.winTo) tr.champion = null; }
    else if (formatOf(tr) !== "roundrobin"){
      const next = nextOf(m);
      if (next){ if (next.a === winner) next.a = null; if (next.b === winner) next.b = null; }
      else tr.champion = null;
    }
    if (formatOf(tr) === "roundrobin") tr.champion = null;
    m.status = "pending"; m.confirmedBy = null;
    notifyAll([m.a, m.b].filter(Boolean).map(x => team(x).leader),
      `The organizer reopened ${team(m.a).name} vs ${team(m.b).name} for review.`, `#/m/${m.id}`);
    save(); render(); toast("Result reopened — the winner was pulled back out of the next round", "warn");
  },

  /* A link to video of a match that is already over. The organizer of that
     tournament adds it and nobody else: one person accountable for what a public
     page points at, and no moderation queue to build. */
  replay(el){
    const m = matchById(el.dataset.id);
    const box = document.getElementById("rp-" + m.id);
    const url = String(box ? box.value : "").trim();
    if (url && !/^https?:\/\/[^\s]+$/i.test(url)) return toast("A replay link has to be a full http(s) address", "crit");
    m.replay = url || null;
    if (url) notifyFollowers(m, `The replay of ${team(m.a).name} v ${team(m.b).name} is up.`);
    save(); render(); toast(url ? "Replay link published" : "Replay link removed", url ? "ok" : "warn");
  },

  pickopen(el){ modal(pickBlock(matchById(el.dataset.id))); },
  commentopen(el){ modal(commentBlock(matchById(el.dataset.id))); },

  /* Pick'em — a prediction, before kick-off, worth one point */
  pick(el){
    const m = matchById(el.dataset.id), side = el.dataset.side;
    const existing = S.picks.find(p => p.match === m.id && p.by === sid());
    if (existing) existing.team = side; else S.picks.push({ id: uid("pk"), match: m.id, by: sid(), team: side });
    save(); render();
    if (el.dataset.from === "modal") modal(pickBlock(m));
    toast(`Prediction saved — ${team(side).name}`);
  },
  comment(el){
    const box = document.getElementById("cm-" + el.dataset.id);
    const text = (box ? box.value : "").trim();
    if (text.length < 2) return toast("Write something first", "crit");
    if (text.length > 500) return toast("Keep it under 500 characters", "crit");
    S.comments.push({ id: uid("cm"), match: el.dataset.id, by: sid(), text, at: NOW() });
    if (box) box.value = "";
    save(); render();
    if (el.dataset.from === "modal") modal(commentBlock(matchById(el.dataset.id)));
    toast("Posted");
  },
  delcomment(el){
    S.comments = S.comments.filter(c => c.id !== el.dataset.id);
    save(); render();
    const m = el.dataset.match && matchById(el.dataset.match);
    if (el.dataset.from === "modal" && m) modal(commentBlock(m));
    toast("Comment removed", "warn");
  },
  feedback(el){
    const t = tour(el.dataset.id);
    const rating = +((document.getElementById("fb-rating") || {}).value || 0);
    const text = ((document.getElementById("fb-text") || {}).value || "").trim();
    if (!Number.isInteger(rating) || rating < 1 || rating > 5) return toast("Rate it from 1 to 5", "crit");
    const at = S.feedback.findIndex(f => f.tour === t.id && f.by === sid());
    const row = { id: at >= 0 ? S.feedback[at].id : uid("fb"), tour: t.id, by: sid(), rating, text, at: NOW() };
    if (at >= 0) S.feedback[at] = row; else S.feedback.push(row);
    notify(t.organizer, `${me().name} left feedback on ${t.name} — ${rating} out of 5.`, `#/t/${t.id}/manage`);
    save(); render(); toast(at >= 0 ? "Feedback updated" : "Feedback sent to the organizer");
  },
  vote(el){
    const t = tour(el.dataset.id), who = el.dataset.u;
    S.votes.push({ id: uid("vt"), tour: t.id, by: sid(), player: who });
    save(); render(); toast(`Vote cast for ${user(who).name}`);
  },
  followlist(el){ modal(followList(el.dataset.id, el.dataset.mode === "followers" ? "followers" : "following")); },
  follow(el){
    const key = el.dataset.kind + ":" + el.dataset.id;
    const at = S.follows.findIndex(f => f.by === sid() && f.key === key);
    if (at >= 0){ S.follows.splice(at, 1); toast("Unfollowed", "warn"); }
    else { S.follows.push({ by: sid(), key }); toast("Following — you'll be told when they play"); }
    save(); render();
    /* pressed inside a list, so the list is what has to change under the finger */
    if (el.dataset.from === "modal" && el.dataset.list){
      const [pid, mode] = el.dataset.list.split(":");
      modal(followList(pid, mode));
    }
  },

  /* referee appointments are offers, not orders */
  refreply(el){
    const inv = S.refInvites.find(x => x.id === el.dataset.id), t = tour(inv.tour);
    inv.status = el.dataset.reply;
    if (inv.status === "accepted"){
      t.referees = t.referees || [];
      if (!t.referees.includes(inv.user)) t.referees.push(inv.user);
      notify(t.organizer, `${me().name} accepted the appointment for ${t.name}.`, `#/t/${t.id}/manage`);
    } else {
      notify(t.organizer, `${me().name} declined the appointment for ${t.name}.`, `#/t/${t.id}/manage`);
    }
    save(); render(); toast(inv.status === "accepted" ? `Appointed to ${t.name}` : "Appointment declined", inv.status === "accepted" ? "ok" : "warn");
  },
  grantperm(el){
    const u = user(el.dataset.u), k = el.dataset.k;
    u.perms = u.perms || {}; u.perms[k] = !u.perms[k];
    notify(u.id, `An admin ${u.perms[k] ? "granted" : "revoked"} your permission: ${k}.`, "#/me");
    save(); render(); toast(`${u.perms[k] ? "Granted" : "Revoked"} — ${esc(u.name)}`);
  },
  permanent(el){
    const t = team(el.dataset.id); t.permanent = !t.permanent;
    if (t.permanent){ t.disabled = false; t.disabledWhy = ""; }
    t.permanentRequest = null;
    notify(t.leader, t.permanent ? `${t.name} was made a permanent squad — it is exempt from automatic disabling.`
      : `${t.name} is no longer permanent.`, "#/teams");
    save(); render(); toast(t.permanent ? `${t.name} is permanent` : `${t.name} is no longer permanent`);
  },

  /* misc */
  readall(){ S.notifications.filter(n => n.to === me().id).forEach(n => n.read = true); save(); render(); },
  undo(){ offerUndo(); },
  shortcuts(){ modal(shortcutSheet()); },
  closemodal(){ pendingAsk = null; closeModal(); },
  okask(){ const p = pendingAsk; pendingAsk = null; closeModal();
    if (p && p.act) run(p.act, { dataset: p.dataset }); },
};
/* Everything the requester filled in (requirement.txt §5), so an admin decides on
   the request rather than on its name. Kept pure and separate from the modal that
   shows it — the same reason filterReport is. */
function requestReport(t){
  const u = user(t.organizer), r = t.rules || {};
  /* a spec sheet, not a stat wall: these are one-off facts to read down, and the
     display face is unreadable on a venue name. th carries the label, td the value. */
  const sheet = rows => `<div class="tblwrap"><table>${rows.map(([k, v, cls]) =>
    `<tr><th style="width:38%;border-bottom:1px solid var(--line)">${esc(k)}</th>
      <td class="${cls || ""}">${v}</td></tr>`).join("")}</table></div>`;
  const open = r.gender === "any" && r.faculty === "any" && (r.major || "any") === "any"
    && (r.year ?? "any") === "any" && ageLimit(r.ageMin) === null && ageLimit(r.ageMax) === null;
  return `<div class="vstack">
    <div class="spread">
      <span class="tag"><em>//</em> Request to organize</span>${badge("warn","Pending your decision")}
    </div>
    <div class="disp" style="font-size:25px;line-height:1.05">${esc(t.name)}</div>
    <div class="hstack" style="gap:9px">
      <span class="avatar">${esc((u ? u.name : "?")[0])}</span>
      <span class="sub">${esc(u ? u.name : t.organizer)}${u ? ` · ${esc(u.faculty)} · Year ${u.year}` : ""}</span>
    </div>

    ${sheet([
      ["Sport", esc(t.sport)],
      ["Match date", esc(t.date), "num"],
      ["Venue", esc(t.venue)],
      ["Team cap", esc(String(t.cap)), "num"],
      ["Channel", `${badge(t.channel === "onsite" ? "warn" : "ok", t.channel === "onsite" ? "On-site" : "Online")}
        <span class="sub" style="margin-left:8px">${t.channel === "onsite"
          ? "2 referees must accept before it can be published"
          : "1 referee must accept before it can be published"}</span>`],
    ])}

    <div class="spread" style="margin-top:2px">
      <span class="tag"><em>//</em> Entry rules</span>
      ${open ? badge("neutral","Open to everyone") : badge("crit","Restricted")}
    </div>
    ${sheet([
      ["Registration opens", esc(r.regOpens || "immediately")],
      ["Registration closes", esc(r.regCloses || "until full or drawn")],
      ["Tournament starts", esc(r.tourStart || "not set")],
      ["Tournament ends", esc(r.tourEnd || "not set")],
      ["Age", esc(ageBand(r)), "num"],
      ["Gender", esc(String(r.gender))],
      ["Faculty", esc(String(r.faculty))],
      ["Major", esc(String(r.major || "any"))],
      ["Year of study", esc(String(r.year ?? "any"))],
    ])}
    <div class="banner warn">${ic("warn",16)}<span class="grow">These become the <b>hard filter</b>. Any squad with a player outside them is rejected automatically and there is no override afterwards — so they are the thing to check now.</span></div>

    <div class="hstack" style="justify-content:flex-end;gap:9px;padding-top:2px">
      <button class="btn ghost" data-act="closemodal">Close</button>
      <button class="btn danger" data-act="rejtour" data-id="${t.id}">Reject…</button>
      <button class="btn primary" data-act="apptour" data-id="${t.id}">Approve</button>
    </div>
    
  </div>`;
}

/* Which members the leader ticked. A stub with no checkboxes at all — the test
   harness, or a browser that never rendered them — means the whole squad enters,
   which is the behaviour this had before the list existed. */
function squadPicked(tm){
  const boxes = tm.members.map(id => ({ id, el: document.getElementById("sq-" + id) }))
    .filter(x => x.el && "checked" in x.el);
  if (!boxes.length) return tm.members.slice();
  return boxes.filter(x => x.el.checked).map(x => x.id);
}
/* What the organizer wrote about entering, shown but never checked by the system */
function entryNotesBlock(tr){
  const notes = tr && tr.entryNotes ? String(tr.entryNotes).trim() : "";
  if (!notes) return "";
  return `<div class="banner warn">${ic("warn",16)}<span class="grow">
    <b>Soft filter from the organizer.</b> The system does not check these — they do, when they review your squad.<br>
    ${esc(notes)}</span></div>`;
}
function filterReport(t, tr, fails, squad){
  const n = (squad && squad.length ? squad : t.members).length;
  const shut = tr && regWindowClosed(tr);
  if (shut) return `<div class="banner crit">${ic("warn",16)}<span class="grow"><b>${esc(shut)}</b></span></div>`;
  if (!fails.length) return `<div class="banner ok">${ic("check",16)}<span class="grow">
    <b>All ${n} entering players clear the entry rules.</b> The organizer still reviews the squad afterwards.</span></div>`;
  return `<div class="banner crit">${ic("warn",16)}<span class="grow">
      <b>${fails.length} check${fails.length===1?"":"s"} failed.</b> The system rejects this registration automatically — there is no organizer override.</span></div>
    <div class="tblwrap"><table><tr><th>Player</th><th>Rule</th><th>Required</th><th>Actual</th></tr>
      ${fails.map(f => `<tr><td>${esc(f.user.name)}</td><td>${esc(f.rule)}</td>
        <td class="sub">${esc(f.need)}</td><td style="color:var(--red-text)">${esc(f.got)}</td></tr>`).join("")}</table></div>`;
}

/* ══════════════════════════════════════════════════════════════
   PERMISSIONS — the single place that decides who may do what.

   Hiding a button is presentation, not protection: every handler here is
   reachable from the console, and in a real client would be reachable from a
   forged request. So authority is declared once, per action, and the dispatcher
   refuses anything that isn't allowed. A real back end must repeat these checks —
   nothing a browser decides can be trusted — but the rules live in one readable
   table either way.

   Each entry returns true, or a string explaining the refusal to the user.
   ══════════════════════════════════════════════════════════════ */
const NEED_LOGIN = "Sign in first.";
const PERM = {
  /* tournaments */
  reqtour:  () => !!me() || NEED_LOGIN,
  revtour:  el => { if (!me() || me().role !== "Admin") return "Only an admin can review a tournament request.";
              const t = tour(el.dataset.id); if (!t) return "No such request.";
              return t.status === "pending" || "That request has already been decided."; },
  apptour:  () => (me() && me().role === "Admin") || "Only an admin can approve a tournament request.",
  rejtour:  () => (me() && me().role === "Admin") || "Only an admin can reject a tournament request.",
  publish:  el => { const t = tour(el.dataset.id); if (!t) return "No such tournament.";
              if (!isOrg(t)) return "Only this tournament's organizer can publish it.";
              if (t.status !== "private") return "Only a private tournament can be published.";
              const need = refsNeeded(t);
              return (t.referees||[]).length >= need
                || `An ${t.channel} tournament needs ${need} accepted referee${need>1?"s":""} before it can go public.`; },
  edittour: el => { const t = tour(el.dataset.id); return (t && isOrg(t)) || "Only this tournament's organizer can edit it."; },
  /* the appointment list stays open after the draw — feedback pass 1 moved
     scheduling and per-match officials to AFTER the bracket exists, and an
     appointment nobody can add to is an appointment nobody can fix */
  ref:      el => { const t = tour(el.dataset.id); if (!t) return "No such tournament.";
              return isOrg(t) || "Only this tournament's organizer can appoint referees."; },
  refappoint: el => PERM.ref(el),
  announce: el => { const t = tour(el.dataset.id); return (t && isOrg(t)) || "Only this tournament's organizer can post announcements."; },
  entrynotes: el => { const t = tour(el.dataset.id); return (t && isOrg(t)) || "Only this tournament's organizer writes the entry notes."; },
  draw:     el => { const t = tour(el.dataset.id); if (!t) return "No such tournament.";
              if (!isOrg(t)) return "Only this tournament's organizer can draw the bracket.";
              if (t.drawn) return "The bracket is already drawn. A draw cannot be repeated — it would destroy every result.";
              if (t.status !== "public") return "Publish the tournament before drawing.";
              const n = regsOf(t.id).filter(r => r.status === "approved").length;
              if (formatOf(t) === "double" && n < 4)
                return "Double elimination needs at least four squads — with fewer, the losers bracket has nothing in it.";
              return n >= 2 || "At least two approved squads are needed."; },

  arrange:  el => { const t = tour(el.dataset.id); if (!t) return "No such tournament.";
              if (!isOrg(t)) return "Only this tournament's organizer can arrange the draw.";
              if (t.drawn) return !drawStarted(t) || "The first match has started — the draw is fixed now.";
              if (t.status !== "public") return "Publish the tournament before drawing.";
              const n = regsOf(t.id).filter(r => r.status === "approved").length;
              if (formatOf(t) === "double" && n < 4)
                return "Double elimination needs at least four squads — with fewer, the losers bracket has nothing in it.";
              return n >= 2 || "At least two approved squads are needed."; },
  assign:   el => { const m = matchById(el.dataset.id); if (!m) return "No such match.";
              if (!isOrg(tour(m.tour))) return "Only this tournament's organizer schedules matches.";
              if (m.status !== "scheduled") return `This match is already ${m.status}.`;
              return !(m.checkedIn || []).length || "Check-in has started on this match."; },

  /* registrations */
  approveall: el => { const t = tour(el.dataset.id); if (!t) return "No such tournament.";
              if (!isOrg(t)) return "Only this tournament's organizer can approve squads.";
              if (t.drawn) return "The bracket is drawn — no more squads can enter.";
              return regsOf(t.id).some(r => r.status === "pending") || "Nothing is waiting on review."; },
  approve:  el => { const r = regById(el.dataset.id); if (!r) return "No such registration.";
              if (!isOrg(tour(r.tour))) return "Only this tournament's organizer can approve squads.";
              if (r.status !== "pending") return `That registration is already ${r.status}.`;
              if (tour(r.tour).drawn) return "The bracket is drawn — no more squads can enter.";
              const cap = tour(r.tour).cap, now = regsOf(r.tour).filter(x => x.status === "approved").length;
              return now < cap || `The tournament is full at ${cap} squads.`; },
  reject:   el => { const r = regById(el.dataset.id); if (!r) return "No such registration.";
              if (!isOrg(tour(r.tour))) return "Only this tournament's organizer can reject squads.";
              return r.status === "pending" || `That registration is already ${r.status}.`; },
  revreg:   el => { const r = regById(el.dataset.id); return (r && isOrg(tour(r.tour))) || "Not your tournament."; },
  dosubmit: el => { const t = team(el.dataset.id); if (!t) return "No such squad.";
              return t.leader === sid() || "Only the squad's leader can register it."; },
  regfor:   el => { const tr = tour(el.dataset.id); if (!tr) return "No such tournament.";
              if (!me()) return NEED_LOGIN;
              if (tr.status !== "public") return "This tournament is not open for registration.";
              if (tr.drawn) return "The bracket is already drawn — entries are closed.";
              if (regsOf(tr.id).filter(r => r.status === "approved").length >= tr.cap)
                return `${tr.name} is full at ${tr.cap} squads.`;
              if (el.dataset.team){ const t = team(el.dataset.team);
                if (!t) return "No such squad.";
                if (t.leader !== sid()) return "Only the squad's leader can register it."; }
              return !!squadsFor(tr).length || "You lead no squad that can still enter this one."; },
  register: el => { const t = team(el.dataset.id); if (!t) return "No such squad.";
              if (t.leader !== sid()) return "Only the squad's leader can register it.";
              if (t.disabled) return "This squad has been disabled and cannot enter anything.";
              return teamReady(t) || `A Forming squad can't register — ${t.sport ? `${t.sport} needs` : "it needs"} ${minSquad(t)} accepted members.`; },
  withdraw: el => { const r = regById(el.dataset.id); if (!r) return "No such registration.";
              return team(r.team).leader === sid() || "Only the squad's leader can withdraw it."; },
  wdapprove:el => { const r = regById(el.dataset.id); return (r && isOrg(tour(r.tour))) || "Only the organizer can allow a withdrawal from a live bracket."; },

  /* squads */
  createteam: () => !!me() || NEED_LOGIN,
  logo:       el => { const t = team(el.dataset.id); return (t && t.leader === sid()) || "Only the squad's leader can change its badge."; },
  reqpermanent: el => { const t = team(el.dataset.id); if (!t) return "No such squad.";
              if (t.leader !== sid()) return "Only the squad's leader can ask for permanent status.";
              if (t.permanent) return "This squad is already permanent.";
              return !t.permanentRequest || "An admin already has that request."; },
  denypermanent: () => (me() && me().role === "Admin") || "Only an admin decides on permanent status.",
  reqfilter:  el => { const t = tour(el.dataset.id); if (!t) return "No such tournament.";
              if (!isOrg(t)) return "Only the organizer can request a Hard Filter change.";
              return !t.filterChangeRequest || "An admin already has that request."; },
  denyfilter: () => (me() && me().role === "Admin") || "Only an admin decides on a Hard Filter change.",
  sendfilter: el => PERM.reqfilter(el),
  allowfilter:() => (me() && me().role === "Admin") || "Only an admin decides on a Hard Filter change.",
  invite:     el => { const t = team(el.dataset.id); return (t && t.leader === sid()) || "Only the squad's leader can invite."; },
  sendinvite: el => { const t = team(el.dataset.id); return (t && t.leader === sid()) || "Only the squad's leader can invite."; },
  uninvite:   el => { const i = S.invites.find(x => x.id === el.dataset.id);
                return (i && team(i.team).leader === sid()) || "Only the squad's leader can cancel an invitation."; },
  accept:     el => { const i = S.invites.find(x => x.id === el.dataset.id); if (!i) return "No such invitation.";
                if (i.user !== sid()) return "That invitation was addressed to somebody else.";
                return i.status === "pending" || "That invitation is no longer open."; },
  decline:    el => { const i = S.invites.find(x => x.id === el.dataset.id); if (!i) return "No such invitation.";
                if (i.user !== sid()) return "That invitation was addressed to somebody else.";
                return i.status === "pending" || "That invitation is no longer open."; },
  kick:       el => { const t = team(el.dataset.id); if (!t) return "No such squad.";
                if (t.leader !== sid()) return "Only the squad's leader can remove a player.";
                if (el.dataset.u === t.leader) return "A leader can't remove themselves — transfer the captaincy first.";
                return !hasActiveEntry(t.id) || ROSTER_LOCK_MSG; },
  transfer:   el => { const t = team(el.dataset.id); return (t && t.leader === sid()) || "Only the current leader can hand over."; },
  disband:    el => { const t = team(el.dataset.id); if (!t) return "No such squad.";
                if (t.leader !== sid()) return "Only the squad's leader can disband it.";
                return !hasActiveEntry(t.id) || ROSTER_LOCK_MSG; },

  /* results */
  enter:    el => { const m = matchById(el.dataset.id); if (!m) return "No such match.";
              const t = tour(m.tour);
              if (!m.a || !m.b) return "This match is still waiting on an earlier round.";
              if (m.status !== "scheduled") return `This result is already ${m.status}. It can't be re-entered.`;
              if (t.channel === "onsite"){
                if (!(m.refs||[]).includes(sid())) return "On-site results are recorded by the appointed referees.";
                if ((m.refs||[]).length < 2) return "An on-site match needs two referees before a result can be recorded.";
              } else {
                if (!isLeaderOf(m.a) && !isLeaderOf(m.b)) return "Online results are submitted by the winning team's leader.";
              }
              return checkedInEnough(m) || "Nobody has checked in yet. Check-in opens the match."; },
  confirm:  el => { const m = matchById(el.dataset.id); if (!m) return "No such match.";
              if (m.status !== "pending") return `Nothing to confirm — this match is ${m.status}.`;
              const t = tour(m.tour), win = winnerId(m);
              if (t.channel === "onsite"){
                if (!win) return (isLeaderOf(m.a) || isLeaderOf(m.b))
                  || "A level result is confirmed by either leader — neither side won it.";
                return team(win).leader === sid()
                  || "On-site, only the winning team's leader confirms. The other side can raise a dispute.";
              }
              return (m.refs||[]).includes(sid()) || "Online, the referee confirms the submitted result."; },
  dispute:  el => { const m = matchById(el.dataset.id); if (!m) return "No such match.";
              /* requirement.txt §8 and CONTEXT.md both scope disputes to on-site play:
                 online has a server record behind it and a referee checking the
                 submission, so there is nothing for a leader to contest. */
              if (tour(m.tour).channel !== "onsite")
                return "Online results are checked by the referee before confirmation — there is no dispute step.";
              if (m.status !== "pending") return m.status === "confirmed"
                ? "This result is already confirmed and the bracket has advanced. Ask the organizer to reopen it."
                : `Nothing to dispute — this match is ${m.status}.`;
              return (isLeaderOf(m.a) || isLeaderOf(m.b)) || "Only a team leader in this match can dispute it."; },
  orgconfirm: el => { const m = matchById(el.dataset.id); if (!m) return "No such match.";
              if (!isOrg(tour(m.tour))) return "Only this tournament's organizer can confirm a stalled result.";
              return m.status === "pending" || `Nothing is stalled — this match is ${m.status}.`; },
  resolve:  el => { const m = matchById(el.dataset.id); if (!m) return "No such match.";
              if (!isOrg(tour(m.tour))) return "Only the organizer settles a dispute.";
              return m.status === "disputed" || "This match is not under dispute."; },
  reopen:   el => { const m = matchById(el.dataset.id); if (!m) return "No such match.";
              if (!isOrg(tour(m.tour))) return "Only the organizer can reopen a confirmed result.";
              if (m.status !== "confirmed") return "Only a confirmed result can be reopened.";
              return !dependentsPlayed(m) || "A later round has already been played from this result."; },

  lineup:   el => { const m = matchById(el.dataset.id); if (!m) return "No such match.";
              const tid = el.dataset.t;
              if (!tid || (m.a !== tid && m.b !== tid)) return "That squad is not in this match.";
              if (!isLeaderOf(tid)) return "Only the squad's leader names the lineup.";
              return m.status === "scheduled" || "The result is already in — the lineup is part of the record now."; },

  /* check-in */
  checkin:  el => { const m = matchById(el.dataset.id); if (!m) return "No such match.";
              if (m.status === "confirmed") return "This match is over.";
              const who = el.dataset.u;
              if (who === sid()) return inMatch(m, sid()) || "You are not in this match.";
              return (m.refs||[]).includes(sid()) || "Only a referee can check somebody else in."; },
  uncheck:  el => { const m = matchById(el.dataset.id); if (!m) return "No such match.";
              return (m.refs||[]).includes(sid()) || "Only a referee can mark a player ineligible."; },
  roomcode: el => { const m = matchById(el.dataset.id); if (!m) return "No such match.";
              return (m.refs||[]).includes(sid()) || "Only a referee can set the room code."; },

  /* phase 2 */
  replay:   el => { const m = matchById(el.dataset.id); if (!m) return "No such match.";
              if (!isOrg(tour(m.tour))) return "Only this tournament's organizer can add a replay link.";
              return m.status === "confirmed" || "A replay belongs to a match that is over."; },
  pickopen: el => { const m = matchById(el.dataset.id); if (!m) return "No such match.";
              if (!me()) return "Sign in to make a prediction.";
              if (!(m.a && m.b)) return "This match doesn't have both teams yet.";
              return !officiates(m.tour) || "You are officiating this tournament — predictions are closed to you."; },
  pick:     el => { const m = matchById(el.dataset.id); if (!m) return "No such match.";
              if (!me()) return "Sign in to make a prediction.";
              if (m.status !== "scheduled") return "Predictions close when the match starts.";
              if (!(m.a && m.b)) return "This match doesn't have both teams yet.";
              /* whoever decides the result cannot also bet on it — and the ban covers
                 the whole competition, not only the matches they were handed */
              return !officiates(m.tour) || "You are officiating this tournament — predictions are closed to you."; },
  vote:     el => { const t = tour(el.dataset.id); if (!t) return "No such tournament.";
              if (!me()) return "Sign in to vote.";
              if (!t.champion) return "MVP voting opens when the final is confirmed.";
              return !S.votes.some(v => v.tour === t.id && v.by === sid()) || "You have already voted in this tournament."; },
  comment:  el => { const m = matchById(el.dataset.id); if (!m) return "No such match.";
              return !!me() || "Sign in to join the conversation."; },
  delcomment: el => { const c = S.comments.find(x => x.id === el.dataset.id); if (!c) return "No such comment.";
              if (c.by === sid()) return true;
              const m = matchById(c.match);
              /* the organizer moderates what is posted under their own tournament */
              return (m && isOrg(tour(m.tour))) || "You can only remove your own comment."; },
  feedback: el => { const t = tour(el.dataset.id); if (!t) return "No such tournament.";
              if (!me()) return "Sign in to leave feedback.";
              return t.organizer !== sid() || "This is your tournament — feedback comes from everybody else."; },
  follow:   () => !!me() || NEED_LOGIN,
  refreply: el => { const inv = S.refInvites.find(x => x.id === el.dataset.id); if (!inv) return "No such appointment.";
              if (inv.user !== sid()) return "That appointment was offered to somebody else.";
              return inv.status === "pending" || "You already answered this."; },
  grantperm:() => (me() && me().role === "Admin") || "Only an admin can change permissions.",
  permanent:() => (me() && me().role === "Admin") || "Only an admin can grant permanent status.",
  dotransfer:el => { const t = team(el.dataset.id); return (t && t.leader === sid()) || "Only the current leader can hand over."; },
  wdrequest: el => { const r = regById(el.dataset.id); if (!r) return "No such registration.";
              return team(r.team).leader === sid() || "Only the squad's leader can withdraw it."; },

  /* self */
  undo:     () => !!undoSnap || "Nothing to undo.",
  shortcuts:() => true,
  readall:  () => !!me() || NEED_LOGIN,
};
const sid = () => (me() ? me().id : null);
const regById = id => S.registrations.find(r => r.id === id);
const matchById = id => S.matches.find(m => m.id === id);
const isLeaderOf = tid => !!tid && team(tid) && team(tid).leader === sid();
/* appointed to this competition, whether or not this particular match is theirs */
const officiates = tid => { const u = sid(); if (!u) return false;
  const t = tour(tid);
  return !!(t && (t.referees || []).includes(u)) || S.matches.some(m => m.tour === tid && (m.refs || []).includes(u)); };
const inMatch = (m, u) => [m.a, m.b].filter(Boolean).some(t => team(t).members.includes(u));
/* Roster lock: an approved Squad list is a snapshot the system depends on staying
   intact for the tournament's run — kicking, disbanding or transferring away from
   it is exactly as disruptive as emptying the roster. Locks from approval, not
   the Draw, and stays locked even after this squad is eliminated, because it
   tracks the tournament's outcome, not this squad's. See CONTEXT.md "Roster lock". */
const hasActiveEntry = tid => S.registrations.some(r => r.team === tid && r.status === "approved" && !tour(r.tour).champion);
const ROSTER_LOCK_MSG = "This squad has an approved tournament entry that hasn't finished — the roster is locked until it does.";
/* check-in gates the match: OF-03 stage 1 ends by opening it. One player from each
   side is the floor — a squad that turns up with nobody cannot play. */
const checkedInEnough = m => [m.a, m.b].every(tid => lineupOf(m, tid).some(p => m.checkedIn.includes(p)));
/* the whole list is through, so check-in has nothing left to ask. The trail, the
   console and the referee's queue all move on to the score rather than leaving a
   finished step sitting as the live one. */
const allCheckedIn = m => !!(m.a && m.b)
  && [m.a, m.b].every(tid => lineupOf(m, tid).every(p => m.checkedIn.includes(p)));
const dependentsPlayed = m => [nextOf(m), edgeTarget(m.loseTo)]
  .filter(Boolean).some(x => x.status !== "scheduled");

/* Actions a mis-click should not cost you. The snapshot is the whole state, which
   is only affordable because it is a prototype — a real build would record the
   inverse operation instead.
   ponytail: whole-state snapshot, one level deep. Swap for an inverse-op log if
   the state ever gets big enough for the copy to show. */
const UNDOABLE = {
  kick: "Player removed", disband: "Squad disbanded", uninvite: "Invitation cancelled",
  withdraw: "Registration withdrawn", delcomment: "Comment removed", reject: "Squad rejected",
  uncheck: "Player marked ineligible", wdapprove: "Withdrawal allowed", decline: "Invitation declined",
};
let undoSnap = null;
function offerUndo(){
  if (!undoSnap) return toast("Nothing to undo", "warn");
  S = JSON.parse(undoSnap.state); undoSnap = null;
  save(); render(); toast("Put back", "warn");
}

/* Seal each handler behind its own rule at definition time. Checking only inside
   the click dispatcher would leave A.approve(...) callable straight from the
   console — which is exactly how the first audit walked through every role. Now
   the rule travels with the function, so there is no unguarded door. */
Object.keys(A).forEach(name => {
  const rule = PERM[name];
  if (!rule) return;
  const raw = A[name];
  A[name] = function(el){
    const arg = el || { dataset: {} };
    let verdict;
    try { verdict = rule(arg); } catch (e) { verdict = "That isn't available right now."; }
    if (verdict !== true){
      const why = typeof verdict === "string" ? verdict : "Not allowed.";
      toast(why, "crit");
      return { ok: false, why };
    }
    const label = UNDOABLE[name];
    if (label) undoSnap = { state: JSON.stringify(S), label };
    raw(arg);
    if (label && undoSnap) toast(`${label} — <button class="btn ghost" data-act="undo" style="padding:4px 10px;min-height:0">Undo</button>`, "warn", true);
    return { ok: true };
  };
});

/* One entry point for the dispatcher and the tests alike. */
/* which action is being dispatched right now, so ask() can park it for replay
   without the call site having to name itself a second time. */
let running = null;
function run(name, el = { dataset: {} }){
  const fn = A[name];
  if (!fn) return { ok: false, why: "No such action." };
  running = name;
  const out = fn(el);
  return out && out.ok === false ? out : { ok: true };
}

/* ───────── wiring ───────── */
document.addEventListener("click", e => {
  const stop = e.target.closest("[data-stop]");
  const el = e.target.closest("[data-act]");
  if (!el){ return; }
  if (el.dataset.act === "recheck") return;   /* the change listener below owns this — preventDefault here would revert a checkbox's own toggle */
  if (el.dataset.act === "closemodal" && stop && el !== stop) return;
  if (!A[el.dataset.act]) return;
  e.preventDefault();
  run(el.dataset.act, el);
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-act]");
  if (el && el.dataset.act === "recheck") A.recheck(el);
});
/* the home filter, kept out of the URL: it is a view preference, not a place */
let homeQuery = "";
/* "" hides finished by default — a champion is already decided, so it is the
   one state nobody needs staring back at them every visit. "open"/"competing"/
   "finished" narrow to exactly that lifecycle stage instead. */
let homeStatus = "";
/* The whole "Request a tournament" form is filled in one popup per group rather
   than one long inline form — each group's inputs exist only while its own
   modal is open, so the chosen values have to live here between popups
   instead of being re-read from a DOM that no longer has them. */
const REQ_RULES_DEFAULT = () => ({ gender:"any", ageMin:"any", ageMax:"any", faculty:"any", major:"any", year:"any",
  regOpens:"", regCloses:"", tourStart:"", tourEnd:"" });
const REQ_INFO_DEFAULT = () => ({ name:"", sport:"Basketball", format:"single",
  date:"2026-03-14", venue:"Main Stadium", pin:"", cap:"8", chan:"onsite" });
let reqRules = REQ_RULES_DEFAULT();
let reqInfo = REQ_INFO_DEFAULT();

/* Filter the referee candidates in place. render() would rebuild the input and
   drop the caret mid-word, so the DOM is touched directly instead. */
document.addEventListener("input", e => {
  const box = e.target.closest('[data-act="reffind"], [data-act="ivfind"]');
  if (!box) return;
  const invite = box.dataset.act === "ivfind";
  const q = box.value.trim().toLowerCase();
  const wrap = document.getElementById(invite ? "iv-cands" : "ref-cands");
  const hint = document.getElementById(invite ? "iv-hint" : "ref-hint");
  let shown = 0;
  document.querySelectorAll(`#${invite ? "iv" : "ref"}-cands tr[data-name]`).forEach(row => {
    const hit = !!q && row.dataset.name.includes(q) && shown < 8;
    if (hit) shown++;
    row.style.display = hit ? "" : "none";
  });
  if (wrap) wrap.style.display = shown ? "" : "none";
  if (hint) hint.textContent = !q
    ? (invite ? "Type a name to find somebody. They must accept before they join."
              : "Any student on the roll can officiate — there is no referee role to grant first.")
    : shown ? `${shown} shown — ${invite ? "an invitation counts once they accept" : "invite one and it counts once they accept"}.`
    : "Nobody by that name.";
});
let homeTimer;
document.addEventListener("input", e => {
  const box = e.target.closest('[data-act="homefind"]');
  if (!box) return;
  clearTimeout(homeTimer);
  const v = box.value;
  homeTimer = setTimeout(() => { homeQuery = v; render();
    const again = document.getElementById("home-find");
    if (again){ again.focus(); again.setSelectionRange(v.length, v.length); } }, 220);
});
let searchTimer;
document.addEventListener("input", e => {
  const el = e.target.closest('[data-act="search"]');
  if (!el) return;
  clearTimeout(searchTimer);
  const v = el.value;
  searchTimer = setTimeout(() => { location.hash = v ? "#/search/" + encodeURIComponent(v) : "#/search"; }, 220);
});
addEventListener("hashchange", render);
/* The palette needs a way in and the sheet needs a key. Recognition over recall
   (Nielsen #6): Ctrl+K to jump, ? to see every shortcut there is. */
let paletteOpen = false;
function renderPalette(q){
  const items = paletteItems(q || "");
  modal(`<div class="vstack">
    <div class="field"><label for="pal-q">Go to</label>
      <input id="pal-q" data-act="palfind" autocomplete="off" placeholder="A page, a tournament, a squad…" value="${esc(q || "")}"></div>
    <div class="vstack" style="gap:0;max-height:44vh;overflow:auto">
      ${items.length ? items.map(i => `<button class="workrow" data-act="palettego" data-h="${i.href}">
          <span class="wk"></span>
          <span class="txt"><b>${esc(i.label)}</b><span class="sub">${esc(i.hint)}</span></span>
          ${ic("chev",13)}</button>`).join("")
        : ``}
    </div>
    
  </div>`);
  const box = document.getElementById("pal-q");
  if (box) box.focus();
}
document.addEventListener("input", e => {
  const box = e.target.closest('[data-act="palfind"]');
  if (box) renderPalette(box.value);
});
addEventListener("keydown", e => {
  if (e.key === "Escape"){ paletteOpen = false; closeModal(); return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || "");
  if ((e.ctrlKey || e.metaKey) && (e.key === "k" || e.key === "K")){
    e.preventDefault(); paletteOpen = true; renderPalette(""); return;
  }
  if (e.key === "?" && !typing){ e.preventDefault(); modal(shortcutSheet()); }
});

load();
if (!S.session) location.hash = "#/login";
render();
</script>
