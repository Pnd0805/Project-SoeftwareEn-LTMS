<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LTMS — Prototype</title>
<style>
:root{
  /* Retone pass — same family (near-black ground, one glowing green, ruby-fill
     red, gold amber), pushed deeper and richer: less street poster, more
     jewel-box velvet. Void goes from blue-black to aubergine-black; the
     Silver Tree mint deepens to a saturated emerald/jade; Spray Red deepens
     from coral to ruby; the amber goes from bright marigold to antique gold.
     Construction is untouched — everything still cuts with --ink and a
     hard, blur-free shadow. v1 token names are kept so all 3000 lines of
     script-rendered markup work untouched; only the paint changes. */
  --void:#14121C; --void-2:#1A1726;
  --panel:#1E1B2A; --panel-2:#262234; --panel-3:#302B41;
  /* the raised/hover surface — still carries --bone at 4.5:1 */
  --panel-4:#3D3653;
  /* --line-hot draws every input and focusable boundary, so it clears 3:1 on the
     surfaces it outlines (WCAG 1.4.11). --hairline never carries text. */
  --line:#362F49; --line-hot:#7C6F94; --hairline:#948699;
  --bone:#E5DCC8; --bone-dim:#C7BBA0; --bone-faint:#AA9C83;
  /* the ruby red is a fill only. --red-text is the same hue lifted until it clears
     4.5:1 on --panel-3, the lightest surface red text ever lands on. */
  --red:#EA4658; --red-text:#FF6E80;
  --red-ghost:#2A0F16; --red-lift:#FF5A70; --red-lift-2:#FF7A8C;
  --red-press:#C22E42; --red-ghost-2:#3A1620;
  --teal:#3AAE7C; --teal-ghost:#0F2A1E;                /* Silver Tree, deepened to jewel emerald */
  --amber:#D9A430; --amber-ghost:#2E2410;
  /* graphics only — neither clears 4.5:1 on the raised surfaces, so neither may
     carry text. They fill bands, flags and stripes. */
  --azurite:#3D6B54; --crystal:#2C4A3D;
  --ink:#0A0810;                                        /* the outline every sticker is cut with */
  /* a scanner needs real contrast, not a theme match — these two are never in
     LIGHT_THEME, so the check-in QR stays a light chip with dark modules in
     both themes instead of vanishing when --bone/--ink flip for light mode. */
  --qr-bg:#E5DCC8; --qr-ink:#0A0810;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  /* 4px grid. Every padding and gap below snaps to one of these. */
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:20px;
  --s-6:24px; --s-8:32px; --s-10:40px; --s-12:48px;
  --r:2px; --r-lg:3px;
  --lift:0 14px 30px -16px rgba(0,0,0,.9);
  --sheen:inset 0 1px 0 rgba(255,255,255,.05);
  --hard:4px 4px 0 var(--ink);
  --hard-sm:2px 2px 0 var(--ink);
  --f-mono:ui-monospace,"SF Mono","SFMono-Regular","Cascadia Mono",Consolas,Menlo,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;min-height:100%;}
body{background:var(--void);color:var(--bone);font-family:var(--f-ui);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
h1,h2,h3{margin:0;}
button{font-family:inherit;cursor:pointer;}
a{color:var(--teal);text-decoration-thickness:2px;text-underline-offset:3px;}
::selection{background:var(--teal);color:var(--ink);}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;}

/* the aurora is two still washes over the velvet — no animation loop, nothing to
   repaint, and nothing above the app to swallow a click */
body{background:
  radial-gradient(90% 55% at 12% -8%, rgba(58,174,124,.14) 0%, transparent 62%),
  radial-gradient(80% 50% at 88% -4%, rgba(61,107,84,.20) 0%, transparent 58%),
  var(--void);
  background-attachment:fixed;}
#app{position:relative;z-index:2;}

.disp{font-family:var(--f-display);font-weight:700;font-stretch:87.5%;text-transform:uppercase;letter-spacing:.01em;line-height:1;padding-right:.02em;}
.tag{font-family:var(--f-mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--bone-faint);}
.tag em{font-style:normal;color:var(--teal);}
.sub{color:var(--bone-dim);font-size:15px;line-height:1.6;}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;}
.hint{font-size:15px;line-height:1.6;color:var(--bone-dim);}
.h-sec{font-family:var(--f-display);font-weight:700;font-stretch:87.5%;font-size:24px;letter-spacing:.01em;text-transform:uppercase;}
/* the section heading gets a marker stroke under it, like a tag underlined twice */
.h-sec::after{content:"";display:block;width:48px;height:4px;margin-top:4px;background:var(--teal);}
.hstack{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.vstack{display:flex;flex-direction:column;gap:12px;}
.spread{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;}
.mt{margin-top:16px;}

/* a button is a cut-out: hard outline, hard shadow, and it physically moves when
   pressed — the shadow collapses under it */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 16px;min-height:36px;
  font-family:var(--f-display);font-size:15px;font-weight:700;font-stretch:87.5%;letter-spacing:.04em;text-transform:uppercase;
  background:var(--panel-3);color:var(--bone);border:2px solid var(--ink);
  border-radius:var(--r);box-shadow:var(--hard-sm);
  transition:background .12s ease,transform .08s ease,box-shadow .08s ease;}
.btn:hover{background:var(--panel-4);}
.btn:active{transform:translate(2px,2px);box-shadow:none;}
.btn.primary{background:var(--teal);color:var(--ink);}
.btn.primary:hover{background:var(--bone);}
.btn.ghost{background:transparent;color:var(--bone-dim);border-color:transparent;box-shadow:none;}
.btn.ghost:hover{background:var(--panel-2);color:var(--bone);}
.btn.danger{background:var(--red);color:var(--ink);}
.btn.danger:hover{background:var(--red-lift);}
.btn[disabled]{opacity:.5;cursor:not-allowed;}
.btn svg{width:15px;height:15px;}

/* Apple-style filter chip — flat, fully rounded, no ink outline or hard
   shadow. Scoped to .pill only: the sticker-cut button stays the system
   default everywhere else, this is one filter row's own idiom. Named
   exception to the 3px radius cap and the no-blur rule — see DESIGN.md. */
.pill{border-radius:999px;border:2px solid transparent;box-shadow:none;
  font-family:var(--f-ui);font-size:15px;font-weight:600;letter-spacing:0;text-transform:none;
  padding:12px 16px;min-height:44px;}
.pill:active{transform:scale(.96);box-shadow:none;}
.pill.ghost{background:var(--panel-3);color:var(--bone-dim);}
.pill.ghost:hover{background:var(--panel-4);color:var(--bone);}
.pill.primary{background:var(--teal);color:var(--ink);}
.pill.primary:hover{background:var(--bone);}

/* Apple segmented control — one grey track, a floating capsule for the
   current segment, no per-segment borders. Same named exception as .pill. */
.segmented{display:inline-flex;background:var(--panel-3);border-radius:999px;padding:4px;gap:2px;}
.segmented button{border:0;background:transparent;border-radius:999px;box-shadow:none;
  padding:12px 16px;min-height:40px;font-family:var(--f-ui);font-size:15px;font-weight:600;
  color:var(--bone-dim);cursor:pointer;transition:background .15s ease,color .15s ease;}
.segmented button:hover{color:var(--bone);}
.segmented button.on{background:var(--panel);color:var(--bone);box-shadow:var(--hard-sm);}
.segmented button.on:hover{background:var(--panel);}
.segmented button:active{transform:scale(.96);}

/* stickers: slapped on slightly crooked, cut with the same ink outline */
.badge{display:inline-flex;align-items:center;gap:6px;padding:1px 8px;border-radius:var(--r);
  font-family:var(--f-mono);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  border:2px solid var(--ink);white-space:nowrap;transform:rotate(-1deg);}
.badge.ok{color:var(--ink);background:var(--teal);}
.badge.warn{color:var(--ink);background:var(--amber);}
.badge.crit{color:var(--ink);background:var(--red);}
.badge.neutral{color:var(--bone);background:var(--panel-3);}
.live{display:inline-flex;align-items:center;gap:6px;padding:1px 8px;background:var(--red);color:var(--ink);
  border:2px solid var(--ink);font-family:var(--f-mono);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  transform:rotate(-1.5deg);box-shadow:var(--hard-sm);}
.live i{width:6px;height:6px;border-radius:50%;background:var(--ink);animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* a panel is a pasted-up poster: ink outline, hard shadow, and a strip of tape
   across the top-left corner */
.panel{position:relative;padding:16px;border-radius:var(--r-lg);
  background:var(--panel);border:2px solid var(--ink);box-shadow:var(--hard);}
.panel::before{content:"";position:absolute;top:-6px;left:16px;width:48px;height:12px;
  background:var(--teal);opacity:.85;transform:rotate(-2deg);pointer-events:none;}
.panel.quiet{background:var(--void-2);box-shadow:var(--hard-sm);}
.panel.quiet::before{background:var(--crystal);width:32px;}

.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--bone-faint);}
input,select,textarea{background:var(--void-2);padding:8px 12px;font-size:16px;color:var(--bone);
  font-family:inherit;border:2px solid var(--line-hot);width:100%;border-radius:var(--r);}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--teal);box-shadow:var(--hard-sm);}
.field.bad input,.field.bad select{border-color:var(--red);}
.err{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--red-text);}

.tblwrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:15px;}
th{text-align:left;padding:8px 16px;font-family:var(--f-mono);font-size:13px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink);background:var(--teal);white-space:nowrap;}
td{padding:12px 16px;border-bottom:2px solid var(--line);vertical-align:middle;}
tr:hover td{background:var(--panel-2);}

.avatar{width:24px;height:24px;flex:none;display:grid;place-items:center;background:var(--teal);color:var(--ink);
  border:2px solid var(--ink);font-family:var(--f-mono);font-size:12px;font-weight:700;}
.tchip{display:inline-flex;align-items:center;gap:8px;}
button.tchip.link{background:none;border:0;padding:2px 0;color:var(--bone);font:inherit;text-align:left;
  border-bottom:2px solid transparent;transition:color .12s ease,border-color .12s ease;}
button.tchip.link:hover{color:var(--teal);border-bottom-color:var(--teal);}
button.sb-name{background:none;border:0;padding:0;color:inherit;font:inherit;text-align:inherit;cursor:pointer;}
button.sb-name:hover .sb-abbr{color:var(--teal);}
.sb-side.away button.sb-name{align-items:flex-end;}
.tchip i{width:16px;height:16px;border-radius:4px;flex:none;}
.jersey{display:inline-grid;place-items:center;width:24px;height:24px;flex:none;background:var(--panel-3);color:var(--bone);
  border:2px solid var(--ink);font-family:var(--f-mono);font-size:12px;font-weight:700;}
.form-guide{display:inline-flex;gap:4px;}
.form-guide span{width:20px;height:20px;display:grid;place-items:center;border:2px solid var(--ink);
  font-family:var(--f-mono);font-size:12px;font-weight:700;color:var(--ink);}
.form-guide .W{background:var(--teal);} .form-guide .L{background:var(--red);}

.tabs{display:flex;gap:24px;border-bottom:2px solid var(--line);flex-wrap:wrap;}
.tab{padding:12px 0;font-family:var(--f-display);font-size:15px;font-weight:700;font-stretch:87.5%;letter-spacing:.04em;
  text-transform:uppercase;color:var(--bone-faint);background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;}
.tab:hover{color:var(--bone-dim);}
.tab.on{color:var(--bone);border-bottom-color:var(--teal);}

.banner{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;font-size:15px;line-height:1.6;
  border:2px solid var(--ink);border-left-width:6px;border-radius:var(--r);box-shadow:var(--hard-sm);}
.banner.warn{background:var(--amber-ghost);border-left-color:var(--amber);}
.banner.crit{background:var(--red-ghost);border-left-color:var(--red);}
.banner.ok{background:var(--teal-ghost);border-left-color:var(--teal);}
.banner svg{flex:none;margin-top:1px;}
.banner .grow{flex:1;}

/* the registration modal's pass/fail banner is the only feedback that a ticked
   checkbox changed anything — it used to just teleport between ok/crit. Scoped
   to #rg-check alone: filterReport() is also read-only elsewhere (squad review),
   and a banner that never changes state doesn't need to announce arriving. */
@keyframes rg-check-settle{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes rg-check-fade{from{opacity:0}to{opacity:1}}
#rg-check .banner{animation:rg-check-settle .2s cubic-bezier(.16,1,.3,1);}
@media (prefers-reduced-motion: reduce){ #rg-check .banner{animation:rg-check-fade .15s linear;} }

.scorebug{display:grid;grid-template-columns:1fr auto 1fr;background:var(--void-2);
  border:2px solid var(--ink);box-shadow:var(--hard);}
.sb-side{display:flex;align-items:center;gap:12px;padding:12px 16px;min-width:0;}
.sb-side.away{flex-direction:row-reverse;}
.sb-flag{width:6px;align-self:stretch;flex:none;}
.sb-name{display:flex;flex-direction:column;gap:2px;min-width:0;}
.sb-side.away .sb-name{align-items:flex-end;}
.sb-abbr{font-family:var(--f-display);font-weight:700;font-stretch:87.5%;font-size:26px;letter-spacing:.02em;line-height:1;text-transform:uppercase;}
.sb-full{font-size:13px;color:var(--bone-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-score{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:.94;font-variant-numeric:tabular-nums;margin-left:auto;}
.sb-side.away .sb-score{margin-left:0;margin-right:auto;}
.sb-score.lost{color:var(--bone-faint);}
.sb-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px 20px;
  background:var(--panel);border-left:2px solid var(--ink);border-right:2px solid var(--ink);min-width:104px;}
.sb-clock{font-family:var(--f-mono);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--teal);}

.sportcard{background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:12px;
  border:2px solid var(--ink);border-radius:var(--r);box-shadow:var(--hard-sm);}
.sportcard .statline{background:var(--ink);}
.sportcard .statline>div{background:var(--panel-2);}
.statline{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px;background:var(--ink);
  border:2px solid var(--ink);}
.statline>div{background:var(--panel);padding:12px 16px;display:flex;flex-direction:column;gap:4px;}
.statline .v{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--teal);}

.bracket{position:relative;display:flex;gap:48px;padding:24px 4px;align-items:stretch;}
svg.bconn{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;}
svg.bconn path{fill:none;stroke:var(--azurite);stroke-width:2;}
.bcol{display:flex;flex-direction:column;gap:16px;justify-content:space-around;min-width:210px;}
.bnode{background:var(--panel);border:2px solid var(--ink);box-shadow:var(--hard-sm);
  text-align:left;width:100%;padding:0;border-radius:var(--r);}
.bnode:hover{background:var(--panel-2);}
.bnode.act{box-shadow:var(--hard-sm),inset 0 0 0 2px var(--teal);}
.bhead{display:flex;justify-content:space-between;align-items:center;padding:2px 8px;
  font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink);background:var(--azurite);}
.brow{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:15px;color:var(--bone);}
.brow+.brow{border-top:2px solid var(--line);}
.brow i{width:4px;height:16px;flex:none;}
.brow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.brow.win{font-weight:700;} .brow.win .sc{color:var(--teal);}
.brow.lose{color:var(--bone-faint);}
.brow .sc{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:700;}

/* the winner's advance: every render() is wrapped in a view transition, but
   only a scorebug side and its matching bracket row ever share a name — the
   root snapshot is silenced so every other render stays exactly as instant as
   before this existed. */
::view-transition-group(*){animation-duration:.5s;animation-timing-function:cubic-bezier(0,0,.2,1);}
::view-transition-group(root){animation-duration:0s;}
@media (prefers-reduced-motion: reduce){ ::view-transition-group(*){animation-duration:0s;} }

.rounds{display:flex;gap:2px;background:var(--ink);flex-wrap:wrap;border:2px solid var(--ink);}
.rounds .r{flex:1;min-width:104px;background:var(--panel);padding:8px 12px;display:flex;flex-direction:column;gap:4px;
  font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--bone-faint);border:0;text-align:left;}
.rounds .r b{font-family:var(--f-display);font-weight:700;font-stretch:87.5%;font-size:16px;letter-spacing:.02em;color:var(--bone-dim);}
.rounds .r.on{background:var(--teal-ghost);color:var(--bone);} .rounds .r.on b{color:var(--teal);}
.rounds .r.done b{color:var(--bone);}

/* shell */
.shell{position:relative;z-index:2;display:grid;grid-template-columns:214px 1fr;min-height:100vh;}
.shell.guest{grid-template-columns:1fr;}
.sb{background:var(--panel);border-right:2px solid var(--ink);padding:16px 0;display:flex;flex-direction:column;
  position:sticky;top:0;max-height:100vh;overflow-y:auto;}
.sb .brand{display:flex;align-items:center;gap:8px;padding:0 16px 16px;border-bottom:2px solid var(--ink);margin-bottom:8px;}
.sb .brand .g{width:24px;height:24px;background:var(--teal);border:2px solid var(--ink);display:grid;place-items:center;transform:rotate(-3deg);}
.sb .brand span{font-family:var(--f-display);font-weight:700;font-stretch:87.5%;font-size:21px;letter-spacing:.03em;text-transform:uppercase;}
.sb .item{display:flex;align-items:center;gap:12px;padding:8px 16px;font-family:var(--f-display);font-size:15px;font-weight:700;
  font-stretch:87.5%;letter-spacing:.04em;text-transform:uppercase;color:var(--bone-faint);
  background:none;border:0;border-left:4px solid transparent;width:100%;text-align:left;}
.sb .item:hover{color:var(--bone);background:var(--panel-2);}
.sb .item svg{width:16px;height:16px;flex:none;}
.sb .item.on{color:var(--ink);background:var(--teal);border-left-color:var(--ink);}
.sb .item.on svg{color:var(--ink);}
.sb .item .pill{margin-left:auto;background:var(--red);color:var(--ink);border:2px solid var(--ink);
  font-family:var(--f-mono);font-size:12px;font-weight:700;padding:0 4px;line-height:1.35;}
.sb .foot{margin-top:auto;padding:16px 16px 0;border-top:2px solid var(--ink);}

.tb{border-bottom:2px solid var(--ink);position:sticky;top:0;background:var(--panel);z-index:4;}
/* the bar bleeds the full column so its edge reads as an edge, but its contents
   carry the same measure and padding as .main — otherwise the avatar sits against
   the window while the content it belongs to stops 500px short of it. */
.tb .tbin{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 24px;max-width:1180px;}
.tb .search{width:min(300px,42vw);}
.tb .right{display:flex;align-items:center;gap:16px;}
/* Fitts (1954) and WCAG 2.2 SC 2.5.8: a 16px glyph is not a target. The icon
   stays the same size; the hit area around it does not. */
.bell{position:relative;background:none;border:0;color:var(--bone-dim);padding:12px;
  min-width:40px;min-height:40px;display:grid;place-items:center;border-radius:var(--r);}
.bell:hover{background:var(--panel-2);color:var(--teal);}
.theme-toggle{position:relative;background:none;border:0;color:var(--bone-dim);padding:12px;
  min-width:40px;min-height:40px;display:grid;place-items:center;border-radius:var(--r);}
.theme-toggle:hover{background:var(--panel-2);color:var(--teal);}
.theme-toggle svg{transition:transform .25s ease,opacity .2s ease;}
@media (prefers-reduced-motion:reduce){.theme-toggle svg{transition:none;}}
.bell i{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;background:var(--red);color:var(--ink);
  border:2px solid var(--ink);font-family:var(--f-mono);font-size:12px;font-style:normal;display:grid;place-items:center;padding:0 4px;}
.main{padding:24px 24px 48px;display:flex;flex-direction:column;gap:16px;max-width:1180px;}
.crumb{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;}
.crumb button{background:none;border:0;color:var(--teal);font-weight:700;font-family:inherit;font-size:inherit;letter-spacing:inherit;text-transform:inherit;padding:0;}

.topnav{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:var(--panel);
  border-bottom:2px solid var(--ink);flex-wrap:wrap;gap:12px;}
.topnav .links{display:flex;align-items:center;gap:24px;font-family:var(--f-display);font-size:15px;font-weight:700;
  font-stretch:87.5%;letter-spacing:.04em;text-transform:uppercase;}
.topnav .links button{background:none;border:0;color:var(--bone-dim);font:inherit;padding:0;}
.topnav .links button:hover{color:var(--teal);}

.auth{display:flex;justify-content:center;padding:48px 20px;}
.auth-card{width:min(430px,100%);display:flex;flex-direction:column;gap:16px;}
.who{display:flex;align-items:center;gap:12px;padding:12px;width:100%;text-align:left;color:var(--bone);
  background:var(--panel-2);border:2px solid var(--ink);border-radius:var(--r);box-shadow:var(--hard-sm);}
.who:hover{background:var(--panel-3);}
.who .meta{flex:1;min-width:0;}
.who .meta b{font-size:15px;display:block;}

.toast-stack{position:fixed;right:20px;bottom:20px;z-index:20;display:flex;flex-direction:column;gap:8px;width:min(350px,calc(100vw - 40px));}
.toast{display:flex;gap:12px;padding:12px 16px;border-radius:var(--r);background:var(--panel-2);
  border:2px solid var(--ink);border-left-width:6px;border-left-color:var(--teal);
  box-shadow:var(--hard);animation:slide .22s ease;}
.toast.crit{border-left-color:var(--red);} .toast.warn{border-left-color:var(--amber);}
.toast .body{flex:1;font-size:15px;line-height:1.6;}
@keyframes slide{from{transform:translateX(18px);opacity:0}to{transform:none;opacity:1}}

/* the one moment the whole system builds toward — a tournament reaching a
   champion — gets its own sticker, slapped onto the wall rather than filed
   in the toast stack. Decorative only: aria-hidden, pointer-events:none, and
   the toast underneath still carries the accessible announcement. */
.champstamp{position:fixed;top:88px;left:50%;z-index:25;width:min(340px,calc(100vw - 40px));
  padding:20px;text-align:center;background:var(--panel);border:2px solid var(--ink);border-radius:var(--r-lg);
  box-shadow:var(--hard);pointer-events:none;animation:stamp-down .4s cubic-bezier(.16,1,.3,1);}
.champstamp::before{content:"";position:absolute;top:-6px;left:50%;margin-left:-24px;width:48px;height:12px;
  background:var(--teal);opacity:.85;transform:rotate(-2deg);}
.champstamp .crest{width:56px;height:56px;margin:0 auto 10px;display:grid;place-items:center;
  background:var(--red);color:var(--ink);clip-path:polygon(0 0,100% 0,100% 72%,72% 100%,0 100%);}
.champstamp .team{display:block;font-size:26px;margin-top:2px;}
.champstamp .tourname{display:block;margin-top:4px;font-size:15px;color:var(--bone-dim);}
@keyframes stamp-down{from{transform:translateX(-50%) rotate(-9deg) scale(1.3);opacity:0}
  to{transform:translateX(-50%) rotate(-2deg) scale(1);opacity:1}}

.modal-bg{position:fixed;inset:0;z-index:30;background:rgba(12,13,20,.82);display:grid;place-items:center;padding:20px;}
.modal{width:min(560px,100%);max-height:86vh;overflow-y:auto;background:var(--panel);padding:24px;
  border:2px solid var(--ink);box-shadow:var(--hard),var(--lift);}

.notif{display:flex;gap:12px;padding:12px 0;border-bottom:2px solid var(--line);}
.notif .dot{width:6px;height:6px;flex:none;margin-top:6px;background:var(--teal);}
.notif .dot.read{background:transparent;box-shadow:inset 0 0 0 2px var(--hairline);}
.notif .txt{flex:1;font-size:15px;line-height:1.6;}

/* the result trail is a sequence, so it is drawn as one: a rail, a marker per
   step, and exactly one step lit as the thing being waited on */
.trail{display:flex;flex-direction:column;}
.trail .st{display:grid;grid-template-columns:24px 1fr;gap:16px;position:relative;padding-bottom:16px;}
.trail .st:last-child{padding-bottom:0;}
.trail .st::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line);}
.trail .st:last-child::before{display:none;}
.trail .st.done::before{background:var(--teal);opacity:.5;}
.trail .mk{width:24px;height:24px;display:grid;place-items:center;background:var(--panel-2);
  border:2px solid var(--ink);color:var(--bone-faint);font-family:var(--f-mono);font-size:13px;font-weight:700;}
.trail .st.done .mk{background:var(--teal);color:var(--ink);}
.trail .st.now .mk{background:var(--red);color:var(--ink);transform:rotate(-3deg);}
.trail .st.bad .mk{background:var(--amber);color:var(--ink);}
.trail .bd{display:flex;flex-direction:column;gap:4px;min-width:0;}
.trail .ttl{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.trail .st.idle .ttl{color:var(--bone-faint);font-weight:500;}
.trail .st.now .ttl{color:var(--bone);}

/* the tournament card's header band: aurora wash, hazard stripes, and the name
   sprayed across it. The band carries its own negative margin, so the card's
   padding, gap and children are untouched — nothing here can move a layout. */
.cap{display:block;height:70px;position:relative;overflow:hidden;
  margin:-16px -16px 2px;border-bottom:2px solid var(--ink);
  background:linear-gradient(118deg,var(--crystal) 0%,var(--panel) 78%);}
.cap::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(118deg,rgba(12,13,20,.28) 0 6px,transparent 6px 16px);}
.cap b{position:absolute;left:12px;right:12px;bottom:2px;font-family:var(--f-display);font-weight:700;font-stretch:87.5%;
  font-size:34px;line-height:1;color:var(--bone);opacity:.28;letter-spacing:.02em;
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:clip;}
.capsule.run .cap{background:linear-gradient(118deg,var(--azurite) 0%,var(--panel) 78%);}
.capsule.run .cap b{color:var(--bone);opacity:.42;}
.capsule.playing .cap{background:linear-gradient(118deg,var(--teal) 0%,var(--panel) 78%);}
.capsule.playing .cap b{color:var(--ink);opacity:.5;}
.capsule::before{display:none;}

/* the one motion a wall of stickers needs: the card lifts off the paste-up */
.capsule,.who{transition:transform .12s ease,box-shadow .12s ease;}
.capsule:hover,.who:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);}
.capsule:hover .cap b{opacity:.55;}

/* thin scrollbars — a document scrolls, an app slides */
*{scrollbar-width:thin;scrollbar-color:var(--line-hot) transparent;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line-hot);border:3px solid var(--void);}
::-webkit-scrollbar-thumb:hover{background:var(--teal);}

/* profile — a showcase page with the editor as a rail, not a form with stats bolted under it */
/* the page splits in two: the work on the left, the facts on the right. .profile
   was already this shape, so .split is the same rule under a name that says what
   it does — the rail keeps its place while the long side scrolls past it. */
.profile,.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:16px;align-items:start;}
.profile>div,.split>div{display:flex;flex-direction:column;gap:16px;min-width:0;}
.split>.rail{position:sticky;top:72px;}
@media (max-width:900px){ .profile,.split{grid-template-columns:1fr;} .split>.rail{position:static;} }

/* the filter follows the page down. A grid of 23 tournaments is scrolled, and a
   filter you have to scroll back up to reach is a filter nobody uses twice. */
.toolbar{position:sticky;top:60px;z-index:3;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:8px 12px;background:var(--panel-2);border:2px solid var(--ink);box-shadow:var(--hard-sm);}
.toolbar .field{flex:1;min-width:200px;}
.toolbar .chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
/* the guest shell has no sticky top bar to clear */
.shell.guest .toolbar{top:0;}

/* a fact list: label left, value right, one rule between each. It replaces the
   single dense meta line that used to carry the date, venue and entry rules. */
.facts{display:flex;flex-direction:column;}
.facts>div{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:8px 0;
  border-bottom:2px solid var(--line);font-size:15px;}
.facts>div:last-child{border-bottom:0;}
.facts .k{font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--bone-faint);flex:none;}
.facts .f{text-align:right;min-width:0;overflow-wrap:anywhere;}

.phero{position:relative;overflow:hidden;background:var(--panel);padding:0;border:2px solid var(--ink);box-shadow:var(--hard);}
.phero .band{height:104px;position:relative;
  background:linear-gradient(115deg,var(--azurite) 0%,var(--crystal) 44%,var(--panel) 100%);}
.phero .band::after{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(115deg,rgba(12,13,20,.30) 0 8px,transparent 8px 20px);}
.phero .band .edge{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--teal);}
.phero .body{display:flex;align-items:flex-end;gap:16px;padding:0 24px 16px;margin-top:-32px;position:relative;flex-wrap:wrap;}
.phero .face{width:88px;height:88px;flex:none;display:grid;place-items:center;background:var(--teal);color:var(--ink);
  font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;
  border:2px solid var(--ink);box-shadow:var(--hard);transform:rotate(-2deg);}
/* .who is a button elsewhere; inside the hero it is a plain block, so the sticker
   chrome it would otherwise inherit is switched off here */
.phero .who{flex:1;min-width:200px;display:flex;flex-direction:column;gap:6px;padding-bottom:2px;
  background:none;border:0;box-shadow:none;}
.phero .who:hover{background:none;transform:none;box-shadow:none;}
.phero .lv{display:flex;align-items:center;gap:8px;padding-bottom:2px;}
.phero .lv b{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1;color:var(--teal);}
.phero .lv span{font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--bone-faint);}

.showcase{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:2px;background:var(--ink);
  border:2px solid var(--ink);}
.showcase>div{background:var(--panel-2);padding:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start;}
.showcase .v{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums;color:var(--teal);}

.skip{position:fixed;top:-100px;left:12px;z-index:40;padding:8px 16px;background:var(--teal);color:var(--ink);
  border:2px solid var(--ink);font-family:var(--f-display);font-size:15px;font-weight:700;letter-spacing:.04em;
  text-transform:uppercase;box-shadow:var(--hard-sm);transition:top .14s ease;}
.skip:focus{top:12px;}
.workrow{display:flex;align-items:center;gap:12px;padding:12px 2px;background:none;border:0;width:100%;
  text-align:left;color:var(--bone);border-bottom:2px solid var(--line);transition:background .12s ease;}
.workrow:last-child{border-bottom:0;}
.workrow:hover{background:var(--panel-2);}
.workrow .wk{width:6px;align-self:stretch;flex:none;background:var(--hairline);}
.workrow .wk.crit{background:var(--red);} .workrow .wk.warn{background:var(--amber);} .workrow .wk.ok{background:var(--teal);}
.workrow .txt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
.workrow .txt b{font-size:15px;}
.qr{background:var(--qr-bg);padding:8px;display:inline-block;line-height:0;border:2px solid var(--ink);}
.qr svg{fill:var(--qr-ink);}
/* an empty state is still a pasted-up poster, not a framework default —
   same ink outline, hard shadow and tape strip every panel carries */
.empty{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;
  padding:48px 20px;color:var(--bone-dim);background:var(--panel);border:2px solid var(--ink);
  border-radius:var(--r-lg);box-shadow:var(--hard);}
.empty::before{content:"";position:absolute;top:-6px;left:50%;margin-left:-24px;width:48px;height:12px;
  background:var(--teal);opacity:.85;transform:rotate(-2deg);pointer-events:none;}

@media (max-width:820px){
  .shell{grid-template-columns:1fr;}
  .sb{position:static;max-height:none;flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px;}
  .sb .brand{border:0;margin:0;padding:0 8px;}
  .sb .item{width:auto;border-left:0;border-bottom:4px solid transparent;padding:8px 12px;}
  .sb .item.on{border-left:0;border-bottom-color:var(--ink);}
  .sb .foot{margin:0;border:0;padding:0 8px;}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

<body>
<div id="app"></div>
<div class="toast-stack" id="toasts" role="status" aria-live="polite"></div>
<div id="modal"></div>
<div id="champstamp"></div>

<script>
"use strict";
/* Apple-style light appearance — same token names, repainted onto the root
   element's inline style so the base :root{} stylesheet (and its raw-hex
   audit) stays dark-only; every rule elsewhere already reads a --var, so
   this is the entire theme swap. */
/* Warm-ivory/espresso/jewel-tone retone — the same sticker-cut construction
   (--ink outline, hard shadow) reads as gilt-edged rather than street when the
   ground goes from near-black to cream. Fill colors sit at the one lightness
   band that keeps --ink legible on top of them (badges, primary buttons); that
   band is too dark to also clear 4.5:1 as body text, so red carries a separate
   --red-text the way the base theme already does — teal and amber accept the
   same 3:1 "large/bold" floor the base theme's graphics-only tokens accept,
   since every place they sit under --ink is bold uppercase, never running text. */
const LIGHT_THEME = {
  void:"#F8F4EC", "void-2":"#F1E9D8",
  panel:"#FFFFFF", "panel-2":"#F8F4EC", "panel-3":"#F0E6D0", "panel-4":"#E4D4B0",
  line:"#E6D9BE", "line-hot":"#8F7A4C", hairline:"#6E5D3E",
  bone:"#2A2117", "bone-dim":"#5A4E36", "bone-faint":"#6E5F42",
  red:"#C23B57", "red-text":"#8A1C38",
  "red-ghost":"#F8E5EA", "red-lift":"#D45571", "red-lift-2":"#DE6B85",
  "red-press":"#A32E47", "red-ghost-2":"#F2D2DA",
  teal:"#12764E", "teal-ghost":"#E1EFE6",
  amber:"#806124", "amber-ghost":"#FAF1DC",
  azurite:"#6B8F73", crystal:"#C7B78D",
  ink:"#1E170F",
};
function applyTheme(light){
  const el = document.documentElement; if (!el) return;
  Object.entries(LIGHT_THEME).forEach(([k, v]) => el.style.setProperty("--" + k, light ? v : ""));
  el.setAttribute("data-theme", light ? "light" : "dark");
}
try{
  const _t = localStorage.getItem("ltms-theme");
  applyTheme(_t === "light" || (!_t && matchMedia("(prefers-color-scheme: light)").matches));
}catch(e){}
/* ══════════════════════════════════════════════════════════════
   LTMS PROTOTYPE — single file, no build, no network.
   State lives in localStorage; every action mutates it and
   re-renders. Open the file, pick a role, use the app.
   ══════════════════════════════════════════════════════════════ */

/* ───────── icons ───────── */
const I = {
  home:'<path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1V10.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>',
  trophy:'<path d="M6 3h12v4a6 6 0 0 1-12 0V3Z" stroke="currentColor" stroke-width="1.7"/><path d="M6 5H3v2a4 4 0 0 0 4 4M18 5h3v2a4 4 0 0 1-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M12 13v4M9 21h6M10 17h4v4h-4v-4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>',
  team:'<circle cx="9" cy="8" r="3" stroke="currentColor" stroke-width="1.7"/><circle cx="17" cy="9" r="2.4" stroke="currentColor" stroke-width="1.7"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="1.7"/><path d="M15.5 14.2c2.4.4 4.5 2.4 4.5 5.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>',
  match:'<path d="M4 6h7l-2 6 2 6H4V6ZM20 6h-7l2 6-2 6h7V6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>',
  user:'<circle cx="12" cy="8" r="3.2" stroke="currentColor" stroke-width="1.7"/><path d="M5 20c0-3.6 3.1-6.5 7-6.5s7 2.9 7 6.5" stroke="currentColor" stroke-width="1.7"/>',
  bell:'<path d="M6 10a6 6 0 1 1 12 0c0 4 1.5 5 1.5 5h-15S6 14 6 10Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M10 18a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.7"/>',
  search:'<circle cx="10.5" cy="10.5" r="6" stroke="currentColor" stroke-width="1.7"/><path d="m19 19-4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>',
  check:'<path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  plus:'<path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
  chev:'<path d="m8 5 8 7-8 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  chevL:'<path d="m16 5-8 7 8 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  warn:'<path d="M12 4 2.5 20h19L12 4Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 10v4M12 17h.01" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>',
  clock:'<circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/><path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>',
  star:'<path d="m12 3.6 2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.8l5.9-.8L12 3.6Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>',
  shield:'<path d="M12 3.5 5 6v6c0 4.2 3 7.4 7 8.5 4-1.1 7-4.3 7-8.5V6l-7-2.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>',
  cog:'<circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/><path d="M12 3v2.5M12 18.5V21M21 12h-2.5M5.5 12H3M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8M18.4 18.4l-1.8-1.8M7.4 7.4 5.6 5.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>',
  pin:'<path d="M12 21s7-6.5 7-11a7 7 0 1 0-14 0c0 4.5 7 11 7 11Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.4" stroke="currentColor" stroke-width="1.7"/>',
  out:'<path d="M14 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M10 8l-4 4 4 4M6 12h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>',
  sun:'<circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8 6 18M18 6l1.8-1.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>',
  moon:'<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>',
};
const ic = (n, s = 15) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" aria-hidden="true">${I[n] || ""}</svg>`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const isLight = () => !!(document.documentElement && document.documentElement.dataset.theme === "light");
const themeBtn = () => `<button class="theme-toggle" data-act="theme" aria-label="${isLight() ? "Switch to dark mode" : "Switch to light mode"}">${ic(isLight() ? "moon" : "sun", 17)}</button>`;

/* ───────── seed ───────── */
const SEED = () => {
  /* ══════════════════════════════════════════════════════════════
     A season that already happened.

     Deterministic — the same PRNG seed every load, so the demo is identical
     on every machine and bug reports are reproducible. Every invariant the app
     enforces at runtime is respected here too: rosters are globally disjoint so
     nobody is ever their own opponent, no confirmed match is a draw, statistics
     never exceed the score, and every bracket is seeded i-vs-(size-1-i) so no
     squad count deadlocks.

     Between them the tournaments below cover every state the SRS describes:
     pending approval, private, private-about-to-be-deleted, open for entry,
     mid-bracket with a live dispute, and finished with a champion and MVP votes
     — across six sports, on-site and online.
     ══════════════════════════════════════════════════════════════ */
  let _s = 20260209;
  const R = () => { _s = (_s * 1664525 + 1013904223) >>> 0; return _s / 4294967296; };
  const pick = a => a[Math.floor(R() * a.length)];
  const int = (lo, hi) => lo + Math.floor(R() * (hi - lo + 1));
  const shuffle = a => { const x = a.slice();
    for (let i = x.length - 1; i > 0; i--){ const j = Math.floor(R() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; } return x; };

  const DAY = 86400000, NOWMS = new Date("2026-02-08T12:00:00").getTime();
  const ago = d => NOWMS - d * DAY;

    matches.push(...made);
    const find = (r, s) => made.find(m => m.round === r && m.slot === s);
    const advance = m => { const w = m.sa === m.sb && m.decider ? (m.decider.a > m.decider.b ? m.a : m.b) : (m.sa > m.sb ? m.a : m.b);
      const nx = find(m.round + 1, m.slot >> 1);
      if (!nx){ tr.champion = w; return; }
      if (m.slot % 2 === 0) nx.a = w; else nx.b = w; };
    const [lo, hi] = SPORT_SCORE[tr.sport] || [0, 4];
    const settle = (m, state) => {
      if (!m.a || !m.b){                                  /* bye, or an empty slot */
        if (m.a || m.b){ m.sa = m.a ? 1 : 0; m.sb = m.b ? 1 : 0; m.status = "confirmed"; m.note = "bye"; advance(m); }
        else { m.status = "void"; m.note = "void"; }
        return;
      }
      let x = int(lo, hi), y = int(lo, hi);
      if (x === y) y = x > lo ? x - 1 : x + 1;            /* single elimination has no draws */
      m.sa = x; m.sb = y;
      [m.a, m.b].forEach(tid => teams.find(t => t.id === tid).members.forEach(p => m.checkedIn.push(p)));
      const L = { Chess: null }[tr.sport] === null ? null : true;
      if (tr.sport !== "Chess"){                          /* per-player stats, never exceeding the score */
        [[m.a, x], [m.b, y]].forEach(([tid, score]) => {
          const roster = shuffle(teams.find(t => t.id === tid).members).slice(0, 3);
          let left = score;
          roster.forEach((pid, k) => {
            const give = k === roster.length - 1 ? left : Math.min(left, int(0, Math.ceil(score / 2)));
            left -= give;
            if (give > 0 || R() > .6) m.stats[pid] = { goals: Math.max(0, give), assists: int(0, 2), team: tid };
          });
        });
      }
      m.enteredBy = tr.channel === "onsite" ? m.refs[0] : teams.find(t => t.id === (x > y ? m.a : m.b)).leader;
      if (state === "pending"){ m.status = "pending"; return; }
      if (state === "disputed"){ m.status = "disputed"; m.disputedTeam = (x > y ? m.b : m.a);
        m.disputedBy = teams.find(t => t.id === m.disputedTeam).leader; return; }
      m.status = "confirmed";
      m.confirmedBy = tr.channel === "onsite" ? teams.find(t => t.id === (x > y ? m.a : m.b)).leader : m.refs[0];
      advance(m);
    };
    const stopAt = opts.upToRound ?? rounds;              /* how far the season has got */
    for (let r = 0; r < rounds; r++)
      made.filter(m => m.round === r).forEach((m, i) => {
        if (!m.a && !m.b) return;                         /* waiting on an earlier round */
        if (!m.a || !m.b){ settle(m, "confirmed"); return; }   /* a bye resolves whenever it appears */
        if (r < stopAt) settle(m, "confirmed");
        else if (r === stopAt && opts.pendingSlots && opts.pendingSlots.includes(i)) settle(m, "pending");
        else if (r === stopAt && opts.disputedSlots && opts.disputedSlots.includes(i)) settle(m, "disputed");
        else {                                            /* still to be played — some players have arrived */
          [m.a, m.b].forEach(tid => { if (R() > .5)
            teams.find(t => t.id === tid).members.slice(0, 2).forEach(p => m.checkedIn.push(p)); });
        }

    return made;
