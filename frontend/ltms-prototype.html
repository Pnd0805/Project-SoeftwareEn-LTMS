/* Fields added after the first release still have to load old saved state. */
function migrate(){
  ["picks","votes","follows","refInvites","checkins","notifications","announcements","comments","feedback"]
    .forEach(k => { if (!Array.isArray(S[k])) S[k] = []; });
  S.teams.forEach(t => { if (t.disabled === undefined) t.disabled = false; if (t.permanent === undefined) t.permanent = false; });
  S.tournaments.forEach(t => { if (t.rules && !t.rules.major) t.rules.major = "any";
    /* Esports was one sport with one scoresheet; it is two games with two */
    if (t.sport === "Esports") t.sport = "VALORANT";
    if (!FORMATS[t.format]) t.format = "single"; });
  S.matches.forEach(m => { if (!m.stats) m.stats = {}; if (!m.checkedIn) m.checkedIn = [];
    if (!m.teamStats) m.teamStats = {}; if (!m.lineup) m.lineup = {};
    /* a dispute used to record only the person who raised it */
    if (m.disputedBy && !m.disputedTeam){
      const side = [m.a, m.b].find(x => team(x) && team(x).leader === m.disputedBy);
      if (side) m.disputedTeam = side;
    } });
  S.users.forEach(u => { if (!u.perms) u.perms = {}; });
}

/* ── lifecycle sweeps — the two automatic deletions the SRS specifies ──
   Run on every load. "Now" is pinned to the demo date so seeded data behaves
   the same on any machine, on any day. */
const NOW = () => new Date("2026-02-08T12:00:00").getTime();
function sweep(){
  const now = NOW(); let killed = 0, disabled = 0;
  /* a tournament still private on its match date is deleted (organizer flowchart) */
  S.tournaments.filter(t => t.status === "private").forEach(t => {
    if (new Date(t.date + "T23:59:59").getTime() < now){
      notify(t.organizer, `${t.name} was deleted automatically — it was still private on its match date.`, "#/");
      S.tournaments = S.tournaments.filter(x => x.id !== t.id);
      S.registrations = S.registrations.filter(r => r.tour !== t.id);
      S.matches = S.matches.filter(m => m.tour !== t.id);
      killed++;
    }
  });
  /* a squad that entered nothing within two weeks, or went six months idle, is
     disabled — unless an admin marked it permanent (OF-01) */
  const FORTNIGHT = 14 * 86400000, SIX_MONTHS = 182 * 86400000;
  S.teams.filter(t => !t.disabled && !t.permanent).forEach(t => {
    const entered = S.registrations.filter(r => r.team === t.id);
    const last = entered.length ? Math.max(...entered.map(r => r.at)) : null;
    const stale = last === null ? now - t.created > FORTNIGHT : now - last > SIX_MONTHS;
    if (stale){ t.disabled = true; t.disabledWhy = last === null
      ? "Entered no tournament within two weeks of being created."
      : "No activity for six months."; notify(t.leader, `${t.name} was disabled automatically. ${t.disabledWhy}`, "#/teams"); disabled++; }
  });
  if (killed || disabled) save();
  return { killed, disabled };
}

/* ───────── store ───────── */
const KEY = "ltms.prototype.v1";
let S;
function load(){
  try { const raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : SEED(); }
  catch { S = SEED(); }
  migrate(); sweep();
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
function reset(){ S = SEED(); save(); location.hash = "#/"; render(); toast("Demo data reset", "warn"); }
const uid = p => `${p}-${++S.seq}`;

/* ───────── lookups ───────── */
const me       = () => S.users.find(u => u.id === S.session) || null;
const signedIn = () => !!me();
const user     = id => S.users.find(u => u.id === id);
const team     = id => S.teams.find(t => t.id === id);
const tour     = id => S.tournaments.find(t => t.id === id);
const matchesOf= tid => S.matches.filter(m => m.tour === tid).sort((a,b)=>a.round-b.round||a.slot-b.slot);
const regsOf   = tid => S.registrations.filter(r => r.tour === tid);
const myTeams  = () => { const u = me(); return u ? S.teams.filter(t => t.members.includes(u.id)) : []; };
const ledTeams = () => { const u = me(); return u ? S.teams.filter(t => t.leader === u.id) : []; };
const isOrg    = t => me() && t.organizer === me().id;
/* One rule for "does this tournament exist, as far as you are concerned". A request
   under review is not a tournament yet and a private one is its organizer's draft —
   neither is browsable, searchable or enterable. The condition lived in three views
   separately, which is exactly how the search page came to list them. */
const visibleTo = t => t.status === "public" || (me() && (t.organizer === me().id || me().role === "Admin"));
const isRef    = t => me() && (t.referees || []).includes(me().id);
const unread   = () => me() ? S.notifications.filter(n => n.to === me().id && !n.read).length : 0;
const MAJORS = ["General","Computer Engineering","Physics","Finance","Design","Public Health"];
/* A squad names its sport when it is created, and the minimum size follows from
   it — a five-a-side side is not judged by an eleven-a-side rule. Squads made
   before the question was asked carry no sport and keep the old floor. */
const MIN_SQUAD = 3;
const SPORT_MIN = { Football: 7, Futsal: 5, Basketball: 5, Volleyball: 6,
                    Badminton: 2, VALORANT: 5, ROV: 5, Chess: 1 };
const minSquad = t => (t && t.sport && SPORT_MIN[t.sport]) || MIN_SQUAD;
/* Three ways to decide a champion. The format is chosen when the tournament is
   requested and fixed at the draw: it decides whether there is a Bracket or a
   Standings table, whether a match may end level, and how the leaderboard reads. */
const FORMATS = { single: "Single elimination", double: "Double elimination", roundrobin: "Round robin" };
const formatOf = t => (t && FORMATS[t.format]) ? t.format : "single";
/* On-site needs two officials, online one. Asked here rather than re-derived at
   each call site — a count that lives in nine places drifts in one of them. */
const refsNeeded = t => (t && t.channel === "onsite") ? 2 : 1;
const formatName = t => FORMATS[formatOf(t)];
const SPORTS = ["Football","Futsal","Basketball","Volleyball","Badminton","VALORANT","ROV","Chess"];
const teamReady = t => t.members.length >= minSquad(t);

/* ───────── sport-aware statistics ─────────
   A person competes in more than one sport, so a single career total is
   meaningless — six goals at football and six points at basketball are not
   twelve of anything. Everything below keys on the sport of the tournament the
   match belonged to, and labels the two recorded columns the way that sport
   names them. Chess records neither. */
/* Two levels of figure, and the sport decides both.
   `g` and `a` are the two columns every career table reads; `extra` is the rest of
   what that sport asks of a player. `team` is the short list of figures NO sum of
   players can produce — quarters, maps, deuces. Everything that IS a sum of its
   players (team goals, team cards, team kills) is derived where it is shown and
   never typed: a number enterable two ways is a disagreement waiting to happen. */
const SPORT_STATS = {
  Football:   { g: "Goals",  a: "Assists", unit: "goal",
                extra: [["yellow","Yellow"],["red","Red"]], team: [] },
  Futsal:     { g: "Goals",  a: "Assists", unit: "goal",
                extra: [["yellow","Yellow"],["red","Red"]], team: [] },
  Basketball: { g: "Points", a: "Assists", unit: "point", extra: [["reb","Rebounds"]],
                team: [["q1","Q1"],["q2","Q2"],["q3","Q3"],["q4","Q4"],["fouls","Fouls"]] },
  Volleyball: { g: "Points", a: "Blocks",  unit: "point", extra: [],
                team: [["setpts","Points per set","text"]] },
  Badminton:  { g: "Points", a: null,      unit: "point", extra: [],
                team: [["gamepts","Points per game","text"],["deuce","Deuces"],["rally","Rallies"]] },
  VALORANT:   { g: "Kills",  a: "Assists", unit: "kill",
                extra: [["deaths","Deaths"],["fk","First kills"],["plants","Plants"],["defuses","Defuses"]],
                team: [["mapsW","Maps won"],["mapsL","Maps lost"],["roundsW","Rounds won"],["roundsL","Rounds lost"]] },
  ROV:        { g: "Kills",  a: "Assists", unit: "kill",
                extra: [["deaths","Deaths"],["dmgOut","Damage dealt"],["dmgIn","Damage taken"]],
                team: [["gamesW","Games won"],["gamesL","Games lost"]] },
  Chess:      { g: null,     a: null,      unit: null, extra: [], team: [] },
};
const GENERIC_STATS = { g: "Scored", a: "Assists", unit: "point", extra: [], team: [] };
const statLabels = sport => SPORT_STATS[sport] || GENERIC_STATS;
const statExtra  = sport => statLabels(sport).extra || [];
const statTeam   = sport => statLabels(sport).team  || [];
/* the sums, worked out where they are shown */
function teamTotals(m, tid){
  const out = { goals: 0, assists: 0, x: {} };
  Object.values(m.stats || {}).filter(st => st.team === tid).forEach(st => {
    out.goals += st.goals || 0; out.assists += st.assists || 0;
    Object.entries(st.x || {}).forEach(([k, v]) => { out.x[k] = (out.x[k] || 0) + v; });
  });
  return out;
}
/* Who is playing this match. A Leader names a Lineup per match; until they do it
   is the Squad list they registered, and until that exists it is the whole Team.
   Nothing here can block a match from being played — paperwork never does. */
function lineupOf(m, tid){
  const tm = team(tid); if (!tm) return [];
  const named = (m.lineup || {})[tid];
  if (named && named.starters && named.starters.length) return [...named.starters, ...(named.subs || [])];
  const reg = S.registrations.find(r => r.tour === m.tour && r.team === tid && r.status === "approved");
  const squad = reg && reg.squad && reg.squad.length ? reg.squad.filter(id => tm.members.includes(id)) : null;
  return squad && squad.length ? squad : tm.members;
}
const startersOf = (m, tid) => { const named = (m.lineup || {})[tid];
  return named && named.starters && named.starters.length ? named.starters : lineupOf(m, tid); };

/* every confirmed match a player actually appeared in, grouped by sport */
function careerBySport(pid){
  const by = new Map();
  S.matches.filter(m => m.status === "confirmed" && m.note !== "bye").forEach(m => {
    const tr = tour(m.tour); if (!tr) return;
    const side = [m.a, m.b].find(tid => team(tid) && team(tid).members.includes(pid));
    if (!side) return;
    const row = by.get(tr.sport) || { sport: tr.sport, p: 0, w: 0, d: 0, g: 0, a: 0, form: [], tours: new Set(), teams: new Set() };
    const won = wonBy(m, side), level = isLevel(m);
    const st = (m.stats || {})[pid];
    row.p++; if (won) row.w++; if (level) row.d = (row.d || 0) + 1;
    row.g += st ? st.goals : 0; row.a += st ? st.assists : 0;
    row.form.push(level ? "D" : won ? "W" : "L");
    row.tours.add(tr.id); row.teams.add(side);
    by.set(tr.sport, row);
  });
  return [...by.values()].sort((x, y) => y.p - x.p);
}
/* the same split for a squad — a club can run sides in several sports */
function teamBySport(tid){
  const by = new Map();
  S.matches.filter(m => m.status === "confirmed" && m.note !== "bye" && (m.a === tid || m.b === tid)).forEach(m => {
    const tr = tour(m.tour); if (!tr) return;
    const row = by.get(tr.sport) || { sport: tr.sport, p: 0, w: 0, d: 0, gf: 0, ga: 0, form: [], tours: new Set() };
    const mine = m.a === tid ? m.sa : m.sb, theirs = m.a === tid ? m.sb : m.sa, level = isLevel(m);
    row.p++; if (wonBy(m, tid)) row.w++; if (level) row.d = (row.d || 0) + 1;
    row.gf += mine; row.ga += theirs;
    row.form.push(level ? "D" : wonBy(m, tid) ? "W" : "L");
    row.tours.add(tr.id);
    by.set(tr.sport, row);
  });
  return [...by.values()].sort((x, y) => y.p - x.p);
}
/* One row per tournament a player actually appeared in — keyed by tournament AND
   squad, because a player can enter the same competition once only, but enters
   several competitions with different squads across a season. Finish comes from
   the same leaderboard the tournament page shows, so the two can never disagree. */
function careerByTournament(pid){
  const by = new Map();
  S.matches.filter(m => m.status === "confirmed" && m.note !== "bye").forEach(m => {
    const tr = tour(m.tour); if (!tr) return;
    const side = [m.a, m.b].find(tid => team(tid) && team(tid).members.includes(pid));
    if (!side) return;
    const key = tr.id + "|" + side;
    const row = by.get(key) || { tour: tr, team: side, p: 0, w: 0, d: 0, g: 0, a: 0, form: [] };
    const won = wonBy(m, side), level = isLevel(m);
    const st = (m.stats || {})[pid];
    row.p++; if (won) row.w++; if (level) row.d = (row.d || 0) + 1;
    row.g += st ? st.goals : 0; row.a += st ? st.assists : 0;
    row.form.push(level ? "D" : won ? "W" : "L");
    by.set(key, row);
  });
  return [...by.values()].map(r => {
    const seat = leaderboard(r.tour).find(x => x.team === r.team);
    r.rank = seat ? seat.rank : null;
    r.finish = r.tour.champion === r.team ? "Champion" : seat ? seat.outLabel : "—";
    return r;
  }).sort((x, y) => String(y.tour.date).localeCompare(String(x.tour.date)));
}

/* What a tournament's crowd made of it. Ratings are public in aggregate — an
   organizer's record is worth seeing — but the notes are written to the organizer,
   so only they read the text. */
function feedbackOf(tid){
  const rows = S.feedback.filter(f => f.tour === tid);
  const avg = rows.length ? rows.reduce((n, f) => n + f.rating, 0) / rows.length : 0;
  return { rows, count: rows.length, avg: Math.round(avg * 10) / 10 };
}
const commentsOf = mid => S.comments.filter(c => c.match === mid).sort((a, b) => a.at - b.at);

/* Pick'em: one token per prediction that came in. A pick on a match that is not
   settled yet is held, not scored — a disputed result must not pay out early. */
function pickScore(uid){
  const mine = S.picks.filter(p => p.by === uid);
  let correct = 0, wrong = 0, pending = 0;
  mine.forEach(p => {
    const m = S.matches.find(x => x.id === p.match);
    if (!m || m.status !== "confirmed"){ pending++; return; }
    winnerOf(m) === p.team ? correct++ : wrong++;
  });
  return { picks: mine.length, correct, wrong, pending, tokens: correct };
}

/* The venue code rotates every 60s so a screenshot cannot be forwarded to
   somebody who is not there (FRONTEND-SPEC, OF-03 stage 1). */
const hashCode = str => { let h = 0; for (const c of String(str)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
function qrToken(matchId, at){
  const win = Math.floor((at === undefined ? NOW() : at) / 60000);
  let h = 2166136261;
  for (const ch of String(matchId) + ":" + win){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36).toUpperCase().padStart(6, "0").slice(-6);
}

/* ── where it is played ──────────────────────────────────────────────
   A venue is a name plus a pin. The pin is taken the way a person actually has
   it — a pasted Google Maps link, or a bare "lat, lng" — and stored as
   coordinates. It renders as a link OUT to Google Maps and never as an embedded
   map: this file has to keep working when it is opened with no network. */
function parsePin(text){
  const raw = String(text || "").trim();
  if (!raw) return null;
  const hit = raw.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/)
    || raw.match(/[?&]q=(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/)
    || raw.match(/^(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)$/);
  if (!hit) return null;
  const lat = Number(hit[1]), lng = Number(hit[2]);
  if (!isFinite(lat) || !isFinite(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
  return { lat: Math.round(lat * 1e6) / 1e6, lng: Math.round(lng * 1e6) / 1e6 };
}
const pinHref = pin => `https://www.google.com/maps?q=${pin.lat},${pin.lng}`;
const pinText = pin => pin ? `${pin.lat}, ${pin.lng}` : "";
/* the venue as it reads on a page: a link when there is a pin behind it */
const venueLine = (name, pin) => pin
  ? `<a href="${pinHref(pin)}" target="_blank" rel="noopener" title="Open in Google Maps">${ic("pin",11)} ${esc(name || "On the map")}</a>`
  : esc(name || "—");
/* a fixture inherits the tournament's pin until somebody overrides it */
const matchPin = m => m.pin || (tour(m.tour) || {}).pin || null;

/* ───────── domain rules ───────── */
const ageOf = dob => { const d=new Date(dob), n=new Date("2026-02-08");
  let a=n.getFullYear()-d.getFullYear(); const m=n.getMonth()-d.getMonth();
  if (m<0 || (m===0 && n.getDate()<d.getDate())) a--; return a; };

/* Nobody may play for two squads in the same tournament — it makes a person their
   own opponent, and lets one check-in stand in for both sides of a match. */
function doubleEntered(tm, tr, ids){
  const rivals = regsOf(tr.id)
    .filter(r => r.team !== tm.id && (r.status === "approved" || r.status === "pending"))
    .map(r => team(r.team)).filter(Boolean);
  const clash = [];
  (ids || tm.members).forEach(pid => {
    const other = rivals.find(x => x.members.includes(pid));
    if (other) clash.push({ user: user(pid), other });
  });
  return clash;
}

/* HARD FILTER — the system rejects, no organizer override (OF-02) */
/* "any", "", null and undefined all mean the same thing: no limit. */
const ageLimit = v => (v === "any" || v === "" || v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);
const ageBand = r => { const lo = ageLimit(r.ageMin), hi = ageLimit(r.ageMax);
  return lo === null && hi === null ? "Any age" : `${lo === null ? "any" : lo}–${hi === null ? "any" : hi}`; };
/* the whole hard filter on one line. The tournament header and the manage panel
   show the same rules, so they read them from here rather than each rebuilding it. */
const ruleSummary = r => [ageBand(r),
  r.gender  && r.gender  !== "any" ? r.gender  : null,
  r.faculty && r.faculty !== "any" ? r.faculty : null,
  r.major   && r.major   !== "any" ? r.major   : null,
  (r.year ?? "any") !== "any" ? "year " + r.year : null,
  r.regOpens || r.regCloses ? `entries ${r.regOpens ? "from " + r.regOpens : "open"}${r.regCloses ? " to " + r.regCloses : ""}` : null,
  r.tourStart || r.tourEnd ? `plays ${r.tourStart ? r.tourStart : "…"}${r.tourEnd ? " to " + r.tourEnd : ""}` : null]
  .filter(Boolean).join(" · ");

/* The registration window lives in the hard filter alongside who may enter,
   but it is checked once per tournament, not once per player — so it stays
   out of hardFilter()'s per-member loop and is read straight from here. */
const regWindowClosed = tr => {
  const r = tr.rules || {};
  if (r.regOpens && NOW() < new Date(r.regOpens + "T00:00:00").getTime())
    return `Registration opens ${r.regOpens}.`;
  if (r.regCloses && NOW() > new Date(r.regCloses + "T23:59:59").getTime())
    return `Registration closed ${r.regCloses}.`;
  return null;
};

const FACULTIES = ["Engineering","Science","Medicine","Law","Architecture","Nursing","Business Admin"];
/* The six conditions, rendered from one place and read from one place. The creation
   form and the change-request modal ask the same questions because they are the same
   markup — a second copy is how two forms drift into two different filters. */
function regWindowFields(r, p){
  return `<div class="field"><label for="${p}regopen">Registration opens — leave empty for immediately</label>
      <input id="${p}regopen" type="date" value="${esc(r.regOpens || "")}"></div>
    <div class="field"><label for="${p}regclose">Registration closes — leave empty for until it fills or draws</label>
      <input id="${p}regclose" type="date" value="${esc(r.regCloses || "")}"></div>`;
}
function durationFields(r, p){
  return `<div class="field"><label for="${p}trstart">Tournament starts — first day of play</label>
      <input id="${p}trstart" type="date" value="${esc(r.tourStart || "")}"></div>
    <div class="field"><label for="${p}trend">Tournament ends — last day of play</label>
      <input id="${p}trend" type="date" value="${esc(r.tourEnd || "")}"></div>`;
}
function eligibilityFields(r, p){
  const sel = (cur, x) => String(cur ?? "any") === String(x) ? " selected" : "";
  const age = v => { const n = ageLimit(v); return n === null ? "" : n; };
  const opts = (list, cur) => list.map(x => `<option${sel(cur, x)}>${esc(x)}</option>`).join("");
  return `<div class="field"><label for="${p}amin">Minimum age — leave empty for any</label>
      <input id="${p}amin" type="number" min="10" max="80" placeholder="any" value="${age(r.ageMin)}"></div>
    <div class="field"><label for="${p}amax">Maximum age — leave empty for any</label>
      <input id="${p}amax" type="number" min="10" max="80" placeholder="any" value="${age(r.ageMax)}"></div>
    <div class="field"><label for="${p}year">Year of study</label><select id="${p}year">
      <option value="any">Any year</option>${[1,2,3,4,5,6].map(y => `<option value="${y}"${sel(r.year, y)}>Year ${y} only</option>`).join("")}</select></div>
    <div class="field"><label for="${p}fac">Faculty restriction</label><select id="${p}fac">
      <option value="any">Any faculty</option>${opts(FACULTIES, r.faculty)}</select></div>
    <div class="field"><label for="${p}major">Major / department</label><select id="${p}major">
      <option value="any">Any major in that faculty</option>${opts(MAJORS, r.major)}</select></div>
    <div class="field"><label for="${p}gen">Gender restriction</label><select id="${p}gen">
      <option value="any">Open</option>${opts(["Male","Female"], r.gender)}</select></div>`;
}
/* the combined form — the change-request modal asks all three groups at once,
   the request-to-organize form below asks them one popup at a time. */
function filterFields(r, p){
  r = r || {};
  return regWindowFields(r, p) + durationFields(r, p) + eligibilityFields(r, p);
}
/* one group, one popup — the shape reqregopen/reqduropen/reqeligopen all share. */
function reqGroupForm(title, fieldsHtml, saveAct){
  return `<div class="vstack">
    <div class="tag"><em>//</em> ${esc(title)}</div>
    ${fieldsHtml}
    <div class="hstack"><button class="btn" data-act="closemodal">Cancel</button>
      <button class="btn primary" data-act="${saveAct}">Save</button></div>
  </div>`;
}
/* … and the reader that goes with it, so a field renamed on one side cannot be
   read from the other. An unset condition reads back as "any", never as "". */
function readRules(p){
  const g = id => (document.getElementById(p + id) || {}).value || "";
  return { gender: g("gen") || "any", ageMin: ageLimit(g("amin")) ?? "any", ageMax: ageLimit(g("amax")) ?? "any",
    faculty: g("fac") || "any", major: g("major") || "any", year: g("year") || "any",
    regOpens: g("regopen") || "", regCloses: g("regclose") || "",
    tourStart: g("trstart") || "", tourEnd: g("trend") || "" };
}

/* HARD FILTER — reads the SQUAD LIST, which is who is actually entering. A member
   the leader left off cannot fail it, because they are not in this tournament. */
function hardFilter(tm, tr, ids){
  const fails = [], entering = (ids && ids.length ? ids : tm.members).filter(id => tm.members.includes(id));
  doubleEntered(tm, tr, entering).forEach(c => fails.push({
    user: c.user, rule: "Already entered", need: "one squad per tournament", got: c.other.name }));
  for (const id of entering){
    const u = user(id); if (!u) continue;
    const r = tr.rules, age = ageOf(u.dob);
    /* an unset condition admits everybody — it is not a condition that always fails */
    const lo = ageLimit(r.ageMin), hi = ageLimit(r.ageMax);
    const band = `${lo === null ? "any" : lo}–${hi === null ? "any" : hi}`;
    if (r.gender !== "any" && u.gender !== r.gender) fails.push({ user:u, rule:"Gender", need:r.gender, got:u.gender });
    if (lo !== null && age < lo) fails.push({ user:u, rule:"Age", need:band, got:age });
    else if (hi !== null && age > hi) fails.push({ user:u, rule:"Age", need:band, got:age });
    if (r.faculty !== "any" && u.faculty !== r.faculty) fails.push({ user:u, rule:"Faculty", need:r.faculty, got:u.faculty });
    /* a faculty cup and a departmental one are different competitions */
    if (r.major && r.major !== "any" && u.major !== r.major) fails.push({ user:u, rule:"Major", need:r.major, got:u.major });
    if (r.year !== "any" && String(u.year) !== String(r.year)) fails.push({ user:u, rule:"Year", need:r.year, got:u.year });
  }
  return fails;
}

/* What to call this match. Both new formats name their own stages when they are
   drawn, so the round arithmetic below is only the single-elimination fallback. */
const matchStage = m => m.stage || roundName(m.round, (tour(m.tour) || {}).rounds || 0);
const matchTag   = m => m.tag   || (shortRound(m.round, (tour(m.tour) || {}).rounds || 0) + (m.slot + 1));
const roundName = (round, rounds) => {
  const left = 1 << (rounds - round);
  return left === 2 ? "Final" : left === 4 ? "Semi-final" : left === 8 ? "Quarter-final" : `Round of ${left}`;
};
const shortRound = (round, rounds) => {
  const left = 1 << (rounds - round);
  return left === 2 ? "F" : left === 4 ? "SF" : left === 8 ? "QF" : "R" + left;
};

/* Until the first match starts, the organizer may keep rearranging the draw. A
   check-in, a recorded score, or a kick-off that has come round all count as
   started — after any of them, a result already played would be re-parented. */
function drawStarted(tr){
  return matchesOf(tr.id).some(m => (m.checkedIn || []).length
    || (m.status !== "scheduled" && m.note !== "bye" && m.note !== "void")
    || (m.kickoff && new Date(m.kickoff).getTime() <= NOW()));
}

/* ── the draw ────────────────────────────────────────────────────────
   Three formats, one entry point. Both elimination formats build a tree and wire
   every match to the one its winner — and, in double, its loser — feeds into.
   Round robin builds a fixture list and no tree at all.

   The wiring is stored on the match (`winTo` / `loseTo`) rather than worked out
   from round and slot arithmetic, because a losers bracket is not a function of
   its round number. Brackets drawn before the graph existed carry neither, so the
   old round/slot rule stays behind as the fallback and nothing saved breaks.

   Byes are spread by pairing slot i against slot size-1-i — the standard seeding
   order. Filling sequentially and pairing neighbours instead lets the empty slots
   at the tail pair with EACH OTHER, producing a match with no teams that can never
   resolve, which deadlocks every round above it: 5, 6, 9-14, 17-30 all break. */
function seedOrder(ids){
  const size = 1 << Math.ceil(Math.log2(Math.max(2, ids.length)));
  return { size, slots: [...ids, ...Array(Math.max(0, size - ids.length)).fill(null)] };
}
/* Kick-off and venue are never inherited from the tournament or guessed from the
   round — a generated fixture is a placeholder pairing, not a scheduled one, and
   the organizer sets both by hand on every match, every draw, via "Set every
   fixture". Referees are still pre-assigned from the tournament's accepted pool,
   since who's on it is already decided by the time the bracket exists. */
function mkMatch(tr, o){
  return { id: uid("m"), tour: tr.id, round: o.round, slot: o.slot,
    bracket: o.bracket || "W", stage: o.stage, tag: o.tag, depth: o.depth === undefined ? o.round : o.depth,
    a: o.a || null, b: o.b || null, sa: null, sb: null, status: "scheduled", channel: tr.channel,
    enteredBy: null, confirmedBy: null, disputedBy: null, disputedTeam: null, note: "",
    kickoff: "", venue: "", pin: null, refs: (tr.referees || []).slice(0, refsNeeded(tr)),
    checkedIn: [], stats: {}, teamStats: {}, lineup: {}, winTo: null, loseTo: null };
}
function buildSingle(tr, ids){
  const { size, slots } = seedOrder(ids), rounds = Math.log2(size), made = [];
  for (let r = 0; r < rounds; r++)
    for (let i = 0; i < (size >> (r + 1)); i++)
      made.push(mkMatch(tr, { round: r, slot: i, bracket: "W", depth: r,
        stage: roundName(r, rounds), tag: shortRound(r, rounds) + (i + 1),
        a: r === 0 ? slots[i] : null, b: r === 0 ? slots[size - 1 - i] : null }));
  const at = (r, i) => made.find(m => m.round === r && m.slot === i);
  made.forEach(m => { const nx = at(m.round + 1, m.slot >> 1);
    if (nx) m.winTo = { m: nx.id, side: m.slot % 2 === 0 ? "a" : "b" }; });
  tr.rounds = rounds;
  return made;
}
/* Double elimination: a losers bracket holds everyone on their first loss, and the
   two trees meet once. One grand final, no bracket reset — a match whose existence
   depends on another match's result cannot be drawn in advance, and the state
   machine has no room for a fixture that might not happen. */
function buildDouble(tr, ids){
  const { size, slots } = seedOrder(ids), k = Math.log2(size);
  if (k < 2) return buildSingle(tr, ids);
  const made = [], W = [], L = [];
  for (let r = 0; r < k; r++){
    W[r] = [];
    for (let i = 0; i < (size >> (r + 1)); i++){
      const m = mkMatch(tr, { round: r, slot: i, bracket: "W", depth: r,
        stage: "Winners " + roundName(r, k).toLowerCase(), tag: "W" + shortRound(r, k) + (i + 1),
        a: r === 0 ? slots[i] : null, b: r === 0 ? slots[size - 1 - i] : null });
      W[r].push(m); made.push(m);
    }
  }
  const lbRounds = 2 * (k - 1);
  for (let j = 0; j < lbRounds; j++){
    L[j] = [];
    for (let i = 0, count = size >> (Math.floor(j / 2) + 2); i < count; i++){
      const m = mkMatch(tr, { round: k + j, slot: i, bracket: "L", depth: j,
        stage: "Losers round " + (j + 1), tag: "L" + (j + 1) + "." + (i + 1) });
      L[j].push(m); made.push(m);
    }
  }
  const gf = mkMatch(tr, { round: k + lbRounds, slot: 0, bracket: "GF", depth: lbRounds,
    stage: "Grand final", tag: "GF" });
  made.push(gf);
  W.forEach((row, r) => row.forEach((m, i) => {
    const up = W[r + 1] && W[r + 1][i >> 1];
    m.winTo = up ? { m: up.id, side: i % 2 === 0 ? "a" : "b" } : { m: gf.id, side: "a" };
    if (r === 0){ const down = L[0] && L[0][i >> 1];
      if (down) m.loseTo = { m: down.id, side: i % 2 === 0 ? "a" : "b" }; }
    else { const row2 = L[2 * r - 1];                 /* losers meet the survivors, reversed */
      if (row2) m.loseTo = { m: row2[row2.length - 1 - i].id, side: "b" }; }
  }));
  L.forEach((row, j) => row.forEach((m, i) => {
    const nx = L[j + 1];
    m.winTo = !nx ? { m: gf.id, side: "b" }
      : j % 2 === 0 ? { m: nx[i].id, side: "a" }      /* next up is a winners-bracket loser */
      : { m: nx[i >> 1].id, side: i % 2 === 0 ? "a" : "b" };
  }));
  tr.rounds = k;
  return made;
}
/* Round robin: everybody plays everybody once, by the circle method. An odd count
   sits one squad out each matchday, which resolves as a bye like any empty slot. */
function buildRoundRobin(tr, ids){
  const list = ids.slice();
  if (list.length % 2) list.push(null);
  const n = Math.max(2, list.length), days = n - 1, half = n / 2, made = [];
  const rot = list.slice(1);
  for (let d = 0; d < days; d++){
    const day = [list[0], ...rot];
    for (let i = 0; i < half; i++)
      made.push(mkMatch(tr, { round: d, slot: i, bracket: "RR", depth: d,
        stage: "Matchday " + (d + 1), tag: "MD" + (d + 1) + "." + (i + 1),
        a: day[i], b: day[n - 1 - i] }));
    rot.unshift(rot.pop());
  }
  tr.rounds = days;
  return made;
}
/* `order` is the organizer arranging the draw by hand; without it the seeding is
   random, which is what the SRS asks for and what most tournaments use. */
function generateBracket(tr, order){
  const ids = (order && order.length ? order.slice()
    : regsOf(tr.id).filter(r => r.status === "approved").map(r => r.team));
  if (!order) for (let i = ids.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  S.matches = S.matches.filter(m => m.tour !== tr.id);
  const fmt = formatOf(tr);
  const made = fmt === "roundrobin" ? buildRoundRobin(tr, ids)
             : fmt === "double"     ? buildDouble(tr, ids)
             :                        buildSingle(tr, ids);
  S.matches.push(...made);
  tr.drawn = true; tr.drawnAt = NOW(); tr.champion = null;
  resolveByes(tr);
  notifyDraw(tr);
  return made;
}
/* Everyone with a stake, not only the leaders: a player is told when they are
   due to play, which is the whole point of a fixture list. */
function notifyDraw(tr){
  const who = regsOf(tr.id).filter(r => r.status === "approved")
    .flatMap(r => { const tm = team(r.team); return tm ? [tm.leader, ...tm.members] : []; });
  notifyAll(who, `The draw for ${tr.name} is out — your fixtures are up.`, `#/t/${tr.id}`);
}
/* Where a result goes next. One rule for all three formats, and the round/slot
   arithmetic kept only for brackets drawn before the graph existed. */
const edgeTarget = e => (e ? S.matches.find(m => m.id === e.m) : null) || null;
const nextOf = m => { const tr = tour(m.tour);
  if (tr && formatOf(tr) === "roundrobin") return null;
  if (m.winTo || m.loseTo) return edgeTarget(m.winTo);
  return S.matches.find(x => x.tour === m.tour && x.round === m.round + 1 && x.slot === (m.slot >> 1)) || null; };
const feedersOf = m => { const tr = tour(m.tour);
  if (tr && formatOf(tr) === "roundrobin") return [];
  return S.matches.filter(x => x.tour === m.tour && x.id !== m.id && (
    (x.winTo && x.winTo.m === m.id) || (x.loseTo && x.loseTo.m === m.id) ||
    (!x.winTo && !x.loseTo && x.round === m.round - 1 && (x.slot >> 1) === m.slot))); };
/* A slot nothing can still fill is a bye, whatever the format. Walking the same
   edges means no bracket needs its own special case for an empty side. */
function resolveByes(tr){
  for (let guard = 0; guard < 64; guard++){
    let moved = false;
    matchesOf(tr.id).filter(m => m.status === "scheduled").forEach(m => {
      if (m.a && m.b) return;
      if (feedersOf(m).some(f => f.status !== "confirmed" && f.status !== "void")) return;
      if (m.a || m.b){ m.sa = m.a ? 1 : 0; m.sb = m.b ? 1 : 0; m.status = "confirmed"; m.note = "bye"; advance(m); }
      else { m.status = "void"; m.note = "void"; advance(m); }
      moved = true;
    });
    if (!moved) break;
  }
}
function advance(m){
  const tr = tour(m.tour); if (!tr) return;
  const win = winnerId(m), lose = win ? ([m.a, m.b].find(x => x && x !== win) || null) : null;
  if (m.winTo || m.loseTo){
    const put = (e, tid) => { const nx = edgeTarget(e); if (nx && tid) nx[e.side] = tid; };
    put(m.winTo, win); put(m.loseTo, lose);
    if (!m.winTo && win) tr.champion = win;
  } else if (formatOf(tr) !== "roundrobin"){        /* drawn before the graph */
    const next = nextOf(m);
    if (!next){ if (win) tr.champion = win; }
    else if (win){ if (m.slot % 2 === 0) next.a = win; else next.b = win; }
  }
  crownIfDone(tr);
}
/* Round robin has no final to win. The champion is the top of the table once every
   match is in — and a dead heat at the top is left for the organizer to settle,
   which is the one place a human ranks a round robin. */
function crownIfDone(tr){
  if (formatOf(tr) !== "roundrobin" || tr.champion) return;
  const ms = matchesOf(tr.id).filter(m => m.status !== "void");
  if (!ms.length || ms.some(m => m.status !== "confirmed")) return;
  const table = standings(tr);
  if (table.length < 1 || (table.length > 1 && table[1].rank === 1)) return;
  tr.champion = table[0].team;
}
const rrDeadHeat = tr => { if (formatOf(tr) !== "roundrobin" || tr.champion) return null;
  const ms = matchesOf(tr.id).filter(m => m.status !== "void");
  if (!ms.length || ms.some(m => m.status !== "confirmed")) return null;
  const table = standings(tr);
  return table.filter(r => r.rank === 1).map(r => r.team); };
/* Football, hockey and basketball all end knockout ties level and settle them
   afterwards — penalties, a shoot-out, overtime. The tie IS the score; forcing a
   referee to type 2-1 falsifies every leaderboard and profile built on it. So the
   decider sits beside the score, and this is the only place that reads either. */
const winnerId = m => {
  if (!m || !m.a || !m.b) return (m && (m.a || m.b)) || null;
  /* level with no decider is a Level result — it stands in round robin, and the
     entry form refuses it anywhere else, so null here means "finished level" */
  if (m.sa === m.sb) return m.decider ? (m.decider.a > m.decider.b ? m.a : m.b) : null;
  return m.sa > m.sb ? m.a : m.b;
};
const isLevel = m => !!m && m.a && m.b && m.sa !== null && m.sa === m.sb && !m.decider;
const wonBy = (m, tid) => winnerId(m) === tid;
/* Who objected. The person clicked; the squad is what disputes, and that is what
   every screen showing a dispute has to name. */
function disputeName(m){
  const tm = m.disputedTeam ? team(m.disputedTeam) : null, u = user(m.disputedBy);
  if (tm) return `${tm.name}${u ? ` (${u.name})` : ""}`;
  return u ? u.name : "A squad";
}
/* what a scoreline counts, per sport — a volleyball 3-1 is sets, not points */
const SCORE_UNIT = {
  Football:"Goals", Futsal:"Goals", Basketball:"Points", Volleyball:"Sets",
  Badminton:"Games", VALORANT:"Maps", ROV:"Games", Esports:"Rounds", Chess:"Result", Swimming:"Points",
};
const scoreUnit = sport => SCORE_UNIT[sport] || "Points";
/* and what settles it when the scoreline is level */
const DECIDER = {
  Football:"Penalties", Futsal:"Penalties", Basketball:"Overtime", Volleyball:"Tiebreak",
  Badminton:"Tiebreak", VALORANT:"Overtime", ROV:"Overtime", Esports:"Overtime", Chess:"Armageddon", Swimming:"Swim-off",
};
const deciderName = sport => DECIDER[sport] || "Decider";
const scoreLine = m => { const t = tour(m.tour);
  const base = `${m.sa ?? "—"} – ${m.sb ?? "—"}`;
  return m.decider ? `${base} (${m.decider.a}–${m.decider.b} ${esc(deciderName(t ? t.sport : ""))})` : base; };

const winnerOf = m => m.status === "confirmed" ? winnerId(m) : null;

/* The leaderboard is derived, never stored, and what it derives from is the format.
   Single elimination: the round you went out in. Double: the round of your second
   loss. Round robin: the table. Teams that finish level share a rank in all three
   — the board says so rather than inventing a rule to separate them. */
function leaderboard(tr){
  if (formatOf(tr) === "roundrobin") return standings(tr);
  const ms = matchesOf(tr.id), rounds = tr.rounds || 0, twice = formatOf(tr) === "double";
  const rows = new Map();
  const touch = id => { if (id && !rows.has(id)) rows.set(id, { team:id, p:0, w:0, l:0, out:null, outStage:null, form:[] }); return rows.get(id); };
  ms.filter(m => m.status === "confirmed" && m.note !== "bye").forEach(m => {
    const A = touch(m.a), B = touch(m.b); if (!A || !B) return;
    A.p++; B.p++;
    const aw = wonBy(m, m.a);
    (aw ? A : B).w++; (aw ? A : B).form.push("W"); (aw ? B : A).form.push("L");
    const loser = aw ? B : A; loser.l++;
    /* in double elimination the first loss sends you down, not out */
    if (!twice || loser.l >= 2){ loser.out = m.depth === undefined ? m.round : m.depth; loser.outStage = m.stage || null; }
  });
  regsOf(tr.id).filter(r => r.status === "approved").forEach(r => touch(r.team));
  const list = [...rows.values()];
  list.forEach(r => { r.depth = r.out === null ? 99 : r.out; });
  list.sort((a,b) => b.depth - a.depth || b.w - a.w);
  let rank = 0, prev = null, seen = 0;
  list.forEach(r => { seen++; if (r.depth !== prev){ rank = seen; prev = r.depth; } r.rank = rank;
    r.outLabel = r.out === null ? (tr.champion === r.team ? "Champion" : "Still in")
      : (r.outStage || roundName(r.out, rounds)); });
  return list;
}
/* Round robin: three points for a win, one for a level result. Teams level on
   points separate on score difference, then units scored, then the result between
   them — worked out inside the tied group, because that is the only place it means
   anything. Still level after all three, they share the rank. */
function standings(tr){
  const rows = new Map();
  const touch = id => { if (id && !rows.has(id)) rows.set(id, { team:id, p:0, w:0, d:0, l:0, gf:0, ga:0, pts:0, mini:0, out:null, form:[] }); return rows.get(id); };
  regsOf(tr.id).filter(r => r.status === "approved").forEach(r => touch(r.team));
  const played = matchesOf(tr.id).filter(m => m.status === "confirmed" && m.note !== "bye" && m.a && m.b);
  played.forEach(m => {
    const A = touch(m.a), B = touch(m.b); if (!A || !B) return;
    A.p++; B.p++; A.gf += m.sa; A.ga += m.sb; B.gf += m.sb; B.ga += m.sa;
    const win = winnerId(m);
    if (!win){ A.d++; B.d++; A.pts++; B.pts++; A.form.push("D"); B.form.push("D"); }
    else { const Wr = win === m.a ? A : B, Lr = win === m.a ? B : A;
      Wr.w++; Wr.pts += 3; Wr.form.push("W"); Lr.l++; Lr.form.push("L"); }
  });
  const list = [...rows.values()];
  list.forEach(r => { r.gd = r.gf - r.ga; });
  const key = r => [r.pts, r.gd, r.gf].join("|");
  const groups = new Map();
  list.forEach(r => { const k = key(r); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); });
  groups.forEach(g => { if (g.length < 2) return;
    const inGroup = new Set(g.map(r => r.team)), row = id => g.find(r => r.team === id);
    played.filter(m => inGroup.has(m.a) && inGroup.has(m.b)).forEach(m => {
      const win = winnerId(m);
      if (!win){ row(m.a).mini++; row(m.b).mini++; } else row(win).mini += 3;
    });
  });
  list.sort((a,b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || b.mini - a.mini
    || String(a.team).localeCompare(String(b.team)));
  let rank = 0, prev = null, seen = 0;
  list.forEach(r => { seen++;
    const k = [r.pts, r.gd, r.gf, r.mini].join("|");
    if (k !== prev){ rank = seen; prev = k; } r.rank = rank;
    r.outLabel = tr.champion === r.team ? "Champion" : `${r.pts} point${r.pts === 1 ? "" : "s"}`; });
  return list;
}

/* GitHub, Slack and Jira all settled on the same answer: say how long ago in the
   text, keep the exact stamp in the title so nothing is actually lost. */
function ago(at, now){
  const t = typeof at === "number" ? at : new Date(at).getTime();
  const d = Math.round(((now === undefined ? NOW() : now) - t) / 1000);
  if (!isFinite(d)) return "";
  if (d < 0) return "in " + ago(NOW() * 2 - t, NOW());
  if (d < 60) return "just now";
  if (d < 3600) return Math.floor(d / 60) + " min ago";
  if (d < 86400) return Math.floor(d / 3600) + "h ago";
  if (d < 2592000) return Math.floor(d / 86400) + "d ago";
  return Math.floor(d / 2592000) + "mo ago";
}

  return `<div class="scorebug">

  </div>`;
}
function qr(size = 19, seed = 7){
  let r = seed, px = 7;
  const rand = () => (r = (r*1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  const fin = (x,y) => (x<7&&y<7)||(x>size-8&&y<7)||(x<7&&y>size-8);
  const onFin = (x,y) => { const lx=x<7?x:x-(size-7), ly=y<7?y:y-(size-7);
    const d=Math.max(Math.abs(lx-3),Math.abs(ly-3)); return d===3||d<=1; };
  let out = "";
  for(let y=0;y<size;y++) for(let x=0;x<size;x++)
    if (fin(x,y) ? onFin(x,y) : rand()>.52) out += `<rect x="${x*px}" y="${y*px}" width="${px}" height="${px}"/>`;
  return `<svg width="${size*px}" height="${size*px}" role="img" aria-label="Check-in QR code">${out}</svg>`;
}

   organizer has to remember to look at Manage, a referee at Matches, a leader at
   Teams. So the work comes to the front page instead, one line per thing, each a
   link to the page that clears it. Derived every render — nothing is stored. */
function workQueue(){
  const u = me(); if (!u) return [];
  const q = [];
  const mineTours = S.tournaments.filter(t => t.organizer === u.id);

  mineTours.forEach(t => {
    const disp = matchesOf(t.id).filter(m => m.status === "disputed");
    if (disp.length) q.push({ kind:"crit", what:`${disp.length} disputed result${disp.length===1?"":"s"} to settle`,
      where:`${t.name} · your decision is final`, href:`#/m/${disp[0].id}`,
      items: disp.map(m => ({ label: matchStage(m), sub: `${team(m.a) ? team(m.a).name : "TBD"} vs ${team(m.b) ? team(m.b).name : "TBD"}`, href:`#/m/${m.id}` })) });
    const pend = regsOf(t.id).filter(r => r.status === "pending");
    if (pend.length) q.push({ kind:"warn", what:`${pend.length} squad${pend.length===1?"":"s"} to review`,
      where:`${t.name} · soft filter`, href:`#/t/${t.id}/manage/registrations`,
      items: pend.map(r => ({ label: team(r.team) ? team(r.team).name : "—", sub: "waiting on you", href:`#/t/${t.id}/manage/registrations` })) });
    const wd = regsOf(t.id).filter(r => r.withdrawRequested);
    if (wd.length) q.push({ kind:"warn", what:`${wd.length} withdrawal request${wd.length===1?"":"s"}`,
      where:`${t.name} · the bracket is live`, href:`#/t/${t.id}/manage/registrations`,
      items: wd.map(r => ({ label: team(r.team) ? team(r.team).name : "—", sub: "withdrawal request", href:`#/t/${t.id}/manage/registrations` })) });
    if (t.status === "private"){
      const need = refsNeeded(t), got = (t.referees||[]).length;
      q.push(got >= need
        ? { kind:"ok", what:"Ready to publish", where:`${t.name} · ${got} of ${need} referees accepted`, href:`#/t/${t.id}/manage`,
            items: [{ label: t.name, sub: "publish from Progress", href:`#/t/${t.id}/manage/progress` }] }
        : { kind:"warn", what:`${need - got} more referee${need-got===1?"":"s"} to appoint`, where:`${t.name} · it cannot go public without them`, href:`#/t/${t.id}/manage/referees`,
            items: [{ label: t.name, sub: `${got} of ${need} accepted`, href:`#/t/${t.id}/manage/referees` }] });
    }
    if (t.status === "public" && !t.drawn && regsOf(t.id).filter(r => r.status === "approved").length >= 2)
      q.push({ kind:"ok", what:"Ready to draw", where:`${t.name} · ${regsOf(t.id).filter(r=>r.status==="approved").length} squads approved`, href:`#/t/${t.id}/manage/draw`,
        items: [{ label: t.name, sub: `${regsOf(t.id).filter(r=>r.status==="approved").length} squads approved`, href:`#/t/${t.id}/manage/draw` }] });
  });

  /* officiating */
  const refWork = S.matches.filter(m => (m.refs||[]).includes(u.id) && m.a && m.b && m.status !== "confirmed");
  const toEnter = refWork.filter(m => m.status === "scheduled" && tour(m.tour).channel === "onsite");
  const toConfirm = refWork.filter(m => m.status === "pending" && tour(m.tour).channel === "online");
  if (toEnter.length) q.push({ kind:"warn", what:`${toEnter.length} result${toEnter.length===1?"":"s"} to record`,
    where:`you are officiating · ${esc(tour(toEnter[0].tour).name)}`, href:`#/m/${toEnter[0].id}`,
    items: toEnter.map(m => ({ label: matchStage(m), sub: tour(m.tour).name, href:`#/m/${m.id}` })) });
  if (toConfirm.length) q.push({ kind:"warn", what:`${toConfirm.length} submitted result${toConfirm.length===1?"":"s"} to check and confirm`,
    where:`you are officiating · ${esc(tour(toConfirm[0].tour).name)}`, href:`#/m/${toConfirm[0].id}`,
    items: toConfirm.map(m => ({ label: matchStage(m), sub: tour(m.tour).name, href:`#/m/${m.id}` })) });
  const refInv = S.refInvites.filter(i => i.user === u.id && i.status === "pending");
  if (refInv.length) q.push({ kind:"warn", what:`${refInv.length} appointment${refInv.length===1?"":"s"} to answer`,
    where:"an organizer asked you to officiate", href:"#/matches",
    items: refInv.map(i => ({ label: tour(i.tour) ? tour(i.tour).name : "—", sub: "officiate invitation", href:"#/matches" })) });

  /* playing */
  const myLed = ledTeams().map(t => t.id);
  const toSign = S.matches.filter(m => m.status === "pending" && tour(m.tour).channel === "onsite"
    && m.a && m.b && myLed.includes(winnerOf(m)));
  if (toSign.length) q.push({ kind:"warn", what:`${toSign.length} result${toSign.length===1?"":"s"} to confirm`,
    where:"you won — the losing side disputes instead", href:`#/m/${toSign[0].id}`,
    items: toSign.map(m => ({ label: matchStage(m), sub: tour(m.tour).name, href:`#/m/${m.id}` })) });
  const inv = S.invites.filter(i => i.user === u.id && i.status === "pending");
  if (inv.length) q.push({ kind:"warn", what:`${inv.length} squad invitation${inv.length===1?"":"s"} waiting on you`,
    where:"accepting shares your eligibility data with an organizer", href:"#/teams",
    items: inv.map(i => ({ label: team(i.team) ? team(i.team).name : "—", sub: "squad invitation", href:"#/teams" })) });

  /* admin */
  if (u.role === "Admin"){
    const req = S.tournaments.filter(t => t.status === "pending");
    if (req.length) q.push({ kind:"crit", what:`${req.length} request${req.length===1?"":"s"} to organize`,
      where:"waiting on your approval", href:"#/admin",
      items: req.map(t => ({ label: t.name, sub: user(t.organizer) ? user(t.organizer).name : "—", href:"#/admin" })) });
  }
  return q;
}
/* One "Needs you" column is one severity, and one severity can bundle several
   things (three disputes, three matches to score) across several tournaments —
   this is where clicking stops guessing which one you meant and lists them all. */
function workPicker(label, entries){
  return `<div class="vstack">
    <div class="tag"><em>//</em> ${esc(label)}</div>
    <div class="vstack" style="gap:14px">
      ${entries.map(x => `<div class="vstack" style="gap:6px">
        <span class="sub"><b style="color:var(--bone)">${esc(x.what)}</b> — ${esc(x.where)}</span>
        ${x.items.map(it => `<button class="who" data-act="workgo" data-h="${it.href}">
          <span class="meta"><b>${esc(it.label)}</b>${it.sub ? `<span class="tag">${esc(it.sub)}</span>` : ""}</span>
          ${ic("chev",13)}</button>`).join("")}
      </div>`).join("")}
    </div>
    <button class="btn ghost" data-act="closemodal">Cancel</button>
  </div>`;
}

/* rel: "run" — yours to manage · "playing" — a squad of yours is in it · null — everyone else's */
function tourCard(t, rel, entry){
  const n = regsOf(t.id).filter(r => r.status === "approved").length;
  const st = t.status === "public" ? badge("ok","Public") : t.status === "private" ? badge("neutral","Private") : badge("warn","Pending review");
  const org = user(t.organizer);
  const edge = rel === "run" ? "var(--red)" : rel === "playing" ? "var(--teal)" : null;
  const mine = entry ? team(entry.team) : null;
  return `<button class="panel capsule vstack ${rel || ""}" style="gap:12px;text-align:left;border:0;color:inherit${edge ? `;box-shadow:var(--sheen),0 0 0 1px ${edge}` : ""}"
      data-act="nav" data-h="#/t/${t.id}${rel === "run" ? "/manage" : ""}">
    <span class="cap" aria-hidden="true"><b>${esc(t.sport)}</b></span>
    <span class="spread">${st}<span class="tag">${esc(t.sport)}</span></span>
    <span class="disp" style="font-size:22px">${esc(t.name)}</span>
    ${rel === "run" ? `<span class="tag"><em>//</em> You run this</span>`
      : rel === "playing" && mine ? `<span class="hstack" style="gap:7px">
          <span class="tchip"><i style="background:${mine.color}"></i><b>${esc(mine.name)}</b></span>
          ${entry.status === "approved" ? badge("ok","In the draw") : badge("warn","Waiting on the organizer")}</span>`
      : `<span class="tag">Run by ${esc(org ? org.name : "—")}</span>`}
    <span class="spread" style="border-top:1px solid var(--line);padding-top:11px;width:100%">
      <span class="tag">${n} / ${t.cap} teams</span>
      <span class="tag">${t.champion ? "Champion: " + esc(team(t.champion).code) : t.drawn ? "In progress" : "Registration open"}</span>
    </span></button>`;
}
/* finished / competing / open covers everything with a public lifecycle;
   a private or still-pending tournament has not entered that lifecycle yet
   and is never swept up by the "finished" filter. */
const tourLifecycle = t => t.champion ? "finished" : t.drawn ? "competing"
  : t.status === "public" ? "open" : "other";
function viewHome(q, tabParam){
  const u = me();
  const query = String(q ?? homeQuery ?? "").trim().toLowerCase();
  const status = String(homeStatus || "");
  const all = S.tournaments.filter(visibleTo);
  const textFiltered = query
    ? all.filter(t => (t.name + " " + t.sport + " " + t.venue).toLowerCase().includes(query))
    : all;
  /* an explicit status choice narrows everywhere, including your own — but
     by default your own tournaments and entries keep their full history;
     only the general catalog below hides a decided champion unasked. */
  const visible = status ? textFiltered.filter(t => tourLifecycle(t) === status) : textFiltered;
  const mine = u ? visible.filter(t => t.organizer === u.id) : [];
  /* a squad you are in, entered and not thrown out — a rejection is not a fixture.
     One tournament sits in one place: running it outranks playing in it. */
  const squads = myTeams().map(x => x.id);
  const entries = new Map();
  if (u) S.registrations.filter(r => squads.includes(r.team) && (r.status === "approved" || r.status === "pending"))
    .forEach(r => { if (!entries.has(r.tour)) entries.set(r.tour, r); });
  const playing = visible.filter(t => !mine.includes(t) && entries.has(t.id));
  /* the only state a competitor can act on: published, undrawn and not yet full */
  const open = visible.filter(t => !mine.includes(t) && !playing.includes(t)
    && t.status === "public" && !t.drawn
    && regsOf(t.id).filter(r => r.status === "approved").length < t.cap);
  const rest = visible.filter(t => !mine.includes(t) && !playing.includes(t) && !open.includes(t)
    && (status || query || tourLifecycle(t) !== "finished"));
  return `
  <div class="spread">
    <div><div class="tag"><em>//</em> University Sports Council · Season 2026</div>
      <h1 class="disp" style="font-size:36px;margin-top:6px">Tournaments</h1></div>
    ${u ? `<button class="btn primary" data-act="nav" data-h="#/request">${ic("plus",13)} Request a tournament</button>` : ""}
  </div>

  ${(() => { const q = workQueue(); if (!q.length) return "";
    const cols = [["crit","Urgent"],["warn","Waiting"],["ok","Ready"]];
    return `<div class="panel vstack">
    <div class="spread"><span class="tag"><em>//</em> Needs you · ${q.length}</span>
      </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
      ${cols.map(([kind, label]) => { const n = q.filter(x => x.kind === kind).length;
        return `<button class="workrow" data-act="workopen" data-kind="${kind}"${n ? "" : " disabled"}>
          <span class="wk ${kind}"></span>
          <span class="txt"><b>${esc(label)}</b><span class="sub">${n} thing${n===1?"":"s"}</span></span>
          ${ic("chev",13)}</button>`; }).join("")}
    </div></div>`; })()}

  <div class="toolbar">
    <span class="field">
      <label for="home-find" class="tag">Find one · ${visible.length} of ${all.length}</label>
      <input id="home-find" data-act="homefind" autocomplete="off" value="${esc(query)}"
        placeholder="Name, sport or venue…">
    </span>
    <span class="chips" id="home-sports" role="group" aria-label="Filter by sport">
      <button class="btn pill ${query ? "ghost" : "primary"}" aria-pressed="${!query}" data-act="homesport" data-q="">All sports</button>
      ${[...new Set(all.map(t => t.sport))].sort().map(sp =>
        `<button class="btn pill ${query === sp.toLowerCase() ? "primary" : "ghost"}" aria-pressed="${query === sp.toLowerCase()}" data-act="homesport" data-q="${esc(sp)}">${esc(sp)}</button>`).join("")}
    </span>
  </div>
  <div class="toolbar" style="position:static;margin-top:8px">
    <span class="tag">Stage</span>
    <span class="segmented" id="home-status" role="tablist" aria-label="Filter by stage">
      ${[["","All"],["open","Open for entry"],["competing","In progress"],["finished","Finished"]].map(([v, lab]) =>
        `<button class="${status === v ? "on" : ""}" role="tab" aria-selected="${status === v}" data-act="homestatus" data-q="${v}">${esc(lab)}</button>`).join("")}
    </span>
  </div>

  ${query && !visible.length ? `<div class="empty">${ic("search",28)}<b>Nothing matched “${esc(query)}”</b>
    <span class="sub">No tournament here has that in its name, sport or venue. Clear the filter, or try the sport on its own.</span>
    <button class="btn" data-act="homesport" data-q="">Clear the filter</button></div>` : ""}
  ${(() => {
    const cats = [
      { key:"mine", items: mine, label:`Yours to run · ${mine.length}`, body:`<div class="grid3">${mine.map(t => tourCard(t, "run")).join("")}</div>` },
      { key:"playing", items: playing, label:`You're competing in · ${playing.length}`, body:`<div class="grid3">${playing.map(t => tourCard(t, "playing", entries.get(t.id))).join("")}</div>` },
      { key:"open", items: open, label:`Open for entry · ${open.length}`, body:`<div class="grid3">${open.map(t => tourCard(t, null)).join("")}</div>` },
      { key:"rest", items: rest, label:`Other tournaments · ${rest.length}`, body:`<div class="grid3">${rest.map(t => tourCard(t, null)).join("")}</div>` },
    ].filter(c => c.items.length);
    if (!cats.length) return visible.length ? "" : `<div class="empty">${ic("trophy",30)}<b>No tournaments yet</b><span class="sub">Request one to get started.</span></div>`;
    const tab = cats.find(c => c.key === tabParam) ? tabParam : cats[0].key;
    return `<div class="tabs">${cats.map(c => `<button class="tab ${c.key===tab?"on":""}" data-act="nav" data-h="#/home/${c.key}">${c.label}</button>`).join("")}</div>
      ${cats.find(c => c.key === tab).body}`;
  })()}
`;
}

/* — tournament detail — */
function viewTournament(id, tab, sub){
  const t = tour(id); if (!t) return `<div class="empty">${ic("warn",26)}<b>That tournament doesn't exist</b><button class="btn" data-act="nav" data-h="#/">Go back</button></div>`;
  const org = isOrg(t);
  /* the list and the search already filter these out; this stops a guessed URL too */
  if (!visibleTo(t))
    return `<div class="empty">${ic("warn",26)}<b>Not published yet</b>
      <span class="sub">${esc(t.status === "pending" ? "This tournament is still waiting on admin approval." : "This tournament is private until its organizer publishes it.")}</span>
      <button class="btn" data-act="nav" data-h="#/">Back to tournaments</button></div>`;
  const tabs = ["bracket","schedule","leaderboard","announcements","community"].concat(org ? ["manage"] : []);
  /* Organizer is scoped per tournament and several people hold it at once. Asking
     for somebody else's manage tab has to be refused out loud — quietly swapping in
     the bracket reads as a bug, and hides that ownership is the thing in the way. */
  if (tab === "manage" && !org){
    const who = user(t.organizer);
    return `<div class="crumb"><button data-act="nav" data-h="#/t/${t.id}">${ic("chevL",11)} ${esc(t.name)}</button></div>
      <div class="empty">${ic("warn",28)}<b>403 — not yours to manage</b>
        <span class="sub">${esc(t.name)} is run by <b style="color:var(--bone)">${esc(who ? who.name : "another organizer")}</b>.
          Organizer is granted per tournament, so it does not carry across to this one.</span>
        <span class="hstack"><button class="btn" data-act="nav" data-h="#/t/${t.id}/bracket">Open the public page</button>
          <button class="btn ghost" data-act="nav" data-h="#/">Your tournaments</button></span></div>`;
  }
  const extraNav = `${t.champion ? `<button class="btn primary" data-act="nav" data-h="#/mvp/${t.id}">${ic("star",12)} Vote MVP</button>` : ""}
    ${matchesOf(t.id).some(m => m.status === "scheduled" && m.a && m.b) ? `<button class="btn" data-act="nav" data-h="#/watch/${t.id}">${ic("match",12)} Watch</button>` : ""}`;
  tab = tabs.includes(tab) ? tab : "bracket";
  const approved = regsOf(t.id).filter(r=>r.status==="approved");
  return `
  <div class="crumb"><button data-act="nav" data-h="#/">${ic("chevL",11)} Tournaments</button><span class="sub" aria-hidden="true">/</span><span style="color:var(--bone)">${esc(t.name)}</span></div>
  <div class="spread">
    <div><div class="tag"><em>//</em> ${esc(t.sport)} · ${esc(formatName(t))} · ${esc(t.channel)}</div>
      <h1 class="disp" style="font-size:32px;margin-top:6px">${esc(t.name)}</h1>
      <div class="tag" style="margin-top:6px">${org ? "<em>//</em> You run this tournament"
        : `Run by ${esc(user(t.organizer) ? user(t.organizer).name : "—")}`}</div></div>
    <div class="hstack">${t.champion ? badge("ok","Champion · "+esc(team(t.champion).name)) :
      t.status==="public"?badge("ok","Public"):t.status==="private"?badge("neutral","Private"):badge("warn","Pending review")}
      ${extraNav}</div>
  </div>
  <div class="split">
    <div>
      <div class="tabs">${tabs.map(x => `<button class="tab ${x===tab?"on":""}" data-act="nav" data-h="#/t/${t.id}/${x}">${x==="manage"?"Manage":x}</button>`).join("")}</div>
      ${tab==="bracket" ? tabBracket(t) : tab==="schedule" ? tabSchedule(t) : tab==="leaderboard" ? tabBoard(t)
        : tab==="announcements" ? tabAnnounce(t, org)
        : tab==="community" ? tabCommunity(t, org) : tabManage(t, approved, sub)}
    </div>
    <div class="rail">
      <div class="panel vstack">
        <span class="tag"><em>//</em> The details</span>
        <div class="facts">
          <div><span class="k">Sport</span><span class="f">${esc(t.sport)}</span></div>
          <div><span class="k">Format</span><span class="f">${esc(formatName(t))}</span></div>
          <div><span class="k">Date</span><span class="f">${esc(t.date)}</span></div>
          <div><span class="k">Venue</span><span class="f">${venueLine(t.venue, t.pin)}</span></div>
          <div><span class="k">Played</span><span class="f">${esc(t.channel)}</span></div>
          <div><span class="k">Entry</span><span class="f">${esc(ruleSummary(t.rules || {}))}</span></div>
          <div><span class="k">Squads in</span><span class="f"><b class="num">${approved.length}</b> <span class="sub">of ${t.cap}</span></span></div>
          <div><span class="k">Run by</span><span class="f">${esc(user(t.organizer) ? user(t.organizer).name : "—")}</span></div>
        </div>
      </div>
      ${entryPanel(t)}
      ${t.entryNotes ? `<div class="panel quiet vstack"><span class="tag"><em>//</em> Soft filter from the organizer</span>
        <div style="font-size:15px;line-height:1.55">${esc(t.entryNotes)}</div>
        </div>` : ""}
    </div>
  </div>`;
}

/* Entry, read from the tournament rather than from the squad. A leader who has just
   read the rules and the entry notes is already here; sending them to their squad
   page to start again is the long way round to the same form. */
function entryPanel(t){
  const approved = regsOf(t.id).filter(r => r.status === "approved").length;
  const closed = t.drawn ? "The bracket is drawn — entries are closed."
    : t.status !== "public" ? "Not open for registration yet."
    : approved >= t.cap ? `Full at ${t.cap} squads.`
    : regWindowClosed(t) || "";
  /* every squad of mine already in this one, whatever the organizer decided about it */
  const in_ = me() ? S.registrations.filter(r => r.tour === t.id && r.status !== "withdrawn"
    && team(r.team) && team(r.team).leader === sid()) : [];
  const can = me() ? squadsFor(t) : [];
  return `<div class="panel vstack">
    <div class="spread"><span class="tag"><em>//</em> Entry</span>
      ${closed ? badge("neutral", t.drawn ? "Closed" : approved >= t.cap ? "Full" : "Not open") : badge("ok","Open")}</div>
    <div class="facts"><div><span class="k">Squads in</span><span class="f"><b class="num">${approved}</b> <span class="sub">of ${t.cap}</span></span></div>
      <div><span class="k">Entry rules</span><span class="f">${esc(ruleSummary(t.rules || {}) || "open to everybody")}</span></div></div>
    ${in_.map(r => `<div class="spread"><span class="sub">${esc(team(r.team).name)}</span>
      ${r.status === "approved" ? badge("ok","In") : r.status === "rejected" ? badge("crit","Rejected by the hard filter") : badge("warn","Waiting on the organizer")}</div>`).join("")}
    ${closed ? ``
      : !me() ? `<div class="hstack"><button class="btn primary" data-act="nav" data-h="#/login">Sign in to enter a squad</button></div>`
      : can.length ? `<div class="hstack"><button class="btn primary" data-act="regfor" data-id="${t.id}">Register a squad</button></div>
          `
      : in_.length ? ``
      : ``}
  </div>`;
}

/* the team's most-advanced surviving appearance in this tournament — the one
   bracket row that should carry a view-transition-name so a confirm morphs the
   winner into it. Round numbers are monotonic across brackets (the losers
   bracket starts past every winners round, the grand final past every losers
   round — see generateBracket), so max round is always the frontier. Round
   robin has no bracket to advance through, so it opts out. */
function bracketFrontier(trId){
  const tr = tour(trId);
  if (!tr || formatOf(tr) === "roundrobin") return new Map();
  const best = new Map();
  matchesOf(trId).forEach(m => [m.a, m.b].forEach(tid => {
    if (!tid) return;
    const cur = best.get(tid);
    if (!cur || m.round > cur.round) best.set(tid, { round: m.round, matchId: m.id });
  }));
  return best;
}
function tabBracket(t){
  if (!t.drawn) return `<div class="empty">${ic("trophy",30)}<b>The ${formatOf(t) === "roundrobin" ? "fixtures have not been drawn" : "bracket hasn't been drawn"}</b>
    <span class="sub">${regsOf(t.id).filter(r=>r.status==="approved").length} squads approved so far · ${esc(formatName(t))}.</span>
    ${isOrg(t) ? `<button class="btn primary" data-act="nav" data-h="#/t/${t.id}/manage">Go to manage</button>` : ""}</div>`;
  const ms = matchesOf(t.id), rounds = t.rounds;
  if (formatOf(t) === "roundrobin"){
    const days = [...new Set(ms.map(m => m.round))].sort((a, b) => a - b);
    return `
      ${days.map(d => `<div class="tag" style="margin-top:8px"><em>//</em> ${esc(matchStage(ms.find(m => m.round === d)))}</div>
        <div class="grid2">${ms.filter(m => m.round === d).map(m => bracketNode(m, rounds)).join("")}</div>`).join("")}`;
  }
  const col = (label, list) => `<div class="bcol">
      <div class="tag" style="text-align:center"><em>//</em> ${esc(label)}</div>
      ${list.map(m => bracketNode(m, rounds)).join("")}</div>`;
  if (formatOf(t) === "double"){
    const wb = ms.filter(m => m.bracket === "W"), lb = ms.filter(m => m.bracket === "L"), gf = ms.filter(m => m.bracket === "GF");
    const byRound = list => [...new Set(list.map(m => m.round))].sort((a,b)=>a-b).map(r => list.filter(m => m.round === r));
    return `<div class="tag"><em>//</em> Winners bracket</div>
      <div class="tblwrap"><div class="bracket">${byRound(wb).map(c => col(matchStage(c[0]), c)).join("")}</div></div>
      <div class="tag" style="margin-top:10px"><em>//</em> Losers bracket — a first loss sends you here, a second sends you home</div>
      <div class="tblwrap"><div class="bracket">${byRound(lb).map(c => col(matchStage(c[0]), c)).join("")}</div></div>
      ${gf.length ? `<div class="tag" style="margin-top:10px"><em>//</em> Grand final — one match, no bracket reset</div>
        <div class="grid2">${gf.map(m => bracketNode(m, rounds)).join("")}</div>` : ""}`;
  }
  const cols = Array.from({length: rounds}, (_, r) => ms.filter(m => m.round === r));
  return `<div class="tblwrap"><div class="bracket">${cols.map((c, r) => col(roundName(r, rounds), c)).join("")}</div></div>`;
}
function bracketNode(m, rounds){
  const frontier = bracketFrontier(m.tour);
  const row = (id, s, win, lose) => { const t = id?team(id):null;
    const vt = t && frontier.get(id)?.matchId === m.id ? ` style="view-transition-name:vt-team-${id}"` : "";
    return `<span class="brow ${win?"win":lose?"lose":""}"${vt}>
    <i style="background:${t?t.color:"var(--hairline)"}"></i><span class="nm">${t?esc(t.name):"TBD"}</span><span class="sc">${s ?? "—"}</span></span>`; };
  const dec = m.status === "confirmed";
  return `<button class="bnode ${m.status==="disputed"||m.status==="pending"?"act":""}" data-act="nav" data-h="#/m/${m.id}" data-mid="${m.id}">
    <span class="bhead"><span class="tag"><em>//</em> ${esc(matchTag(m))}</span>${statusBadge(m)}</span>
    ${row(m.a, m.sa, dec&&m.sa>m.sb, dec&&m.sa<m.sb)}${row(m.b, m.sb, dec&&m.sb>m.sa, dec&&m.sb<m.sa)}</button>`;
}

      <div><span class="tag">Still in</span><span class="v">${rows.filter(r=>r.out===null).length}</span></div>

function topScorers(t){
  const tally = {};
  matchesOf(t.id).filter(m => m.status === "confirmed").forEach(m =>
    Object.entries(m.stats || {}).forEach(([pid, st]) => {
      tally[pid] = tally[pid] || { g: 0, a: 0, team: st.team };
      tally[pid].g += st.goals; tally[pid].a += st.assists;
    }));
  const rows = Object.entries(tally).filter(([, v]) => v.g || v.a).sort((x, y) => y[1].g - x[1].g || y[1].a - x[1].a).slice(0, 8);
  if (!rows.length) return ``;
  const L = statLabels(t.sport);
  return `<div class="tag" style="margin-top:6px"><em>//</em> Leading ${esc((L.g || "scorers").toLowerCase())}</div>

        <td class="num">${v.g}</td><td class="num">${v.a}</td></tr>`).join("")}
    </table></div>`;
}

/* — organizer manage — */

/* Feedback pass 1 spelled the organizer's job out as an order — appoint the
   referees, then draw, then set the kick-off and officials on each match — and
   the manage tab was a pile of panels that never said which of them was next.
   This is that order, drawn as the same trail a match result uses: every step
   carries its own count, exactly one is lit, and the lit one carries the button.
   Nothing here is new state; every step is derived on render. */
function setupTrail(t, approved, pend, need){
  const ms = t.drawn ? matchesOf(t.id).filter(m => m.note !== "bye" && m.status !== "void") : [];
  const ready = ms.filter(m => m.venue && (m.refs || []).length >= need);
  const done = ms.filter(m => m.status === "confirmed");
  const steps = [
    { ttl: "Appoint the referees",
      ok: (t.referees || []).length >= need,
      note: `${(t.referees || []).length} of ${need} accepted. An invitation counts only once it is answered.`,
      cta: `<button class="btn primary" data-act="refappoint" data-id="${t.id}">Appoint a referee</button>` },
    /* a tournament still waiting on an admin cannot be published at all, so the
       step states that rather than offering a button PERM.publish would refuse */
    { ttl: "Open it to the public",
      ok: t.status === "public",
      note: t.status === "public" ? "Squads can find it and enter."
        : t.status === "pending" ? "An admin has the request. Nothing to do until they answer it."
        : "Nobody can register while it is private, and LTMS deletes a private tournament on its match date.",
      cta: t.status === "private" ? `<button class="btn primary" data-act="publish" data-id="${t.id}">Open to public</button>` : "" },
    { ttl: "Approve the squads",
      ok: approved.length >= 2,
      note: `${approved.length} approved · ${pend.length} waiting on you · cap ${t.cap}. The hard filter has already refused anybody ineligible.` },
    { ttl: "Draw the bracket",
      ok: t.drawn,
      note: t.drawn ? `${esc(formatName(t))} — drawn, so entry is closed.`
        : `${esc(formatName(t))} — needs two approved squads, and closes entry for good.`,
      cta: `<button class="btn primary" data-act="draw" data-id="${t.id}">Generate bracket · random draw</button>` },
    { ttl: "Set every fixture",
      ok: ms.length > 0 && ready.length === ms.length,
      note: ms.length ? `${ready.length} of ${ms.length} have a venue and their officials on them.`
        : "Kick-off, venue and the officials, one match at a time.",
      cta: `<button class="btn primary" data-act="nav" data-h="#/t/${t.id}/schedule">Open the schedule</button>` },
    { ttl: "Results come in",
      ok: !!t.champion,
      note: t.champion ? `${esc(team(t.champion) ? team(t.champion).name : "Somebody")} won it.`
        : ms.length ? `${done.length} of ${ms.length} confirmed. A dispute lands back with you.`
        : "Referees record, leaders confirm, and a dispute lands back with you." },
  ];
  const now = steps.findIndex(x => !x.ok);
  return `<div class="panel vstack">
    <div class="spread"><span class="tag"><em>//</em> Running this tournament — where you are</span>
      ${now < 0 ? badge("ok", "Every step done") : badge("warn", `Step ${now + 1} of ${steps.length}`)}</div>
    <div class="trail">
      ${steps.map((x, i) => `<div class="st ${x.ok ? "done" : i === now ? "now" : "idle"}">
        <span class="mk">${x.ok ? ic("check",13) : i + 1}</span>
        <span class="bd"><span class="ttl">${esc(x.ttl)}</span>
          <span class="sub">${x.note}</span>
          ${i === now && x.cta ? `<span class="hstack" style="margin-top:4px">${x.cta}</span>` : ""}</span></div>`).join("")}
    </div>
  </div>`;
}

    </div>`,
    entry: () => `<div class="vstack" style="gap:8px">

/* Entry notes, edited in a modal: what an organizer expects beyond the hard filter.
   Rendered by both the trigger card in Entry & filter and entrynotesopen. */
function entryNotesForm(t){

    <div class="tag"><em>//</em> Soft filter</div>
